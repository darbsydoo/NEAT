<!DOCTYPE html>
<!--
  CONSTELLATIONS
  A flashcard deck for learning to recognise constellations in a real sky.
  Each card hides a constellation in a field of real background stars; you
  find the figure, then reveal it.

  SELF-CONTAINED BY DESIGN. No scripts, stylesheets, fonts or network calls
  of any kind — the whole deck is this one file, so it runs offline under a
  dark sky with no signal. Don't add external dependencies.

  DATA, two sources:
    CONSTELLATIONS[]  per-card. target[] = the figure's stars, neighbors[] =
                      named stars nearby that aren't part of it, lines[] =
                      the stick figure as pairs of star names. Each star
                      carries name, ra, dec, mag, bv.
    SKY_CATALOG[]     shared. Every Yale Bright Star Catalog entry to mag 5.0,
                      unnamed background. Shared rather than per-card because
                      the field pans and rotates far enough that any per-card
                      box eventually runs out of stars and shows blank sky.
  BSC_json.txt is a reference file used when authoring cards. It is NEVER
  loaded at runtime.

  THE THREE SYSTEMS MOST LIKELY TO BITE YOU, all interacting:

  1. FIELD OF VIEW / PLACEMENT. The figure's centroid is pinned to a fixed
     SCREEN position (panScreenX/Y), chosen once per load, and the sky field
     centre is derived from it at each zoom. The reverse — freezing a sky
     position and letting the screen position fall out — makes the figure
     slide across the card as you zoom. See applyPan().

  2. POLE GUARD. An RA/Dec window stops matching the real sky near the poles.
     MAX_FOV_H is a global default ceiling (wide, 160), independently
     overridable per card via `maxFovH` for cards where a narrower field
     avoids edge stretch (unset -> uses MAX_FOV_H). Pole
     safety is handled separately, in applyPan(): once a window's near-pole
     edge would cross POLE_GUARD, fieldCenterDec is clamped back toward the
     equator, so the figure drifts toward the near-pole edge of the card
     instead of staying screen-anchored. Dormant for any card that never
     gets that wide. Cassiopeia at declination 60 is the card this exists
     for.

  3. RA IS NOT DEC. A degree of RA is cos(dec) narrower on screen than a
     degree of declination. halfWidth is stored as raw RA degrees, so every
     comparison against the field width must go through effHalfExtents().
     Skipping it silently shrinks figures and over-restricts the slider.

  VISIBILITY is graded RELATIVE to the current magnitude limit, not absolutely.
  Whatever sits at the limit is always the faintest thing on screen, and colour
  washes toward white there too, because cones barely fire at low light. Both
  re-grade when the limit moves. See alphaForMag() and blendForMag().
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEAT</title>
<!-- Home-screen app setup (GitHub Pages). Harmless when opened as a local
     file: the manifest/icons simply don't load and the service worker is
     only registered over https. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEAT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#060914">
<style>
  :root {
    --void: #04060d;
    --void-deep: #010207;
    --chrome: #b9c2d6;
    --chrome-dim: #5b6478;
    --accent: #d9a25c;
    --accent-dim: #7a5d33;
    --card-edge: #171d2e;
    --reveal: rgb(220, 60, 50);   /* same red the figure stars turn on reveal */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void-deep);
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    /* No top padding: the swipe hint sits right up against the top edge,
       which also hands the extra height to the card. Left/right padding
       removed per user request — the card now runs edge to edge; bottom
       padding kept so the swipe-hint text isn't flush against the very
       bottom of the screen. */
    padding: 0 0 18px 0;
    gap: 10px;
  }

  .topbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Top-aligned rather than centred: previously pinned the swipe hint to
       the top edge; now just keeps the name from floating mid-block. */
    justify-content: flex-start;
    /* Centred text, but still give it the same margin as the slider
       readouts — a long constellation name could otherwise run close to
       the true edge now that .stage itself has none. */
    padding: 0 12px;
    /* Reserved so the sliders and card don't shift when the name appears.
       Was 62px to also fit the swipe hint (now moved below the buttons —
       see .swipe-hint) — tall enough for just the English name and the
       Chinese line beneath it. */
    min-height: 46px;
  }

  /* A quiet reminder that home is one swipe away — easy to miss once you're
     a few cards into a deck, especially for anyone new to the app. Sits
     below the reveal/reset buttons, out of the way of the card and the
     sliders, and stays out of the index, where it doesn't apply. Now shown
     during the slideshow too — swiping up stops it and goes home instead of
     just opening the index behind it. */
  .swipe-hint {
    width: 100%;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.12em;
    margin-top: 10px;
    /* Same amber as the lit-up reveal-more button (--accent) — the green
       (#69dcb4, then #4fe8ac) read as too hard to see against the dark
       card either way. */
    color: var(--accent);
    text-transform: uppercase;
    opacity: 0.9;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    /* The card/buttons/dots run edge to edge now (see .stage), but the
       readout text here ("field of view 38°" etc.) needs its own margin or
       it clips against the true screen edge — .stage no longer provides one. */
    padding: 0 12px;
  }

  .slider-row.fov {
    margin-bottom: 10px;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
  }

  .fov-slider-line {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .fov-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--chrome-dim);
    text-transform: lowercase;
    letter-spacing: 0.04em;
    /* Matches the readout's width + gap so the ticks span only the slider
       itself, not the readout column beside it. */
    padding-right: 118px;
  }

  /* The touch target is the element's own box, not the visible dot. At the
     old height of 2px only the hairline track was actually touchable, so a
     drag starting on the dot usually missed and did nothing. The element is
     now 20px tall with the visible line moved onto the track pseudo-element,
     and the extra height is cancelled by negative margins so nothing on the
     page moves — the target just grows into existing whitespace. 20px clears
     both neighbours; going much past that would start overlapping them. */
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 30px;
    /* Extended sideways as well as vertically. With the thumb parked at
       either end, half of it sits right on the boundary of the input's box,
       so a touch landing slightly beyond — easy to do near a screen edge —
       hits nothing at all. The negative side margins push the catchable area
       past the ends of the track. */
    margin: -14px -10px;
    padding: 0 10px;
    background: transparent;
    outline: none;
    /* Without this the browser holds the first touch back while it works out
       whether the gesture is a scroll, which is what made the sliders feel
       reluctant to start — they'd ignore the beginning of a drag and only
       catch up once it had committed. Nothing here scrolls, so there's
       nothing to wait for. */
    touch-action: none;
  }

  .slider-row input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--card-edge);
    border-radius: 2px;
  }

  .slider-row input[type="range"]::-moz-range-track {
    height: 2px;
    background: var(--card-edge);
    border-radius: 2px;
  }

  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(217, 162, 92, 0.5);
    /* Recentre the thumb on the 2px track now that the track is its own
       element: (track height - thumb height) / 2. */
    margin-top: -8px;
  }

  .slider-row input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* Mirrored so narrow sits on the left and wide on the right, which is the
     way people expect a zoom control to read. Purely visual: the value,
     storage and readout are untouched, and the thumb still follows the
     finger because the browser mirrors hit-testing along with rendering. */
  .slider-row.fov input[type="range"] {
    transform: scaleX(-1);
  }

  .slider-row.fov input[type="range"]::-webkit-slider-thumb {
    background: var(--chrome);
    box-shadow: 0 0 6px rgba(185, 194, 214, 0.5);
  }

  .slider-row.fov input[type="range"]::-moz-range-thumb {
    background: var(--chrome);
  }

  .readout {
    font-size: 12px;
    color: var(--chrome-dim);
    width: 108px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .deck {
    position: relative;
    flex: 1;
    overflow: hidden;
    border-radius: 18px;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: radial-gradient(ellipse at 50% 30%, #0a0e1c 0%, var(--void) 65%, #020308 100%);
    border: 1px solid var(--card-edge);
    overflow: hidden;
    touch-action: none;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  /* Lives above the card rather than on top of it — printed over the sky it
     hid whichever stars happened to be under it, which on a card about
     finding stars is the wrong trade. The strip above was empty anyway. */
  .name-reveal {
    width: 100%;
    text-align: center;
    font-size: 21px;
    letter-spacing: 0.08em;
    color: var(--reveal);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
    font-weight: 500;
  }

  .name-reveal.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Chinese name + pinyin sit under the English name, smaller and dimmer,
     so the reveal reads as one block without competing for attention. */
  .name-reveal .zh {
    display: block;
    margin-top: 5px;
    font-size: 15px;
    letter-spacing: 0.05em;
    color: var(--reveal);
    font-weight: 400;
  }

  .name-reveal .zh .py {
    margin-left: 8px;
    font-style: italic;
  }

  .hint { display: none; }

  .slider-row.hidden { display: none; }
  /* During the slideshow both sliders are driven by the show itself. Watching
     them crawl about on their own is a distraction, so they go invisible —
     but keep their space, so nothing below them shifts. */
  .slider-row.muted { visibility: hidden; }

  .tooltip {
    position: absolute;
    padding: 7px 11px;
    background: rgba(10, 13, 24, 0.92);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--chrome);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 5;
  }

  /* Tappable once shown: the box itself is the target for opening the info
     panel, which is why it carries the (i). The whole box is the tap zone,
     not just the glyph. */
  .tooltip.show { opacity: 1; }
  /* Only a box with something behind it swallows taps; otherwise the tap
     falls through to the sky, where it dismisses as usual. */
  .tooltip.show.tappable { pointer-events: auto; }
  .tooltip.tappable { padding-right: 26px; }
  .tooltip .tt-i {
    position: absolute;
    right: 7px;
    bottom: 5px;
    font-size: 14px;
    color: var(--chrome);
    line-height: 1;
  }

  /* Opens in the quadrant diagonally opposite the tapped star, so it never
     lands on the star being explained. It will cover other parts of the
     figure, which is fine — it's open only while you're reading it. */
  .info-panel {
    position: absolute;
    width: 72%;
    max-width: 268px;
    padding: 12px 13px 13px 13px;
    background: rgba(10, 13, 24, 0.96);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    font-size: 12px;
    color: var(--chrome);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 6;
  }

  .info-panel.show { opacity: 1; pointer-events: auto; }

  .info-close {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 10.5px;
    color: var(--chrome-dim);
    letter-spacing: 0.06em;
  }

  /* Name and distance are each kept whole. Left to wrap freely the line broke
     wherever it ran out of room — a lone Greek letter stranded on the first
     line, or "~140" split from its "ly". Now the two are unbreakable units and
     the distance drops entirely to the next line when it won't fit. */
  .info-panel .ip-name {
    font-size: 17px;
    letter-spacing: 0.04em;
    padding-right: 42px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 10px;
  }
  .info-panel .ip-name > span { white-space: nowrap; }
  .info-panel .ip-line { color: var(--chrome-dim); margin-top: 2px; }
  .info-panel .ip-code {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.08em;
  }
  /* The two decode rows: what the numeral means, then what the letter means.
     Single-spaced (was line-height 1.45 with a 5px gap) — read as too loose
     for three short data lines stacked together. */
  .info-panel .ip-key,
  .info-panel .ip-size { margin-top: 3px; line-height: 1.2; }
  .info-panel .ip-key b,
  .info-panel .ip-size b { font-weight: 600; margin-right: 6px; }
  /* The size line reads as the headline of the two, so it runs larger. */
  .info-panel .ip-size { font-size: 13.5px; }
  .info-panel .ip-temp { margin-left: 9px; }
  .info-panel .ip-mass {
    margin-top: 5px;
    font-size: 14px;
    letter-spacing: 0.03em;
  }
  .info-panel .ip-notable {
    margin-top: 7px;
    padding-top: 8px;
    border-top: 1px solid var(--card-edge);
    color: #eef1f8;
    line-height: 1.42;
    font-size: 13px;
  }
  .info-panel .ip-notable b {
    display: block;
    color: var(--chrome);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }
  .info-panel sup { font-size: 0.7em; }
  .tooltip .mag { color: var(--chrome-dim); margin-left: 6px; }

  /* The two "reveal more" popup boxes — star info (left) and notable-feature
     blurb (right), shown side by side so the eye takes both in at once. Same
     visual language as .info-panel but smaller, since two share the card at
     once. Positioned in JS: whichever horizontal half (top/bottom) the named
     star ISN'T in, so the boxes never sit on top of the very star they're
     about. */
  .more-box {
    position: absolute;
    left: 0; right: 0;   /* actual left/right set in JS to pad+'px'; this
                            just establishes the box stretches rather than
                            sizing to content, now that it's the only box
                            on whichever half of the card it's in */
    max-width: 340px;
    margin: 0 auto;
    padding: 9px 10px;
    background: rgba(10, 13, 24, 0.96);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    /* Was 11.5px — too small next to the tap-to-open panel's equivalent
       lines (.ip-line etc., 12px base with .ip-code at 15px); this box's
       distance/type/mass lines read noticeably smaller for the same data. */
    font-size: 13px;
    line-height: 1.4;
    color: var(--chrome);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 6;
  }
  .more-box.show { opacity: 1; }
  .more-box .mb-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  /* Was --chrome-dim (too hard to read); the type line already overrides
     this per-star via inline colour (colorForBV), so this default now only
     ever applies to the distance line — brightened to match .mb-mass. */
  .more-box .mb-line { color: var(--chrome); margin-top: 1px; line-height: 1.15; }
  .more-box .mb-mass { color: var(--chrome); margin-top: 2px; font-size: 14.5px; line-height: 1.15; }
  /* Header for the notable section within the combined box — a divider
     rather than another .mb-name, so it reads as a second section of one
     box (star data, then notable) rather than two stacked headers. */
  .more-box .mb-notable-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--chrome-dim);
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid var(--card-edge);
  }
  /* The notable blurb specifically — was sharing .mb-line's dim colour,
     which read as too hard to see against the dark card. Brighter and a
     touch larger; kept on its own class so the plain distance/type lines
     above stay compact and dim as before. */
  .more-box .mb-notable-text {
    color: #eef1f8;
    font-size: 13px;
    line-height: 1.42;
    margin-top: 3px;
  }
  .tooltip .tt-head { font-size: 12.5px; }
  .tooltip .tt-sub { color: var(--chrome-dim); margin-top: 2px; }
  .tooltip .tt-type { margin-top: 2px; font-weight: 500; letter-spacing: 0.06em; }

  /* ---- NEAT intro ---- */
  /* Fixed to the viewport, not the card, and above everything (index overlay
     tops out at z-index 20) — this plays before the app itself is even
     shown to the user. */
  .intro-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--void-deep);
    display: none;
  }
  .intro-overlay.show { display: block; }
  #introCanvas { display: block; width: 100%; height: 100%; }

  /* A visible way out, rather than relying on the whole screen being a
     hidden tap target. Sits along the bottom, clear of the artwork. */
  .intro-skip {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 40px;
    padding: 15px 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    color: #cfe0ff;
    background: rgba(48, 92, 170, 0.30);
    border: 1px solid rgba(120, 165, 240, 0.55);
    border-radius: 11px;
    cursor: pointer;
  }

  /* ---- Index card overlay ---- */
  .index-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(2, 3, 8, 0.97);
    border-radius: 18px;
    display: none;
    flex-direction: column;
    padding: 28px 20px;
  }

  .index-overlay.show { display: flex; }

  /* Start and the rotation toggle share a row. Start keeps the full width of
     what's left over, so it stays large and sits just left of centre, while
     the toggle is parked off to the right where it won't be hit by accident
     when reaching for start. */
  .index-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0 18px 0;
    border-bottom: 1px solid var(--card-edge);
    margin-bottom: 18px;
  }

  /* Two square-ish buttons, each a word stacked over a word. */
  .index-btn {
    flex: 1;
    text-align: center;
    font-size: 14px;
    line-height: 1.12;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    border: 1px solid var(--accent-dim);
    border-radius: 9px;
    padding: 7px 4px;
  }
  .index-btn span { display: block; }

  /* Stage 36: deck choice | flash deck | slide show. Deck choice is the
     widest, flash deck slightly narrower, slide show slightly narrower
     again. The deck-choice column also carries the current group name
     underneath, so the row aligns to the top rather than the centre. */
  .index-head { align-items: flex-start; }
  .deck-choice-wrap { flex: 1.22 1 0; display: flex; flex-direction: column; min-width: 0; }
  .deck-choice-wrap .index-btn { flex: none; }
  .flash-btn { flex: 1 1 0; }
  .slide-btn { flex: 0.84 1 0; }
  /* Left-aligned and allowed to run on under the flash-deck button, so
     long group names ("Winter Triangle & friends") show in full rather
     than being cut off at the deck-choice button's width. */
  .deck-choice-state {
    margin-top: 5px;
    padding-left: 2px;
    text-align: left;
    font-size: 11px;
    color: var(--chrome-dim);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: visible;
  }

  /* Deck choice pop-up: same surface as the latitude city panel. The
     backdrop sits under it and closes it on an outside tap, so that tap
     never reaches the constellation rows beneath. */
  .deck-backdrop { position: absolute; inset: 0; z-index: 29; display: none; }
  .deck-backdrop.show { display: block; }
  .deck-panel { width: 86%; max-height: 80%; }
  .deck-top { display: flex; gap: 8px; margin-bottom: 12px; }
  .deck-top-btn {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 9px;
    padding: 7px 0;
    white-space: nowrap;
    cursor: pointer;
  }
  .deck-top-btn#deckClose { color: var(--chrome-dim); border-color: var(--card-edge); }
  .deck-group {
    padding: 9px 2px;
    border-top: 1px solid var(--card-edge);
    cursor: pointer;
  }
  .deck-group.active .deck-group-name { color: var(--accent); }
  .deck-group-name { font-size: 14.5px; color: var(--chrome); }
  .deck-group-members { font-size: 11.5px; color: var(--chrome-dim); margin-top: 3px; line-height: 1.35; }

  /* The .disabled class was being applied correctly by
     paintSlideAvailability() but had no styling to attach to — the rule
     below it is .btn.disabled, and these are .index-btn, not .btn. So an
     all-off deck left both buttons looking fully live. */
  .index-btn.disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  /* Deck-wide setting, parked in the index so the star cards stay clean.
     Width is fixed rather than shrink-to-fit: "all: off" is a wider string
     than "all: 1", so letting the box size itself made all three controls in
     the row jump width every time the master switch was tapped. */
  .index-rotation {
    flex: 0 0 auto;
    width: 74px;
    text-align: center;
    font-size: 12px;
    color: var(--chrome-dim);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 7px 0;
    white-space: nowrap;
  }

  .index-rotation.on {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  /* ---- Global magnitude control ---- */
  .global-mag {
    /* No bottom border: a full-width horizontal rule directly under the tick
       labels read as a third, dead slider track. */
    padding: 0 2px 16px 2px;
    margin-bottom: 12px;
  }

  /* Magnitude and latitude share one row. Magnitude keeps the larger share
     because it's adjusted often and wants the precision; latitude is a
     set-once global that only changes if you travel, so a short track
     stepping in 5-degree jumps is plenty. */
  .settings-row {
    display: flex;
    align-items: flex-start;
    /* Generous gap plus a rule between them: at 14px the two tracks read as
       one long slider with a gap in it rather than two separate controls. */
    gap: 20px;
  }
  .settings-mag { flex: 1 1 0; min-width: 0; }
  /* Same amber as the flash-deck / slide-show borders, so it reads as part of
     the existing chrome rather than a new decoration. */
  .settings-lat {
    flex: 0 0 104px;
    border-left: 1px solid var(--accent-dim);
    padding-left: 20px;
  }
  /* In the split row the full 108px readout is oversized and forces the
     label to wrap, which drops the magnitude slider out of line with the
     latitude one beside it. */
  .settings-mag .readout { width: auto; }
  .settings-mag .global-mag-header {
    white-space: nowrap;
    /* Pull the label group left so "mag 3.5" isn't crowding the latitude
       readout across the divider. */
    justify-content: flex-start;
    gap: 14px;
  }

  .lat-header {
    display: flex;
    align-items: center;
    /* Readout centred over its own track. Left-justified it sat hard against
       the magnitude column and read as part of those settings. */
    justify-content: center;
    position: relative;
    font-size: 13px;
    color: var(--chrome);
    margin-bottom: 10px;
    gap: 6px;
    /* Matches the magnitude header, which is taller because of its on/off
       pill — without this the two slider tracks sit 8px out of line. */
    min-height: 25px;
  }
  .lat-header .readout {
    width: auto;
    color: var(--chrome);
  }

  /* Small circled question mark. Opens the city reference list — the cities
     would have eaten the tick row permanently, and you only need them once,
     when you're working out your own number. */
  .lat-help {
    /* Pinned right so it doesn't drag the centred readout off-centre. */
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border: 1px solid var(--chrome);
    border-radius: 50%;
    color: var(--chrome);
    font-size: 13px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
  }

  .lat-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--chrome);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  /* Reuses the info-panel look so the city list feels like the rest of the
     app rather than a new kind of surface. */
  .city-panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 76%;
    max-height: 70%;
    overflow-y: auto;
    /* Same surface as the star info panel — there is no --panel-bg variable;
       the info panel hardcodes this value. */
    background: rgba(10, 13, 24, 0.98);
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    padding: 16px 18px 14px 18px;
    z-index: 30;
    display: none;
  }
  .city-panel.show { display: block; }

  /* First-run guide (9-25 ver8). guide-lat: everything on the home screen
     is dimmed and untouchable except the latitude control, the city list
     and the message. guide-pulse: slow green pulse on the button to press
     next. */
  .guide-msg {
    position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%);
    z-index: 31; display: none;
    padding: 10px 18px; border-radius: 10px;
    background: rgba(10, 13, 24, 0.98); border: 1px solid var(--accent-dim);
    color: var(--accent); font-size: 15px; letter-spacing: 0.04em; white-space: nowrap;
  }
  .index-overlay.guide-lat .guide-msg.show { display: block; }
  .index-overlay.guide-lat .settings-mag,
  .index-overlay.guide-lat .index-head,
  .index-overlay.guide-lat .index-list {
    opacity: 0.06; pointer-events: none;
  }
  .index-overlay.guide-lat .settings-row { border-color: transparent; }
  /* Keep the city list clear of the latitude slider at the top. */
  .index-overlay.guide-lat #cityPanel { top: 66%; max-height: 50%; }
  @keyframes guidePulse {
    0%, 100% { box-shadow: 0 0 0 rgba(80,255,120,0); }
    50% { box-shadow: 0 0 16px rgba(80,255,120,0.6); border-color: rgb(80,255,120); color: rgb(130,255,160); }
  }
  .index-btn.guide-pulse { animation: guidePulse 2s ease-in-out infinite; }
  .city-panel-title {
    font-size: 12px;
    color: var(--chrome-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .city-row {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    color: var(--chrome);
    padding: 5px 0;
    cursor: pointer;
  }
  .city-row span:last-child {
    color: var(--chrome-dim);
    font-variant-numeric: tabular-nums;
  }
  .city-close {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    color: var(--chrome-dim);
    letter-spacing: 0.08em;
    cursor: pointer;
  }

  .global-mag-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--chrome);
    margin-bottom: 10px;
  }

  /* The shared .readout class is deliberately dim everywhere else -- the
     per-card sliders sit right next to their own numbers and don't need the
     extra weight. This panel is different: it's read from further away and
     wants full contrast. */
  .global-mag-header .readout { color: var(--chrome); }

  .global-mag-label-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .global-mag-toggle {
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 4px 12px;
    color: var(--chrome-dim);
  }

  .global-mag-toggle.on {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  /* Same 2px touch-target problem as the card sliders — see the note there.
     This one sits in the index overlay with more room around it, so it can
     take a slightly taller target without needing margin compensation. */
  .global-mag input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 34px;
    margin: -16px 0;
    background: transparent;
    outline: none;
    touch-action: none;
    opacity: 0.4;
    transition: opacity 0.25s ease;
  }

  .global-mag input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--card-edge);
    border-radius: 2px;
  }

  .global-mag input[type="range"]::-moz-range-track {
    height: 2px;
    background: var(--card-edge);
    border-radius: 2px;
  }

  .global-mag input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--chrome-dim);
    cursor: pointer;
    margin-top: -8px;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .global-mag input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border: none;
    border-radius: 50%;
    background: var(--chrome-dim);
    cursor: pointer;
  }

  /* The on/off state belongs to the MAGNITUDE control only. These were
     written as `.global-mag input[type=range]`, which also caught #latSlider
     once latitude moved into this panel — so switching global magnitude off
     dimmed the latitude slider too, as if it had been disabled. Scoped to the
     magnitude slider by id. */
  .global-mag.on #globalMagSlider { opacity: 1; }

  .global-mag.on #globalMagSlider::-webkit-slider-thumb {
    background: var(--accent);
    box-shadow: 0 0 6px rgba(217, 162, 92, 0.5);
  }

  .global-mag.on #globalMagSlider::-moz-range-thumb {
    background: var(--accent);
  }

  /* Latitude is never "off", so it always reads as live. */
  #latSlider { opacity: 1; }
  #latSlider::-webkit-slider-thumb {
    background: var(--accent);
    box-shadow: 0 0 6px rgba(217, 162, 92, 0.5);
  }
  #latSlider::-moz-range-thumb { background: var(--accent); }

  .global-mag-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--chrome);
    margin-top: 2px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
  }

  .index-list {
    overflow-y: auto;
    flex: 1;
  }

  /* Two columns once the list is long enough that scrolling one becomes
     tedious -- alphabetical, first half on the left, second half on the
     right, splitting evenly down the middle of the card. */
  .index-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-flow: column;
    column-gap: 14px;
    /* grid-auto-flow:column needs an explicit row count to know when to
       wrap into the second column -- without it every item claims its own
       implicit column instead. Row count is set from JS in buildIndexList,
       since it depends on how many constellations exist. */
  }

  .index-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 2px;
    font-size: 15px;
    color: var(--chrome);
    border-bottom: 1px solid var(--card-edge);
  }

  /* Switch sits to the left of the name so the whole list reads as one
     aligned column of controls with names trailing off to the right. */
  .index-item .index-freq { order: -1; flex: 0 0 auto; }
  /* The navigation target starts at the label, not at the row edge. The
     3/1/off switch and the constellation name sat close enough that aiming
     for the switch often caught the row instead and jumped to the card.
     The gap between them is now dead space belonging to neither. */
  .index-item .index-hit {
    flex: 1;
    min-width: 0;
    padding-left: 6px;
  }
  .index-item .index-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Dropped from the deck: dimmed, but no longer inert. Tapping a dimmed row
     is now how you turn a single constellation back on, so the whole row
     stays a live target rather than needing the switch tapped separately. */
  .index-item.off { color: var(--chrome-dim); opacity: 0.45; }
  .index-item.off .index-freq { opacity: 1; }
  .index-freq {
    font-size: 13px;
    color: var(--chrome);
    border: 1px solid var(--chrome-dim);
    border-radius: 8px;
    padding: 5px 11px;
    text-transform: lowercase;
  }
  .index-freq.out {
    color: #8a6868;
    border-color: #4a3535;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding-top: 2px;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--card-edge);
    transition: background 0.2s ease;
  }

  .dot.active { background: var(--accent); }

  .controls {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 11px 0;
    border-radius: 10px;
    border: 1px solid var(--card-edge);
    background: #0a0e1c;
    color: var(--chrome-dim);
    font-size: 13px;
    text-align: center;
  }

  .btn.active {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .btn.disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  /* Slide player controls: muted rather than bright, since they sit under a
     dark sky and shouldn't pull the eye away from the card. */
  .btn.slide-pause { color: #c8a24e; border-color: #6b5a2e; }
  .btn.slide-play  { color: #6fae72; border-color: #3c6b3e; }
  .btn.slide-leave { color: #b05c58; border-color: #6b3532; }

  /* Reveal-more, lit up while paused on a notable star's boxes, waiting for
     a tap to continue (see advanceMoreSeq). Pulses gently so it reads as
     "waiting on you" rather than just another static button state. */
  .btn.more-continue {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(217, 162, 92, 0.10);
    animation: moreContinuePulse 1.6s ease-in-out infinite;
  }
  /* resetBtn, lit the same way once reveal-more finishes entirely on its
     own (every neighbour has displayed) — same "something's waiting on
     you" language as more-continue, just on the other button, marking the
     card as fully explored rather than mid-sequence. */
  .btn.more-done {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(217, 162, 92, 0.10);
    animation: moreContinuePulse 1.6s ease-in-out infinite;
  }
  @keyframes moreContinuePulse {
    0%, 100% { box-shadow: 0 0 0 rgba(217, 162, 92, 0); }
    50% { box-shadow: 0 0 10px rgba(217, 162, 92, 0.55); }
  }
</style>
</head>
<body>

<div class="intro-overlay" id="introOverlay">
  <canvas id="introCanvas"></canvas>
  <div class="intro-skip" id="introSkip">tap to skip</div>
</div>

<div class="stage">
  <div class="topbar">
    <div class="name-reveal" id="nameReveal"></div>
  </div>

  <div class="slider-row fov" id="fovRow">
    <div class="fov-slider-line">
      <input type="range" id="fovSlider" min="0.25" max="0.65" step="0.01" value="0.33">
      <div class="readout" id="fovReadout">field of view</div>
    </div>
    <div class="fov-ticks"><span>narrow</span><span>wide</span></div>
  </div>

  <div class="slider-row" id="magRow">
    <input type="range" id="magSlider" min="1.5" max="5.1" step="0.1" value="5.0">
    <div class="readout" id="magReadout">limit mag 5.0</div>
  </div>

  <div class="deck" id="deck">
    <div class="card" id="card">
      <canvas id="sky"></canvas>
      <div class="tooltip" id="tooltip"></div>
      <div class="info-panel" id="infoPanel"><div class="info-close" id="infoClose">close</div><div id="infoBody"></div></div>
      <div class="more-box" id="moreInfoBox"></div>
    </div>
    <div class="index-overlay" id="indexOverlay">
      <div class="global-mag" id="globalMag">
        <div class="settings-row">
          <div class="settings-mag">
            <div class="global-mag-header">
              <span class="global-mag-label-group">
                <span>global mag</span>
                <span class="global-mag-toggle" id="globalMagToggle">off</span>
              </span>
              <span class="readout" id="globalMagReadout">mag 3.5</span>
            </div>
            <input type="range" id="globalMagSlider" min="1.5" max="5.0" step="0.1" value="3.5">
            <div class="global-mag-ticks">
              <span>urban</span><span>suburban</span><span>rural</span>
            </div>
          </div>
          <div class="settings-lat">
            <div class="lat-header">
              <span class="readout" id="latReadout">25°N</span>
              <span class="lat-help" id="latHelp">?</span>
            </div>
            <input type="range" id="latSlider" min="-60" max="70" step="5" value="25">
            <div class="lat-ticks">
              <span>60S</span><span>0</span><span>70N</span>
            </div>
          </div>
        </div>
      </div>
      <div class="index-head">
        <div class="deck-choice-wrap">
          <div class="index-btn deck-choice-btn" id="deckChoice"><span>deck</span><span>choice</span></div>
          <div class="deck-choice-state" id="deckChoiceState">custom</div>
        </div>
        <div class="index-btn flash-btn" id="indexStart"><span>flash</span><span>deck</span></div>
        <div class="index-btn slide-btn" id="indexSlides"><span>slide</span><span>show</span></div>
      </div>
      <div class="index-list" id="indexList"></div>
      <div class="deck-backdrop" id="deckBackdrop"></div>
      <div class="city-panel deck-panel" id="deckPanel">
        <div class="deck-top">
          <div class="deck-top-btn" id="deckAllOn">all: 1</div>
          <div class="deck-top-btn" id="deckAllOff">all: off</div>
          <div class="deck-top-btn" id="deckClose">close</div>
        </div>
        <div id="deckGroupList"></div>
      </div>
      <div class="guide-msg" id="guideMsg">Set your latitude first</div>
      <div class="city-panel" id="cityPanel">
        <div class="city-panel-title">viewing latitude</div>
        <div id="cityList"></div>
        <div class="city-close" id="cityClose">close</div>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <div class="btn" id="revealBtn">reveal</div>
    <div class="btn" id="resetBtn">reset card</div>
  </div>
  <div class="swipe-hint" id="swipeHint">swipe up for home</div>
</div>

<script>
(function () {
  // =========================================================================
  // CONSTELLATION DATA
  // Each entry: target stars (the figure), neighbor stars (nearby named
  // stars used for context, not part of the figure), catalog stars (real
  // background points from the Yale Bright Star Catalog), and field-fit
  // geometry (centroid + half-width/height of the figure's true angular
  // extent, in degrees).
  // =========================================================================
  const CONSTELLATIONS = [
    {
      id: "orion",
      name: "Orion",
      chineseName: "獵戶座",
      pinyin: "liè hù zuò",
      chineseMeaning: "the hunter",
      centroidRA: 82.72,
      centroidDec: 5.30,
      halfWidth: 10.26,
      // Orion is compact enough that the usual 0.65 ceiling still leaves it
      // smaller on screen than it wants to be, so it gets a tighter one.
      maxFraction: 0.82,
      maxFovH: 80.2,
      halfHeight: 14.97,
      defaultFraction: 0.33,

      // Stick figure: shoulders, belt, knees, plus the club arm, the head and
      // the shield arc of pi stars.
      lines: [
        ["Betelgeuse","Bellatrix"],
        ["Bellatrix","Mintaka"], ["Alnitak","Betelgeuse"],
        ["Mintaka","Alnilam"], ["Alnilam","Alnitak"],
        ["Mintaka","Rigel"], ["Alnitak","Saiph"],
        ["Betelgeuse","Meissa"], ["Meissa","Bellatrix"],
        ["Betelgeuse","Mu Orionis"],
        ["Mu Orionis","Nu Orionis"], ["Mu Orionis","Xi Orionis"],
        ["Nu Orionis","Xi Orionis"],
        ["Xi Orionis","Chi2 Orionis"], ["Nu Orionis","Chi1 Orionis"],
        ["Bellatrix","Tabit"],
        ["Pi1 Orionis","Pi2 Orionis"], ["Pi2 Orionis","Tabit"],
        ["Tabit","Pi4 Orionis"], ["Pi4 Orionis","Pi5 Orionis"],
        ["Pi5 Orionis","Pi6 Orionis"]
      ],

      // Star names shown during the slideshow. A few brightest plus
      // anything notable regardless of magnitude — not every star, which
      // would bury the figure under labels.
      // Saiph swapped for Alnilam: Saiph (mag 2.06) was actually the
      // second-faintest of the seven figure stars, with no story beyond
      // brightness. Alnilam is brighter (mag 1.70, 4th brightest) and is
      // the most massive/luminous star on this whole card (40 M☉, one of
      // the most luminous supergiants known) — it's also the defining
      // star of Orion's Belt itself, the constellation's most recognizable
      // asterism.
      // 9-25 ver3: the Orion Nebula takes Chi2 Orionis's label slot (user
      // request). Chi2 stays in the figure and keeps its notable data, which
      // still shows if it is tapped.
      labels: ["Betelgeuse", "Rigel", "Alnilam", "Orion Nebula"],

      target: [
        // Masses looked up individually per star (literature/parallax-based
        // figures, not the app's generic spectral-type estimate) rather
        // than relying on massFor()'s type-based lookup, which was flagged
        // as inaccurate for evolved giants/supergiants — exactly what most
        // of Orion is. Three are worth flagging as genuinely, not just
        // provisionally, uncertain: Betelgeuse (10-20 across sources,
        // ~11 "current" post mass-loss vs ~19 "initial" pre mass-loss —
        // used 17 as a rough middle), Rigel (18-24, used 21), and Alnitak
        // (28-33 for the Aa component depending on source, used 28). Pi2
        // Orionis has no mass in its own literature; estimated from its
        // radius/luminosity/temperature being close to Vega's.
        { name: "Betelgeuse", ra: 88.793, dec: 7.407, mag: 0.5, bv: 1.85, target: true, dist: 550, type: "M Ia", mass: 17, notable: "A red supergiant near the end of its life — a supernova candidate. Only a few million years old, but burning through fuel fast enough to already be dying." },
        { name: "Rigel", ra: 78.635, dec: -8.202, mag: 0.12, bv: -0.03, target: true, dist: 860, type: "B8 Ia", mass: 21, notable: "One of the most luminous stars visible to the naked eye. A hot supergiant, shedding mass steadily into its own stellar wind." },
        { name: "Bellatrix", ra: 81.283, dec: 6.35, mag: 1.64, bv: -0.22, target: true, dist: 250, type: "B2 III", mass: 9 },
        { name: "Mintaka", ra: 83.002, dec: -0.299, mag: 2.23, bv: -0.2, target: true, dist: 1200, type: "O II", mass: 24 },
        { name: "Alnilam", ra: 84.053, dec: -1.202, mag: 1.7, bv: -0.18, target: true, dist: 2000, type: "B0 Ia", mass: 40, notable: "A very luminous supergiant. At 40 M☉, like most supergiants, a future black hole." },
        { name: "Alnitak", ra: 85.19, dec: -1.943, mag: 2.05, bv: -0.2, target: true, dist: 1260, type: "O Ib", mass: 28 },
        { name: "Saiph", ra: 86.939, dec: -9.67, mag: 2.06, bv: -0.17, target: true, dist: 650, type: "B0.5 Ia", mass: 16 },
        { name: "Meissa", ra: 83.785, dec: 9.934, mag: 3.54, bv: -0.16, target: true, dist: 1100, type: "O III", mass: 28 },
        { name: "Mu Orionis", ra: 90.596, dec: 9.647, mag: 4.12, bv: 0.14, target: true, dist: 152, type: "A V", mass: 2 },
        { name: "Nu Orionis", ra: 91.893, dec: 14.768, mag: 4.42, bv: -0.1, target: true, dist: 520, type: "B3 IV", mass: 7 },
        { name: "Xi Orionis", ra: 92.985, dec: 14.209, mag: 4.48, bv: -0.18, target: true, dist: 620, type: "B3 IV", mass: 7 },
        { name: "Chi1 Orionis", ra: 88.595, dec: 20.276, mag: 4.41, bv: 0.59, target: true, dist: 28, type: "G V", mass: 1 },
        { name: "Tau Orionis", ra: 79.402, dec: -6.844, mag: 3.6, bv: -0.11, target: true, dist: 555, type: "B5 III", mass: 6 },
        { name: "Pi1 Orionis", ra: 73.724, dec: 10.151, mag: 4.65, bv: 0.08, target: true, dist: 120, type: "A V", mass: 2 },
        { name: "Pi2 Orionis", ra: 72.653, dec: 8.9, mag: 4.36, bv: 0.02, target: true, dist: 190, type: "A V", mass: 2 },
        { name: "Tabit", ra: 72.46, dec: 6.961, mag: 3.19, bv: 0.45, target: true, dist: 26.3, type: "F V", mass: 1 },
        { name: "Pi4 Orionis", ra: 72.802, dec: 5.605, mag: 3.69, bv: -0.17, target: true, dist: 1300, type: "B2 III", mass: 11 },
        { name: "Pi5 Orionis", ra: 73.563, dec: 2.441, mag: 3.72, bv: -0.18, target: true, dist: 1300, type: "B2 III", mass: 12 },
        { name: "Pi6 Orionis", ra: 74.637, dec: 1.714, mag: 4.47, bv: 1.4, target: true, dist: 950, type: "K II", mass: 4 },

  // =========================================================================
  // PER-CONSTELLATION SETTINGS PERSISTENCE (limit magnitude, keyed by id)
  // =========================================================================
  const MAG_PREFIX = "constellation-deck:mag:";
  function loadSetting(prefix, id, fallback) {
    try {
      const v = window.localStorage.getItem(prefix + id);
      return v !== null ? parseFloat(v) : fallback;
    } catch (e) { return fallback; }
  }
  function saveSetting(prefix, id, value) {
    try { window.localStorage.setItem(prefix + id, value); } catch (e) {}
  }
  // Magnitude is stored per constellation too: the limit that makes Aquarius
  // readable is not the one that makes Orion a challenge.
  const loadMag = (id, fallback) => loadSetting(MAG_PREFIX, id, fallback);
  const saveMag = (id, value) => saveSetting(MAG_PREFIX, id, value);

  // Global magnitude: a single deck-wide override. When on, every card
  // loads at this value instead of its own saved magnitude, and per-card
  // writes are suppressed so nothing gets overwritten while it's active —
  // switching it off restores whatever was last individually saved.
  const GLOBAL_MAG_ON_KEY = "constellation-deck:globalMagOn";
  const GLOBAL_MAG_VALUE_KEY = "constellation-deck:globalMagValue";

  // Viewing latitude. A set-once global -- it only changes if you travel --
  // so it lives in the index rather than on the cards. 5-degree steps are
  // plenty: the difference between 25 and 30 barely moves any rotation range.
  const LAT_KEY = "constellation-deck:latitude";
  const DEFAULT_LAT = 25;
  // A short reference list behind the "?" rather than tick labels. Cities
  // would have cost the tick row permanently, and you only need them once,
  // while you work out your own number. Chosen for spread, not population.
  const CITIES = [
    { name: "Bangkok",     lat: 14 },
    { name: "Cairo",       lat: 30 },
    { name: "London",      lat: 51 },
    { name: "Los Angeles", lat: 34 },
    { name: "New York",    lat: 41 },
    { name: "Singapore",   lat: 1 },
    { name: "Stockholm",   lat: 59 },
    { name: "Sydney",      lat: -34 },
    { name: "Taipei",      lat: 25 },
    { name: "Tokyo",       lat: 36 }
  ];
  function loadLatitude() {
    try {
      const v = window.localStorage.getItem(LAT_KEY);
      return v !== null ? parseFloat(v) : DEFAULT_LAT;
    } catch (e) { return DEFAULT_LAT; }
  }
  function saveLatitude(v) {
    try { window.localStorage.setItem(LAT_KEY, v); } catch (e) {}
  }
  function latLabel(v) {
    if (v === 0) return "0°";
    return `${Math.abs(v)}°${v > 0 ? "N" : "S"}`;
  }
  let viewingLat = loadLatitude();
  function loadGlobalMagOn() {
    try { return window.localStorage.getItem(GLOBAL_MAG_ON_KEY) === "1"; }
    catch (e) { return false; }

  const FREQ_PREFIX = "constellation-deck:freq:";

  const cityList = document.getElementById('cityList');

  // =========================================================================
  // Per-card render state (rebuilt whenever the active card changes)
  // =========================================================================
  let active = null;       // current constellation object
  let allStars = [];
  let fieldCenterRA = 0, fieldCenterDec = 0;
  // Where the figure's centroid sits on screen, as a fraction of half the
  // card (-1 = left/top edge, 0 = centre, +1 = right/bottom edge). Chosen
  // once per card load and then held fixed: the field centre is derived FROM
  // this at each zoom level, rather than the other way round. That's what
  // makes zoom scale around the figure instead of sliding it across the card.
  let panScreenX = 0, panScreenY = 0;
  // cos(declination) used to scale RA into screen units for the active card.
  // Fixed per card — see project().
  let fieldCosDec = 1;
  // Screen position of the centroid in pixels, recomputed by applyPan and
  // used as the pivot for the optional rotation.
  let anchorX = 0, anchorY = 0;
  // Keep the whole vertical window away from the celestial poles: near dec
  // ±90 an RA/Dec window stops matching what's actually nearby on the sky.
  const POLE_GUARD = 82;

  // halfWidth/halfHeight (from the card definition) describe a RECTANGLE in
  // RA/Dec space, and the old linear projection made that rectangle a valid
  // bound: any point inside it, rotated, stays inside the rotated bounding
  // box, because rotation of a linear map is still linear. That stopped
  // being true once project() left the flat approximation for a true
  // tangent-plane projection. A star sitting at a CORNER of the figure —
  // off-axis in RA and Dec simultaneously, the textbook example being
  // Alpheratz on Pegasus's Great Square — has a true angular distance from
  // the centroid governed by both offsets jointly, and the projection's
  // distortion grows with that combined distance, not with either axis
  // independently. The rectangle-based estimate silently under-predicted it,
  // and no amount of safety margin fixed that, because the gap wasn't a
  // margin problem: three different EDGE values (0.045/0.06/0.08) produced
  // statistically the same ~1.5% incident rate over 1300+ loads, always the
  // same handful of corner stars on the same two or three cards, always
  // exactly at that card's own maxFraction ceiling — a margin can't close a
  // gap that scales with a star's actual position, only a measurement that
  // uses that position can.
  //
  // So: measure the figure's real footprint from its own stars, through the
  // exact projection, instead of synthesizing one from a rectangle. Cached
  // on the card object since neither its stars nor its centroid ever change.
  // =========================================================================
  // SKY PROJECTION: stereographic.
  // Conformal, scale grows only as 1/cos^2(c/2) off-axis (x1.33 at 60 deg,
  // x1.49 at 70) — replaced an earlier gnomonic projection, whose scale grew
  // as 1/cos^2(c) (x4, x8.5), stretching wide-field/high-declination cards
  // far more at the edges. Confirmed by measurement (500-load sweeps per
  // card): stereographic matched or reduced every card's off-card clip rate
  // versus gnomonic, several going from a few percent to zero, none getting
  // worse outside sampling noise. Pixel scale is ISOTROPIC: FOV_W is derived
  // from FOV_H so that one plane unit is the same number of pixels on both
  // axes (fovWFromH below) — gnomonic's old FOV_W = FOV_H * aspect made the
  // horizontal pixel scale LARGER than the vertical at wide fields (x1.10 at
  // FOV_H 70, x1.25 at 100, x1.85 at 140 on a 388x665 card), a real
  // contributor to wide-field distortion on top of gnomonic's own edge
  // stretch; stereographic has no such gap.
  // Everything projection-specific goes through the helpers below; the
  // fitting code (fovForFraction, baseFovHFor, minAchievableFraction,
  // resize, initField, applyPan's Newton solve) calls them instead of
  // tan/atan directly.
  // Per-card tunings (maxFovH, maxFraction, maxGuardStep, rotationScale)
  // were originally measured under gnomonic; re-measured under stereographic
  // and left as-is — nothing needed a change (Cassiopeia's apparent
  // regression during that check turned out to be a test-harness bug, not a
  // real one: forcing a rotation after the screen anchor had already been
  // fixed for a different one, a state no real card load can reach).
  // =========================================================================
  // Plane distance for an angular distance a (radians) from the field centre.
  function projP(a) {
    return 2 * Math.tan(a / 2);
  }
  // Inverse: plane distance -> angle (radians).
  function projPinv(p) {
    return 2 * Math.atan(p / 2);
  }
  // Sky -> projection-plane coordinates (unscaled, east = +X, north = +Y).
  function planeXY(raDeg, decDeg, ra0Deg, dec0Deg) {
    const ra0 = ra0Deg * D2R, dec0 = dec0Deg * D2R;
    const dRA = raDeg * D2R - ra0, dec = decDeg * D2R;
    const sinDec0 = Math.sin(dec0), cosDec0 = Math.cos(dec0);
    const sinDec = Math.sin(dec), cosDec = Math.cos(dec);
    const cosDRA = Math.cos(dRA);
    const cosC = sinDec0 * sinDec + cosDec0 * cosDec * cosDRA;
    const k = 2 / Math.max(1 + cosC, 0.01);
    return {
      X: k * cosDec * Math.sin(dRA),
      Y: k * (cosDec0 * sinDec - sinDec0 * cosDec * cosDRA)
    };
  }
  // Horizontal field from vertical (and back) at a given card aspect.
  function fovWFromH(fovH, aspect) {
    return 2 * projPinv(aspect * projP((fovH / 2) * D2R)) / D2R;
  }
  function fovHFromW(fovW, aspect) {
    return 2 * projPinv(projP((fovW / 2) * D2R) / aspect) / D2R;
  }

  // Stars the framing has to keep on screen. Normally the whole figure; a
  // card can list a subset in fitStars (stage 26, Draco) so a long tail is
  // allowed off the edge at narrow zoom. Only the fit/zoom maths reads this —
  // every target is still drawn, lined and tappable.
  function fitSet(c) {
    if (!c.fitStars) return c.target;
    if (!c._fitSet) c._fitSet = c.target.filter(s => c.fitStars.includes(s.name));
    return c._fitSet;
  }

  function starFootprint(c) {
    if (c._footprint) return c._footprint;
    let maxX = 0, maxY = 0;
    fitSet(c).forEach(s => {
      const { X, Y } = planeXY(s.ra, s.dec, c.centroidRA, c.centroidDec);
      maxX = Math.max(maxX, Math.abs(X));
      maxY = Math.max(maxY, Math.abs(Y));
    });
    // atan converts the tangent-plane distance back to a true angular degree
    // value, so the rest of the pipeline — which works in degrees of field
    // of view throughout — doesn't need to know anything changed.
    c._footprint = { hw: projPinv(maxX) / D2R, hh: projPinv(maxY) / D2R };
    return c._footprint;
  }

  function projectedHalfWidth(c) {
    return starFootprint(c).hw;
  }

  // Worst-case on-screen half-extents at the card's ACTUAL tilt. Using the
  // actual angle rather than the card's full possible rotation range matters:
  // the worst case inflates a tall figure's width by more than half, which
  // pushed several cards' slider floors right up against their ceilings and
  // left no usable range at all. This matters MORE under the parallactic
  // rotation model than it did under the old flat +/-40, because the northern
  // cards can now legitimately be handed a near-90-degree tilt, which swaps
  // their axes outright. The angle is chosen in loadCard(), before anything
  // reads this.
  // Width is in projected (cos-scaled) units; height is already in those
  // units since dec isn't scaled.
  function effHalfExtents(c) {
    if (!fieldRotation) {
      return { hw: projectedHalfWidth(c), hh: starFootprint(c).hh };
    }
    // True rotated bounding box: rotate each star's own tangent-plane
    // position, then take the box — rather than the old approach of
    // rotating the AGGREGATE (pw, ph) box's corners via pw*cos+ph*sin.
    // Rotating the aggregate box is only a good approximation for a
    // roughly rectangular point cloud; it was flagged (see the long
    // comment this replaces, kept in git history) as a known, accepted
    // "few pixels on Pegasus" residual specifically BECAUSE Pegasus is
    // wide but still reasonably box-like. Draco's figure is a long
    // diagonal chain of 14 stars, nothing like a rectangle — for a shape
    // that asymmetric, "rotate the box" and "rotate the points then take
    // the box" give meaningfully different answers, and the aggregate
    // version underestimated badly enough to run most of the figure off
    // the card. This is the "more change" fix that comment deferred,
    // done because Draco made the cost of not doing it concrete rather
    // than theoretical. Reuses the same tangent-plane math as
    // starFootprint() (duplicated here rather than shared, since this
    // needs each star's own X/Y before aggregating, not just the running
    // max) — with fieldRotation=0 this produces the same numbers as
    // starFootprint() did, so compact/unrotated cards are unaffected.
    const key = fieldRotation.toFixed(2);
    if (c._trueExtCache && c._trueExtCache.key === key) return c._trueExtCache.val;
    const a = fieldRotation * Math.PI / 180;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    let maxX = 0, maxY = 0;
    fitSet(c).forEach(s => {
      const { X, Y } = planeXY(s.ra, s.dec, c.centroidRA, c.centroidDec);
      const rx = X * cosA - Y * sinA;
      const ry = X * sinA + Y * cosA;
      maxX = Math.max(maxX, Math.abs(rx));
      maxY = Math.max(maxY, Math.abs(ry));
    });
    const val = { hw: projPinv(maxX) / D2R, hh: projPinv(maxY) / D2R };
    c._trueExtCache = { key, val };
    return val;
  }
  let FOV_H = 65, FOV_W = 46;
  let limitMag = 5.0;
  let globalMagOn = loadGlobalMagOn();
  let globalMagValue = loadGlobalMagValue(3.5);
  // 0 = nothing revealed, 1 = this constellation's figure in red,
  // 2 = also the figure stars of any other card that fall in this field, in yellow.
  let revealLevel = 0;
  let named = false;
  // The star currently tapped/selected, drawn orange and doubled, overriding
  // whatever reveal color it would otherwise have. Cleared when the tooltip
  // hides or a tap lands on empty space.
  let selectedStar = null;
  const revealColor = "220,60,50";
  // Magenta rather than yellow or pink. Yellow sat too close to the warm end
  // of the natural star colours; pink read as a lighter red, so it was hard
  // to tell a neighbour from a figure star. Magenta has equal red and blue,
  // which puts it a clear hue apart from the figure's red while still being
  // a colour no real star has.
  const adjacentColor = "235,90,225";
  // Green, because no real star is green and nothing else in the palette is
  // near it — orange was close enough to the neighbour colour that a tap
  // barely registered. This is the one colour that can't be mistaken for a
  // figure star, a neighbour, or an ordinary background star.
  const selectedColor = "80,255,120";
  let W = 0, H = 0, dpr = 1;
  let fieldReady = false;
  let currentFraction = 0.33;

  // =========================================================================
  // ROTATION — what orientations this constellation can actually be seen in
  //
  // Every card gets its own tilt: a constellation you can only recognise at
  // one fixed orientation hasn't really been learned. But the tilt has to be
  // one the sky actually produces, which the old flat +/-40 degrees was not.
  //
  // Zero rotation in this app means "north up, east left" -- what you see
  // FACING SOUTH. Anything with dec > your latitude culminates NORTH of your
  // zenith: you turn around to face it, and that baseline is upside down.
  // That's why Cygnus was appearing ~180 degrees from the real sky from
  // Taipei, and why the old model could never show the right orientation.
  //
  // The key simplification: time of year and time of night collapse into one
  // variable, hour angle. A constellation at a given hour angle looks the
  // same whether that's 9pm in October or 3am in August, and over a year
  // every hour angle happens at some point in the night. So the set of
  // orientations you can ever see is fully determined by latitude and
  // declination. No dates, no clock, no ephemeris.
  //
  //   parallactic angle  q = atan2(sin H, tan(lat)cos(dec) - sin(dec)cos H)
  //   altitude       sin(alt) = sin(lat)sin(dec) + cos(lat)cos(dec)cos H
  // =========================================================================

  // Orientations only reachable with the figure a few degrees up -- in haze,
  // behind buildings -- aren't worth practising. 20 degrees is the floor.
  // NOTE: the zones below sit ON TOP of this. The 20-degree cutoff decides
  // what the range IS; the zones then carve up that range.
  const MIN_ALT = 20;

  // Five zones, numbered 1..5 outward-to-outward with 3 centred on
  // culmination. Zone 3 is +/-CULM_BAND; the remaining span each side is
  // split into even halves (scaled per card, NOT fixed degree bands -- fixed
  // bands would leave narrow-range cards with empty zones).
  //
  //   [1]      [2]   [ 3 ]   [4]      [5]
  //   -range  -mid  -25 +25  mid    +range
  //
  // Weighted toward culmination on purpose. Nature's own distribution is the
  // opposite of useful: the parallactic angle sweeps FAST through the
  // meridian and crawls near the limits, so a constellation spends most of
  // its visible hours lying on its side low in the sky (Taurus is near +/-70
  // about 39% of the time). That's the orientation you're least likely to be
  // practising in and least likely to see well.
  const CULM_BAND = 25;   // half-width of zone 3
  const ZONE_W = [0.125, 0.20, 0.35, 0.20, 0.125];
  // Scales the rotation range pickRotation samples from. Added to buy back
  // slider travel on cards whose real needed FOV (accounting for rotation)
  // ran well past what looked reasonable at a single rotation. Helps
  // compact cards a lot (Orion, Aquila) since it trims the far-from-
  // culmination zones hardest; does very little for wide/flat figures
  // (Pegasus, Andromeda, Taurus, Cygnus) since their bounding-box growth is
  // front-loaded within the ±CULM_BAND zone this doesn't shrink much — see
  // maxFovH on each card for what this bought and what still needed a
  // higher ceiling regardless. Real tradeoff, not free: some genuinely-
  // occurring orientations the sky produces are no longer shown, in
  // exchange for a working slider.
  let ROTATION_RANGE_SCALE = 0.5;

  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;

  function altitudeAt(dec, lat, H) {
    const s = Math.sin(rad(lat)) * Math.sin(rad(dec))
            + Math.cos(rad(lat)) * Math.cos(rad(dec)) * Math.cos(H);
    return deg(Math.asin(Math.max(-1, Math.min(1, s))));
  }

  function parallacticAt(dec, lat, H) {
    const den = Math.tan(rad(lat)) * Math.cos(rad(dec))
              - Math.sin(rad(dec)) * Math.cos(H);
    return deg(Math.atan2(Math.sin(H), den));
  }

  // The orientation at upper culmination: highest in the sky, best seeing,
  // and the one a chart would draw. Exactly 0 for anything culminating south
  // of the zenith and 180 for anything culminating north of it, which is the
  // whole Cygnus problem stated in one line. This is also what "rotation off"
  // would mean if a toggle is ever added back.
  function culminationAngle(c, lat) {
    return parallacticAt(c.centroidDec, lat, 0);
  }

  // How far either side of culmination the sky can actually take this figure,
  // ignoring anything below MIN_ALT. Returns 0 if it never gets high enough,
  // in which case the card simply doesn't rotate.
  function rotationRangeFor(c, lat) {
    const dec = c.centroidDec, culm = culminationAngle(c, lat);
    let maxOff = 0, anyVisible = false;
    for (let i = 0; i <= 720; i++) {
      const H = rad(-180 + i * 0.5);
      if (altitudeAt(dec, lat, H) < MIN_ALT) continue;
      anyVisible = true;
      // Offset from culmination, wrapped into -180..180 so the northern
      // cards (culmination 180) measure their spread about 180, not about 0.
      let off = parallacticAt(dec, lat, H) - culm;
      while (off > 180) off -= 360;
      while (off < -180) off += 360;
      maxOff = Math.max(maxOff, Math.abs(off));
    }
    return anyVisible ? maxOff : 0;
  }

  // Pick a tilt. Choose a zone by weight, then a uniform angle inside it.
  function pickRotation(c, lat) {
    // Per-card override on top of the global ROTATION_RANGE_SCALE — same
    // pattern as maxFovH/maxFraction. Unset means "use the global value";
    // only Pegasus uses this so far (0.15, to buy back ceiling — see its
    // definition), everything else still gets the deck-wide 0.5.
    const scale = c.rotationScale ?? ROTATION_RANGE_SCALE;
    const range = rotationRangeFor(c, lat) * scale;
    const culm = culminationAngle(c, lat);
    if (range <= 0) return culm;

    // A card whose whole reachable range is narrower than zone 3 has only
    // zone 3 — don't invent outer zones with no room in them.
    const band = Math.min(CULM_BAND, range);
    const mid = band + (range - band) / 2;

    // Zone edges as [inner, outer] distances from culmination, per zone.
    const edges = [
      [mid, range],   // 1  far side A
      [band, mid],    // 2  near side A
      [0, band],      // 3  culmination (spans both signs)
      [band, mid],    // 4  near side B
      [mid, range]    // 5  far side B
    ];

    let r = Math.random(), z = 0;
    for (; z < ZONE_W.length - 1; z++) {
      if (r < ZONE_W[z]) break;
      r -= ZONE_W[z];
    }

    const [lo, hi] = edges[z];
    const mag = lo + Math.random() * (hi - lo);
    // Zone 3 straddles culmination, so it picks its own sign; zones 1-2 sit
    // one side and 4-5 the other.
    const sign = z === 2 ? (Math.random() < 0.5 ? -1 : 1) : (z < 2 ? -1 : 1);

    let a = culm + sign * mag;
    while (a > 180) a -= 360;
    while (a < -180) a += 360;
    return a;
  }

  let fieldRotation = 0;

  function seedRandom(seed) {
    let s = seed;
    return function () {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  function makeJitter(rndFn) {
    const pts = 10;
    const arr = [];
    // Edge lumpiness +-0.17 of r (was +-0.18 before stage 23's tuner pass).
    for (let i = 0; i < pts; i++) arr.push(0.83 + rndFn() * 0.34);
    return arr;
  }

  // What the field of view would be at a given target-width fraction,
  // independent of whatever fraction is actually active right now.
  function fovForFraction(c, frac) {
    const aspect = W / H;
    const ext = effHalfExtents(c);
    const fovHFromWidth = fovHFromW(fovForHalfWidth(ext.hw, frac), aspect);
    // Also check the HEIGHT half-extent directly, not just derive fovH from
    // width and hope it's enough. That was always the implicit assumption
    // here, and it held for every card up to now because none of them had a
    // footprint where the rotated height genuinely needed more room than
    // the width-derived fovH provided. Draco breaks it: its unrotated
    // footprint is nearly square (hh/hw ~ 1.03) while the card itself is
    // portrait (needs hh/hw ~ 1.3 to be width-bound) — so at some rotations
    // the true height requirement exceeds what fitting the width alone
    // gives, and the figure was silently cropped top/bottom even though it
    // fit fine horizontally. fovForHalfWidth is really "FOV needed for this
    // half-extent to hit this fraction" — it doesn't care which axis, so
    // it's reused directly here for height, no separate function needed.
    const fovHFromHeight = fovForHalfWidth(ext.hh, frac);
    const fovH = Math.min(maxFovHFor(c), Math.max(baseFovHFor(c), fovHFromWidth, fovHFromHeight));
    return { fovH, fovW: fovWFromH(fovH, aspect) };
  }

  // Readout shows the actual vertical field of view in degrees, not the
  // raw slider fraction — degrees is what the pole guard, MAX_FOV_H and
  // per-card maxFovH all reason about, so this is what you actually want
  // to read off while tuning a card's ceiling. Computed directly via
  // fovForFraction rather than read off the FOV_H global, so it's correct
  // even before resize() has run for the current currentFraction (e.g. the
  // instant a card loads, before the first resize/render pass).
  function updateFovReadout() {
    if (!active) { fovReadout.textContent = 'field of view'; return; }
    const { fovH } = fovForFraction(active, currentFraction);
    fovReadout.textContent = `field of view ${fovH.toFixed(0)}°`;
  }

  function maxFractionFor(c) {
    return c.maxFraction || DEFAULT_MAX_FRACTION;
  }

  // Derive the field centre from the figure's fixed SCREEN position, at
  // whatever field of view is currently active.
  //
  // The earlier version did the reverse — it froze an offset in degrees and
  // let the screen position fall out of it. That meant zooming scaled the
  // sky around the centre of the card, so an off-centre figure slid further
  // off as you zoomed in. Anchoring the screen position instead makes zoom
  // scale around the figure itself, which is what "zoom in on this
  // constellation" should mean, and it holds exactly still by construction
  // rather than by clamping.
  // How far toward a card's wideCenter the field should have moved, 0..1,
  // from where the width slider sits between its narrow end (fovSlider.max,
  // 0) and its wide end (fovSlider.min, 1). Smoothstepped so the drift
  // starts and finishes gently. Always 0 for cards without wideCenter.
  function wideBlend(c) {
    if (!c.wideCenter) return 0;
    const lo = parseFloat(fovSlider.min), hi = parseFloat(fovSlider.max);
    if (!(hi > lo)) return 0;
    const t = Math.min(1, Math.max(0, (hi - currentFraction) / (hi - lo)));
    return t * t * (3 - 2 * t);
  }

  function applyPan(c) {
    // wideCenter (optional, per card): as the field widens, the point held
    // at the anchor slides from the figure's own centroid toward
    // wideCenter, and the anchor itself slides from the card's random
    // placement toward the middle of the screen — so zooming out also
    // pans toward whatever wideCenter marks (the Summer Triangle, on Aquila
    // and Lyra). Same Newton solve and pole guard as before; they just
    // pin this blended point instead of the bare centroid. With no
    // wideCenter, w is 0 and everything below reduces to the old code.
    const w = wideBlend(c);
    let aRA = c.centroidRA, aDec = c.centroidDec;
    if (w > 0) {
      let dRAw = c.wideCenter.ra - c.centroidRA;
      while (dRAw > 180) dRAw -= 360;
      while (dRAw < -180) dRAw += 360;
      aRA = c.centroidRA + dRAw * w;
      aDec = c.centroidDec + (c.wideCenter.dec - c.centroidDec) * w;
    }
    anchorX = W / 2 + panScreenX * (1 - w) * (W / 2);
    anchorY = H / 2 + panScreenY * (1 - w) * (H / 2);
    // Starting guess: the OLD linear-approximation formula. Under the old
    // flat projection this was exact; under a true tangent-plane projection
    // (gnomonic before, stereographic now) it's only close, since shifting
    // the tangent point isn't quite the same as the flat model's simple
    // coordinate shift. The error is small (a few percent of card width,
    // measured, growing with field width and rotation angle) but not zero,
    // and it's exactly the wide-field, high-declination cards this
    // conversion targets where it's largest — so it's corrected below rather
    // than left to eat into the edge margin.
    fieldCenterDec = aDec + panScreenY * (1 - w) * (FOV_H / 2);
    fieldCenterRA = aRA + (panScreenX * (1 - w) * (FOV_W / 2)) / fieldCosDec;

    // Two Newton corrections, using skyToPixel — the SAME formula
    // project() uses, not a re-derivation of it — to walk fieldCenterRA/Dec
    // until the centroid actually lands on the anchor. Two iterations
    // converges to sub-pixel accuracy in every case tested; a numeric
    // (finite-difference) Jacobian is used rather than the analytic one
    // because this runs at most once per card load or zoom-slider move, not
    // per star per frame, so the extra trig calls cost nothing.
    const EPS = 0.01; // degrees, for the finite-difference step
    for (let iter = 0; iter < 6; iter++) {
      const p0 = skyToPixel(aRA, aDec, fieldCenterRA, fieldCenterDec, FOV_W, FOV_H);
      const fx = p0.x - anchorX, fy = p0.y - anchorY;
      if (Math.abs(fx) < 0.05 && Math.abs(fy) < 0.05) break; // sub-pixel: done
      const pRA = skyToPixel(aRA, aDec, fieldCenterRA + EPS, fieldCenterDec, FOV_W, FOV_H);
      const pDec = skyToPixel(aRA, aDec, fieldCenterRA, fieldCenterDec + EPS, FOV_W, FOV_H);
      const dxdRA = (pRA.x - p0.x) / EPS, dydRA = (pRA.y - p0.y) / EPS;
      const dxdDec = (pDec.x - p0.x) / EPS, dydDec = (pDec.y - p0.y) / EPS;
      const det = dxdRA * dydDec - dxdDec * dydRA;
      if (Math.abs(det) < 1e-9) break; // degenerate Jacobian: keep the linear guess
      const dRA = (fx * dydDec - fy * dxdDec) / det;
      const dDec = (fy * dxdRA - fx * dydRA) / det;
      fieldCenterRA -= dRA;
      fieldCenterDec -= dDec;
    }

    // Pole guard, applied AFTER the centroid-anchoring solve above, not
    // folded into it. Above, fieldCenterDec/RA were chosen so the figure's
    // centroid sits exactly at the requested screen anchor. This step then
    // clamps fieldCenterDec so the window's near-pole edge never crosses
    // POLE_GUARD. For the great majority of loads/cards this clamp is a
    // no-op (halfH is well under the guard band) and fieldCenterDec is left
    // exactly as the solve above set it. It only engages for a card whose
    // centroid is close enough to a pole that, at the CURRENT field width,
    // the window would cross POLE_GUARD — at that point it overrides the
    // anchoring solve and pushes fieldCenterDec back toward the equator by
    // just enough to clear the guard. The visible effect is deliberate: the
    // figure stops sitting exactly at its usual screen anchor and drifts
    // toward the near-pole edge of the card as the field widens further,
    // because the extra field is being added only on the far side. This
    // replaces the old approach of shrinking MAX_FOV_H itself for any card
    // near a pole, which guarded the same thing but did it by refusing to
    // widen at all rather than by recentring.
    //
    // Was: guardHi = POLE_GUARD - FOV_H/2, i.e. protecting the whole
    // VIEWPORT's half-height from crossing the guard band — including all
    // the empty-sky margin around the figure, not just the figure itself.
    // Since the fit always leaves margin (the figure only fills
    // maxFraction of the half-frame, always <1), FOV_H/2 is always bigger
    // than the figure's own half-height (hh) — so this was clamping more
    // aggressively than the figure actually needed, on every card whose
    // centroid sits anywhere near the guard band, not just genuinely
    // extreme ones. Confirmed directly: Cepheus (centroid dec 65.7°, a
    // fairly modest declination, FOV only 36-55°) was still getting
    // clamped on 59/60 real loads, by 2-14° each time — nowhere near as
    // severe as Draco's case, but frequent and systematic, and it always
    // pushes away from the pole, which means it always disadvantages
    // whichever star in the figure sits FURTHEST toward the pole. For
    // Cepheus that's Errai (dec 77.6°, well past the other 6 stars) —
    // this, not a sizing or margin problem, is why Errai specifically was
    // the one seen going offscreen, always toward the same edge. Fixed by
    // guarding the FIGURE's actual near-pole edge (centroidDec ± hh, using
    // the same hh effHalfExtents already computes for fitting) rather than
    // the viewport's full half-height — this only clamps when the stars
    // themselves would actually approach the guard band, not whenever the
    // padding around them theoretically would.
    const hh = effHalfExtents(c).hh;
    const halfH = hh;
    const guardHi = POLE_GUARD - halfH;
    const preGuardDec = fieldCenterDec;
    let targetDec;
    if (guardHi < -guardHi) {
      // FOV_H itself exceeds the guard band (shouldn't happen at the
      // current MAX_FOV_H=80, guard band =164) — fall back to centring on
      // the equator rather than leaving an inconsistent clamp.
      targetDec = 0;
    } else {
      targetDec = Math.min(guardHi, Math.max(-guardHi, fieldCenterDec));
    }
    // Cap how far this can move fieldCenterDec in one go, rather than
    // jumping straight to targetDec. For most cards this clamp is a small
    // nudge (the "great majority of loads... this clamp is a no-op" case
    // above), but a card whose OWN required FOV_H is wide enough can have
    // guardHi collapse far below the card's natural centroidDec — Draco,
    // needing up to ~132° of field (this deck's widest by far) at dec
    // ~62°, routinely had guardHi sit 20-40+ degrees below that. A jump
    // that large leaves fieldCenterRA (solved above for the OLD Dec)
    // badly wrong — any tangent-plane projection mixes RA and Dec, so a big
    // Dec change alone doesn't keep the centroid anywhere near the anchor,
    // and this shipped as "off the bottom with tons of empty space." A
    // same-turn RA re-solve was tried and rejected: fixing the rotated-frame
    // X position with RA as the only free variable is underconstrained
    // enough to be numerically unstable at this range — it zeroed X but
    // sent Y to 100s or 1000s of percent drift in testing (under the
    // then-gnomonic formula, whose tan(a) term grows without bound as the
    // point approaches 90 degrees off-axis; stereographic's tan(a/2) term
    // doesn't hit that until 180 degrees, so this specific blow-up is less
    // likely now, though not re-tested). Capping the per-load step keeps
    // the guard doing what it was actually designed for (a gentle nudge)
    // instead of demanding a correction this simple a system can't reliably
    // make; the trade-off is that an extreme case like Draco may still
    // graze POLE_GUARD rather than staying strictly clear of it, which is a
    // milder failure mode than the wrong-anchor problem it replaces — and
    // the star-to-pixel projection itself, unlike the old flat
    // approximation, does not mathematically break down at the pole (see
