    // Asterism cards use a 0.001 step: their floor can be a few hundredths
    // (see sliderFloorFor), where 0.01 steps would be huge jumps in field.
    const stepDiv = c.wideCenter ? 1000 : 100;
    fovSlider.step = (1 / stepDiv).toString();
    const floorStep = Math.min(ceil, Math.ceil(floor * stepDiv) / stepDiv);
    fovSlider.min = floorStep.toFixed(c.wideCenter ? 3 : 2);
    currentFraction = sessionFraction.has(c.id) ? sessionFraction.get(c.id) : ceil;
    currentFraction = Math.min(ceil, Math.max(floorStep, currentFraction));
    fovSlider.value = currentFraction;
    updateFovReadout();
    tooltip.classList.remove('show');
    nameReveal.innerHTML = "";
    nameReveal.appendChild(document.createTextNode(c.name));
    if (c.chineseName) {
      const zh = document.createElement('span');
      zh.className = 'zh';
      zh.appendChild(document.createTextNode(c.chineseName));
      if (c.pinyin) {
        const py = document.createElement('span');
        py.className = 'py';
        py.textContent = c.pinyin;
        zh.appendChild(py);
      }
      nameReveal.appendChild(zh);
    }
    resize();
    if (c.wideCenter && c.wideLabels && wideTry < WIDE_FIT_TRIES && W > 0 && H > 0 &&
        !wideCornersFit(c)) {
      loadCard(c, wideTry + 1);
      return;
    }
    updateState();
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    for (let i = 0; i < deckOrder.length; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === deckIndex ? ' active' : '');
      dotsEl.appendChild(d);
    }
  }

  function showDeckPosition() {
    renderDots();
    // With every card switched off the deck is empty, so there's nothing to
    // position on. The index is the only place to be in that state, and it's
    // already open — just don't try to load a card that isn't there.
    const c = byId(deckOrder[deckIndex]);
    if (!c) return;
    loadCard(c);
  }

  function enterDeck() {
    // Belt-and-suspenders: the swipe-up gesture is now the one place that's
    // supposed to stop slideshow before opening the index (see touchend/
    // mouseup above), but if slideshow ever ends up still active by the time
    // this runs, starting a flash-deck session on top of its still-ticking
    // raf loop is exactly what silently turned "Flash Deck" back into
    // slideshow before. Stopping it here too means this path can't be
    // reached in a broken state regardless of how it got here.
    if (slideshow) stopSlideshow();
    // Reshuffle every time start is pressed.
    const shuffled = shuffledIds();
    if (shuffled.length === 0) {
      // Every card is set to off — nothing to shuffle into, so stay in the
      // index rather than entering an empty deck.
      return;
    }
    // A new deck starts every card at its narrowest field of view. Within
    // the deck each card then keeps whatever you set it to (see
    // sessionFraction), but pressing start again wipes those.
    sessionFraction.clear();
    deckOrder = shuffled;
    deckIndex = 0;
    closeIndex();
    showDeckPosition();
  }

  function goNext() {
    if (deckIndex < deckOrder.length - 1) { deckIndex++; showDeckPosition(); }
  }

  function goPrev() {
    if (deckIndex > 0) { deckIndex--; showDeckPosition(); }
  }

  function goToId(id) {
    let i = deckOrder.indexOf(id);
    if (i === -1) {
      // The deck only rebuilds when start is pressed, so a card can be missing
      // from the current one — it was switched off when the deck was shuffled,
      // or added to the app afterwards. Silently doing nothing here looked
      // like the index had jumped to the wrong constellation: the overlay
      // closed and left whatever card was already showing. Append it instead
      // so the tap always goes where it says it will.
      deckOrder = deckOrder.concat([id]);
      i = deckOrder.length - 1;
    }
    deckIndex = i;
    showDeckPosition();
  }

  // =========================================================================
  // Index overlay: swipe up from anywhere brings up a jump-to-card list.
  // =========================================================================
  // Every row's own paint function, so the master switch can refresh all of
  // them after a bulk change without rebuilding the list.
  let indexRowPainters = [];

  function buildIndexList() {
    indexList.innerHTML = "";
    indexRowPainters = [];
    const sorted = [...CONSTELLATIONS].sort((a, b) => a.name.localeCompare(b.name));
    // See the CSS note above: grid-auto-flow:column needs this to wrap
    // correctly into two columns instead of one column per item.
    indexList.style.gridTemplateRows = `repeat(${Math.ceil(sorted.length / 2)}, auto)`;
    sorted.forEach(c => {
      const row = document.createElement('div');
      row.className = 'index-item';

      const freqBtn = document.createElement('span');
      freqBtn.className = 'index-freq';
      const paint = () => {
        const f = loadFreq(c.id);
        freqBtn.textContent = FREQ_LABEL[f];
        freqBtn.classList.toggle('out', f === 0);
        row.classList.toggle('off', f === 0);
      };
      paint();
      indexRowPainters.push(paint);
      freqBtn.addEventListener('click', e => {
        // Stop this from also firing the row's own click, which would jump
        // to the card -- tapping the switch should only cycle it.
        e.stopPropagation();
        saveFreq(c.id, nextFreq(loadFreq(c.id)));
        paint();
        paintSlideAvailability();
      });
      row.appendChild(freqBtn);

      // Wrapper so the tap target for "go to this card" starts clear of the
      // frequency switch rather than covering the whole row.
      const hit = document.createElement('span');
      hit.className = 'index-hit';
      const label = document.createElement('span');
      label.className = 'index-label';
      label.textContent = c.name;
      hit.appendChild(label);
      row.appendChild(hit);

      hit.addEventListener('click', () => {
        // A dimmed row used to do nothing when tapped, which looked like a
        // dead control. Tapping one now turns it on and goes straight there
        // -- off no longer means unreachable, just unreachable by accident.
        if (loadFreq(c.id) === 0) {
          saveFreq(c.id, 1);
          paint();
          paintSlideAvailability();
        }
        goToId(c.id);
        closeIndex();
      });
      indexList.appendChild(row);
    });
  }
  buildIndexList();

  // Both buttons need at least one card switched on to mean anything. Left
  // clickable but dark makes that visible at a glance rather than the tap
  // silently doing nothing, which was the old behaviour for an empty deck.
  var deckUiReady = false;
  var guideReady = false;
  function paintSlideAvailability() {
    const any = CONSTELLATIONS.some(c => loadFreq(c.id) !== 0);
    indexStart.classList.toggle('disabled', !any);
    indexSlides.classList.toggle('disabled', !any);
    // Deck-choice consts are declared further down; skip until they exist.
    if (deckUiReady) paintDeckState();
  }
  paintSlideAvailability();

  // ---- Deck choice (stage 36) ----
  // Replaces the old "all: 1 / all: off" toggle. The pop-up offers those two
  // bulk settings plus named groups; picking a group sets its cards to 3 and
  // every other card to off, then closes. Nothing starts automatically.
  // The label under the button is derived from the saved frequencies rather
  // than stored separately, so it persists across restarts for free and
  // flips to "custom" as soon as any single card is changed.
  const DECK_GROUPS = [
    { name: "Summer Triangle & friends", ids: ["lyra", "cygnus", "aquila", "hercules", "coronaborealis"] },
    { name: "Scorpius & friends",        ids: ["scorpius", "sagittarius", "ophiuchus"] },
    { name: "Pegasus & friends",         ids: ["pegasus", "andromeda", "perseus", "cassiopeia", "aquarius", "piscisaustrinus", "aries"] },
    { name: "Winter Triangle & friends", ids: ["orion", "canismajor", "canisminor", "gemini", "taurus", "auriga"] },
    { name: "Leo & friends",             ids: ["leo", "virgo", "bootes", "coronaborealis", "ursamajor"] },
    { name: "Polaris & friends",         ids: ["ursamajor", "ursaminor", "draco", "cepheus", "cassiopeia"] },
    { name: "Zodiac",                    ids: ["aries", "taurus", "gemini", "leo", "virgo", "scorpius", "sagittarius", "aquarius"] }
  ];
  const GROUP_FREQ = 3;
  const deckChoice = document.getElementById('deckChoice');
  const deckChoiceState = document.getElementById('deckChoiceState');
  const deckPanel = document.getElementById('deckPanel');
  const deckBackdrop = document.getElementById('deckBackdrop');
  const deckGroupList = document.getElementById('deckGroupList');
  const deckById = Object.fromEntries(CONSTELLATIONS.map(c => [c.id, c]));

  function currentDeckLabel() {
    const f = CONSTELLATIONS.map(c => loadFreq(c.id));
    if (f.every(v => v === 0)) return "none";
    if (f.every(v => v === 1)) return "all";
    for (const g of DECK_GROUPS) {
      const set = new Set(g.ids);
      if (CONSTELLATIONS.every(c => loadFreq(c.id) === (set.has(c.id) ? GROUP_FREQ : 0))) return g.name;
    }
    return "custom";
  }
  function paintDeckState() {
    const label = currentDeckLabel();
    deckChoiceState.textContent = label;
    deckGroupList.querySelectorAll('.deck-group').forEach(el =>
      el.classList.toggle('active', el.dataset.name === label));
  }
  function openDeckPanel() {
    paintDeckState();
    deckPanel.classList.add('show');
    deckBackdrop.classList.add('show');
  }
  function closeDeckPanel() {
    deckPanel.classList.remove('show');
    deckBackdrop.classList.remove('show');
  }
  function applyDeck(freqFor) {
    CONSTELLATIONS.forEach(c => saveFreq(c.id, freqFor(c.id)));
    indexRowPainters.forEach(p => p());
    paintSlideAvailability();
    closeDeckPanel();
  }
  DECK_GROUPS.forEach(g => {
    const row = document.createElement('div');
    row.className = 'deck-group';
    row.dataset.name = g.name;
    const n = document.createElement('div'); n.className = 'deck-group-name'; n.textContent = g.name;
    const m = document.createElement('div'); m.className = 'deck-group-members';
    m.textContent = g.ids.map(id => deckById[id] ? deckById[id].name : id).join(' · ');
    row.appendChild(n); row.appendChild(m);
    row.addEventListener('click', () => {
      const set = new Set(g.ids);
      applyDeck(id => set.has(id) ? GROUP_FREQ : 0);
    });
    deckGroupList.appendChild(row);
  });
  deckChoice.addEventListener('click', e => { e.stopPropagation(); openDeckPanel(); });
  document.getElementById('deckAllOn').addEventListener('click', () => applyDeck(() => 1));
  document.getElementById('deckAllOff').addEventListener('click', () => applyDeck(() => 0));
  document.getElementById('deckClose').addEventListener('click', closeDeckPanel);
  deckBackdrop.addEventListener('click', e => { e.stopPropagation(); closeDeckPanel(); });
  paintDeckState();
  deckUiReady = true;

  // ---- First-run guide (9-25 ver8) ----
  // Step 1 (once ever): home dims except latitude; "Set your latitude
  // first" plus the city list open. Picking a city or releasing the
  // latitude slider completes it.
  // Then GUIDE_CYCLES times: deck choice pulses green until the deck-choice
  // pop-up is opened (closing it without choosing doesn't restart the
  // pulse); then flash deck and slide show pulse together until either is
  // tapped, which ends that cycle. Each return home starts the next cycle.
  // State lives under its own storage key, so everyone, including existing
  // users, sees it once.
  const GUIDE_KEY = "constellation-deck:guide:v1";
  const GUIDE_CYCLES = 3;
  const guideMsg = document.getElementById('guideMsg');
  function guideLoad() {
    try { return Object.assign({ lat: false, cycles: 0, phase: 'none' }, JSON.parse(localStorage.getItem(GUIDE_KEY) || '{}')); }
    catch (e) { return { lat: false, cycles: 0, phase: 'none' }; }
  }
  function guideSave(g) { try { localStorage.setItem(GUIDE_KEY, JSON.stringify(g)); } catch (e) {} }
  let guide = guideLoad();
  function guidePaint() {
    const latMode = !guide.lat;
    indexOverlay.classList.toggle('guide-lat', latMode);
    guideMsg.classList.toggle('show', latMode);
    deckChoice.classList.toggle('guide-pulse', guide.lat && guide.phase === 'deck');
    const play = guide.lat && guide.phase === 'play';
    indexStart.classList.toggle('guide-pulse', play);
    indexSlides.classList.toggle('guide-pulse', play);
  }
  function guideOnHome() {
    if (!guide.lat) { cityPanel.classList.add('show'); guidePaint(); return; }
    if (guide.phase === 'away' || guide.phase === 'none') {
      guide.phase = guide.cycles < GUIDE_CYCLES ? 'deck' : 'done';
      guideSave(guide);
    }
    guidePaint();
  }
  function guideLatDone() {
    if (guide.lat) return;
    guide.lat = true;
    guide.phase = guide.cycles < GUIDE_CYCLES ? 'deck' : 'done';
    guideSave(guide);
    cityPanel.classList.remove('show');
    guidePaint();
  }
  // The message goes as soon as the latitude control is touched at all.
  latSlider.addEventListener('input', () => { if (!guide.lat) guideMsg.classList.remove('show'); });
  latSlider.addEventListener('change', guideLatDone);
  cityList.addEventListener('click', e => { if (e.target.closest('.city-row')) guideLatDone(); });
  deckChoice.addEventListener('click', () => {
    if (guide.phase === 'deck') { guide.phase = 'play'; guideSave(guide); guidePaint(); }
  });
  function guidePlayTapped(btn) {
    if (btn.classList.contains('disabled')) return;
    if (guide.lat && (guide.phase === 'deck' || guide.phase === 'play')) {
      guide.cycles += 1;
      guide.phase = 'away';
      guideSave(guide);
      guidePaint();
    }
  }
  indexStart.addEventListener('click', () => guidePlayTapped(indexStart), true);
  indexSlides.addEventListener('click', () => guidePlayTapped(indexSlides), true);
  guideReady = true;
  if (indexOverlay.classList.contains('show')) guideOnHome();

  function openIndex() {
    indexOverlay.classList.add('show');
    if (guideReady) guideOnHome();
    // These all belong to whichever card was open, not to the index/global
    // controls — leaving them visible above the overlay reads as if they
    // still apply here, which they don't. The reveal/reset buttons and the
    // name strip were missing from this list entirely, which is why they
    // used to stay on screen at home showing the previous card's state.
    fovRow.classList.add('hidden');
    magRow.classList.add('hidden');
    swipeHint.style.visibility = 'hidden';
    controlsRow.style.visibility = 'hidden';
    nameReveal.classList.remove('show');
  }
  function closeIndex() {
    closeDeckPanel();
    indexOverlay.classList.remove('show');
    fovRow.classList.remove('hidden');
    magRow.classList.remove('hidden');
    // Shown in both flash-deck and slideshow now — only the index itself
    // hides it (see openIndex above), since "swipe up for home" doesn't
    // apply when you're already home.
    swipeHint.style.visibility = 'visible';
    controlsRow.style.visibility = 'visible';
    // updateState() re-applies the current card's real reveal state, name
    // included, rather than guessing what it should be here.
    updateState();
  }
  indexStart.addEventListener('click', enterDeck);
  indexOverlay.addEventListener('click', e => {
    if (e.target === indexOverlay) closeIndex();
  });

  // =========================================================================
  // UI wiring
  // =========================================================================
  magSlider.addEventListener('input', () => {
    limitMag = parseFloat(magSlider.value);
    magReadout.textContent = `limit mag ${limitMag.toFixed(1)}`;
    // While the global magnitude is on, per-card adjustments are free but
    // temporary: they never get saved, so switching global off restores
    // whatever was individually saved before it was turned on.
    if (active && !globalMagOn) saveMag(active.id, limitMag);
    render();
  });

  function paintGlobalMag() {
    globalMag.classList.toggle('on', globalMagOn);
    globalMagToggle.textContent = globalMagOn ? "on" : "off";
    globalMagToggle.classList.toggle('on', globalMagOn);
    globalMagReadout.textContent = `mag ${globalMagValue.toFixed(1)}`;
  }
  globalMagSlider.value = globalMagValue;
  paintGlobalMag();

  // Applies the correct magnitude to whatever card is currently open,
  // matching how loadCard() decides it — used whenever the toggle flips
  // or the global value changes, so the open card updates immediately
  // without waiting for the next swipe.
  function applyMagToActiveCard() {
    if (!active) return;
    limitMag = globalMagOn ? globalMagValue : loadMag(active.id, 4.0);
    magSlider.value = limitMag;
    magReadout.textContent = `limit mag ${limitMag.toFixed(1)}`;
    render();
  }

  globalMagToggle.addEventListener('click', () => {
    globalMagOn = !globalMagOn;
    saveGlobalMagOn(globalMagOn);
    paintGlobalMag();
    applyMagToActiveCard();
  });

  // Latitude. Takes effect on the next card load rather than re-rotating
  // whatever is on screen — less jarring, and you're in the index when you
  // set it anyway.
  latSlider.value = viewingLat;
  latReadout.textContent = latLabel(viewingLat);
  latSlider.addEventListener('input', () => {
    viewingLat = parseFloat(latSlider.value);
    saveLatitude(viewingLat);
    latReadout.textContent = latLabel(viewingLat);
  });

  function buildCityList() {
    cityList.innerHTML = '';
    CITIES.forEach(c => {
      const row = document.createElement('div');
      row.className = 'city-row';
      const n = document.createElement('span'); n.textContent = c.name;
      const l = document.createElement('span'); l.textContent = latLabel(c.lat);
      row.appendChild(n); row.appendChild(l);
      // Tapping a city is a shortcut, not just a reference — snap to the
      // nearest 5 degrees so it lands on a real slider stop.
      row.addEventListener('click', () => {
        viewingLat = Math.round(c.lat / 5) * 5;
        saveLatitude(viewingLat);
        latSlider.value = viewingLat;
        latReadout.textContent = latLabel(viewingLat);
        cityPanel.classList.remove('show');
      });
      cityList.appendChild(row);
    });
  }
  buildCityList();
  latHelp.addEventListener('click', () => cityPanel.classList.add('show'));
  cityClose.addEventListener('click', () => cityPanel.classList.remove('show'));

  globalMagSlider.addEventListener('input', () => {
    globalMagValue = parseFloat(globalMagSlider.value);
    saveGlobalMagValue(globalMagValue);
    globalMagReadout.textContent = `mag ${globalMagValue.toFixed(1)}`;
    if (globalMagOn) applyMagToActiveCard();
  });

  fovSlider.addEventListener('input', () => {
    currentFraction = parseFloat(fovSlider.value);
    updateFovReadout();
    if (active) sessionFraction.set(active.id, currentFraction);
    resize();
  });

  // =========================================================================
  // SLIDE PLAYER
  // A hands-off run through the deck. Each card plays a fixed sequence: find
  // it, name it, draw it, name its stars, then pull back to show where it sits
  // among its neighbours. One slide per card that isn't switched off — the
  // 3/1 frequency split is a flashcard idea and doesn't apply here.
  //
  // The zoom is driven by a progress value rather than a timer so that pausing
  // freezes it mid-move and resuming carries on from the same point.
  // =========================================================================
  const SLIDE_STEPS = [
    { id: 'find',       ms: 2500 },  // stars only, no name, no highlight
    { id: 'name',       ms: 2500 },  // figure reddens, named, AND lines drawn
                                      // (lines used to wait for the next step —
                                      // see showLines above)
    { id: 'lines',      ms: 3000 },  // lines already up; this beat just holds
                                      // on the plain figure before star names start
    { id: 'starnames',  ms: 3000 },  // star names in; lines stay up under them
                                      // (used to hide here — see showLines above)
    { id: 'settle',     ms: 1200 },  // back to the plain red figure
    { id: 'zoomout',    ms: 3600 },  // slow pull back to the widest field
    { id: 'neighbours', ms: 3600 }   // surrounding figures light up and label
  ];

  const STAR_NAME_INTERVAL = 2400;   // ms between one star name and the next
  // A notable star's total time on screen during the slideshow's starnames
  // step: 6s + (word count in its notable text / 4) seconds — longer
  // blurbs get proportionally more time to read, short ones don't overstay.
  // Base raised twice on user feedback: 2s → 4s → 6s, still felt too fast
  // each time until now. Replaces a flat per-star hold; plain stars (no
  // notable text) keep the original flat STAR_NAME_INTERVAL, unchanged.
  function notableHoldMs(text) {
    const words = text.trim().split(/\s+/).length;
    return (6 + words / 4) * 1000;
  }
  // Cumulative per-star timing for the starnames step: sorted brightest
  // first, same order as before, but each star's slot is now sized to its
  // own content rather than a flat interval — a notable star holds longer,
  // scaled to how much there is to read (see notableHoldMs). Used both to
  // size the step's total ms (loadSlide) and to know which star is
  // "current" for the popup box and the name-by-name reveal.
  function slideStarSchedule(c) {
    // Same target-or-neighbors resolution as moreSeq/currentStarHasNotable.
    const list = (c.labels || [])
      .map(n => c.target.find(t => t.name === n) || c.neighbors.find(t => t.name === n))
      .filter(Boolean);
    // 9-25 ver6: no longer re-sorted brightest-first. The slideshow now names
    // stars in the card's own labels order, the same order reveal-more
    // already used, so a card can choose its sequence (e.g. Alnasl and
    // Sgr A* first on Sagittarius).
    let t = 0;
    return list.map(star => {
      const dur = star.notable ? notableHoldMs(star.notable) : STAR_NAME_INTERVAL;
      const entry = { name: star.name, star, start: t, end: t + dur };
      t += dur;
      return entry;
    });
  }
  // The one star currently "on" during the starnames step — drives the
  // info/notable boxes the same way moreStarFocus() does for reveal-more.
  // Unlike the name-by-name reveal (which leaves earlier names up), only
  // one star owns the boxes at a time.
  function slideStarBoxFocus() {
    if (!slideshow || slideStepId() !== 'starnames' || !active) return null;
    const schedule = slideStarSchedule(active);
    const entry = schedule.find(e => slideElapsed >= e.start && slideElapsed < e.end);
    return entry ? entry.star : null;
  }
  const NEIGHBOUR_INTERVAL = 2000;   // ms each surrounding constellation holds
  // A constellation needs this many stars on screen to take a turn. One or
  // two stray stars from a figure mostly off the card teaches nothing and
  // just adds a beat to the sequence.
  const NEIGHBOUR_MIN_STARS = 4;
  // Which surrounding constellation is lit right now. Showing them all at once
  // was too crowded to read — one at a time, each named, is the difference
  // between a picture and a lesson.
  let slideNeighbourList = [];
  let slideshow = false;
  let slideOrder = [];
  let slideIndex = 0;
  let slideStep = 0;
  let slideElapsed = 0;     // ms into the current step
  let slidePaused = false;
  let slideLast = 0;        // timestamp of the previous frame
  let slideRAF = null;

  function slideStepId() {
    return slideshow ? SLIDE_STEPS[slideStep].id : null;
  }
  // How far through the current step, 0..1. The zoom reads this.
  function slideProgress() {
    if (!slideshow) return 0;
    return Math.min(1, slideElapsed / SLIDE_STEPS[slideStep].ms);
  }
  function slideAtLeast(id) {
    if (!slideshow) return false;
    return slideStep >= SLIDE_STEPS.findIndex(s => s.id === id);
  }

  function startSlideshow() {
    // A flash-deck reveal sequence left running (revealFlash's timer, or
    // moreSeq's own raf loop) must be stopped before slideshow starts its
    // own raf loop — two independent tickers both calling render() and
    // fighting over shared state (currentFraction/fovSlider in particular,
    // since moreSeq's widen phase and slideshow's own zoomout step both
    // drive it) is exactly the kind of thing that corrupts state or throws.
    stopRevealFlash();
    stopMoreSeq();
    // Every card that isn't switched off, once each, shuffled.
    const ids = CONSTELLATIONS.map(c => c.id).filter(id => loadFreq(id) !== 0);
    if (!ids.length) return;
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    slideOrder = ids;
    slideIndex = 0;
    slideshow = true;
    fovRow.classList.add('muted');
    magRow.classList.add('muted');
    slidePaused = false;
    closeIndex();
    paintSlideControls();
    loadSlide();
    slideLast = performance.now();
    slideRAF = requestAnimationFrame(slideTick);
  }

  function stopSlideshow() {
    swipeHint.style.visibility = 'visible';
    slideshow = false;
    // The natural "ran out of cards" end of a slideshow calls this with
    // slideStep already incremented one past SLIDE_STEPS' last index (see
    // slideTick) — nothing else ever put it back in range. Restarting
    // slideshow then crashed almost immediately: startSlideshow() sets
    // slideshow=true and calls closeIndex(), which calls updateState(),
    // which — since slideshow is already true — calls render() BEFORE
    // loadSlide() gets a chance to reset slideStep to 0, and render() reads
    // SLIDE_STEPS[slideStep] while it's still out of bounds. Reproduced
    // reliably with a single-card deck (fast to reach natural completion);
    // real with any deck size, just slower to hit by accident.
    slideStep = 0;
    fovRow.classList.remove('muted');
    magRow.classList.remove('muted');
    if (slideRAF) cancelAnimationFrame(slideRAF);
    slideRAF = null;
    revealBtn.classList.remove('slide-pause', 'slide-play');
    resetBtn.classList.remove('slide-leave');
    // paintSlideControls() set this to "leave" for the slideshow's own use
    // and nothing else ever set it back — updateState() only touches
    // revealBtn's text, not resetBtn's, so without this the button kept
    // reading "leave" (with the leave colour removed, so unstyled but still
    // mislabelled) after returning to flash-deck/reveal-more.
    resetBtn.textContent = "reset card";
    if (active) loadCard(active);
    updateState();
    openIndex();
  }

  function loadSlide() {
    slideStep = 0;
    slideElapsed = 0;
    const c = byId(slideOrder[slideIndex]);
    loadCard(c);
    // Names arrive one at a time, so this step's length depends on how many
    // there are — plus a hold at the end so the full set is readable before
    // the card moves on. Notable stars now also carry the info/notable
    // boxes (see slideStarSchedule), so their slot runs longer than a plain
    // star's — the schedule already accounts for that.
    const schedule = slideStarSchedule(c);
    SLIDE_STEPS[SLIDE_STEPS.findIndex(s => s.id === 'starnames')].ms =
      (schedule.length ? schedule[schedule.length - 1].end : 0) + 1400;
    // Everything visible, whatever the card was last set to. At a tighter
    // limit some figures lose stars entirely and the stick figure comes out
    // broken — the slideshow is for showing the constellation, not for
    // simulating a poor night. 5.0 was the deck's old flat ceiling; now that
    // a card's lines can need slightly more (see lineFaintest), match that
    // instead of hardcoding past it.
    limitMag = Math.min(parseFloat(magSlider.max), Math.max(5.0, Math.ceil(lineFaintest(c) * 10) / 10));
    magSlider.value = limitMag;
    magReadout.textContent = `limit mag ${limitMag.toFixed(1)}`;
    // Opens at the card's tightest field — the whole point of the first beat
    // is to see the figure close up before being told what it is.
    setSlideFraction(maxFractionFor(c));
    revealLevel = 0;
    named = false;
    stopRevealFlash();
    updateState();
  }

  function setSlideFraction(f) {
    const lo = parseFloat(fovSlider.min), hi = parseFloat(fovSlider.max);
    currentFraction = Math.min(hi, Math.max(lo, f));
    fovSlider.value = currentFraction;
    updateFovReadout();
    resize();
  }

  function slideTick(now) {
    if (!slideshow) return;
    const dt = now - slideLast;
    slideLast = now;
    if (!slidePaused) {
      slideElapsed += dt;
      const step = SLIDE_STEPS[slideStep];

      // The zoom is the only step that changes anything continuously.
      if (step.id === 'zoomout') {
        const lo = parseFloat(fovSlider.min), hi = parseFloat(fovSlider.max);
        const t = slideProgress();
        // Ease so it starts and ends gently rather than snapping.
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        setSlideFraction(hi + (lo - hi) * e);
      }

      // Redraw every frame: the star names arrive one at a time and the
      // neighbours cycle, so the picture changes within a step, not just at
      // the boundaries between them.
      render();

      if (slideElapsed >= step.ms) {
        slideElapsed = 0;
        slideStep++;
        if (slideStep >= SLIDE_STEPS.length) {
          slideIndex++;
          if (slideIndex >= slideOrder.length) { stopSlideshow(); return; }
          loadSlide();
        } else {
          applySlideStep();
        }
      }
    }
    slideRAF = requestAnimationFrame(slideTick);
  }

  // Each step sets the reveal state it needs; render() reads slideStepId() for
  // the parts that are specific to the slideshow.
  function applySlideStep() {
    const id = SLIDE_STEPS[slideStep].id;
    if (id === 'name') { revealLevel = 1; named = true; }
    if (id === 'neighbours') {
      revealLevel = 2;
      // Work out which constellations are actually represented on this card
      // and give each one its own turn, so the step lasts as long as it needs.
      // Render first so star positions are current, then take only the
      // constellations with a star actually on screen — otherwise the step
      // waits its turn on figures nobody can see.
      render();
      const counts = {};
      allStars.forEach(s => {
        if (!s.adjacentTo || s.mag > limitMag || !s._pos) return;
        const p = s._pos;
        if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return;
        counts[s.adjacentTo] = (counts[s.adjacentTo] || 0) + 1;
      });
      slideNeighbourList = Object.keys(counts)
        .filter(n => counts[n] >= NEIGHBOUR_MIN_STARS).sort();
      SLIDE_STEPS[SLIDE_STEPS.findIndex(s => s.id === 'neighbours')].ms =
        Math.max(1, slideNeighbourList.length) * NEIGHBOUR_INTERVAL;
    }
    updateState();
  }

  // The one currently taking its turn, or null outside that step.
  function slideNeighbourFocus() {
    if (!slideshow || slideStepId() !== 'neighbours' || !slideNeighbourList.length) return null;
    const i = Math.min(slideNeighbourList.length - 1,
      Math.floor(slideElapsed / NEIGHBOUR_INTERVAL));
    return slideNeighbourList[i];
  }

  function paintSlideControls() {
    revealBtn.textContent = slidePaused ? "play" : "pause";
    revealBtn.classList.toggle('slide-pause', !slidePaused);
    revealBtn.classList.toggle('slide-play', slidePaused);
    revealBtn.classList.remove('disabled');
    resetBtn.textContent = "leave";
    resetBtn.classList.add('slide-leave');
  }

  indexSlides.addEventListener('click', startSlideshow);

  // =========================================================================
  // SECOND REVEAL — "reveal more"
  // Rather than dumping everything on screen at once, the second press walks
  // through the card: each labelled star named on its own, then each
  // surrounding constellation lit on its own, then settling with the whole
  // thing showing. Names replace each other rather than accumulating, so the
  // eye goes to one star, then the next, instead of scanning a wall of text.
  // =========================================================================
  // The 'stars' phase has three sub-beats per labelled star: the name alone,
  // a pause (name still up, nothing new), then the info/notable boxes pop in
  // together and hold. Timings are a first pass — easy to retune, since the
  // user's own estimate going in was "may be off."
  const MORE_STAR_NAME_MS = 2000;   // name alone, as it always was
  const MORE_STAR_PAUSE_MS = 1333;  // beat before the boxes appear (cut by 1/3 from 2000, per user)
  const MORE_STAR_BOX_MS = 3000;    // how long the boxes stay up, for stars with no notable text (those with one now pause indefinitely — see awaitingContinue)
  const MORE_STAR_MS = MORE_STAR_NAME_MS + MORE_STAR_PAUSE_MS + MORE_STAR_BOX_MS;
  const MORE_LEAD_MS = 1000;   // beat before the first name, so it isn't abrupt
  const MORE_WIDEN_MS = 2200;  // time to cross the whole slider, if it goes that far
  const MORE_LINES_MS = 1750;
  const MORE_NEIGHBOUR_MS = 2000;
  // The star currently being named blinks between invisible and its own
  // natural colour, rather than the old solid-red-and-doubled-size
  // treatment — the figure's lines (now shown from the very start of the
  // sequence, not just after naming finishes) are what separate the whole
  // shape from the field; this blink is only for pointing at the ONE star
  // whose name is on screen right now. Runs for as long as that star is
  // current (moreSeq.elapsed resets to 0 at the start of each star's
  // span — see moreTick), across all three of its sub-beats (name, pause,
  // boxes), so it keeps blinking even while a notable star's box is up.
  const MORE_STAR_FLASH_ON_MS = 1000;
  const MORE_STAR_FLASH_OFF_MS = 500;
  let moreSeq = null;   // { phase, i, elapsed, stars[], neighbours[], raf }
  let nameFlash = false;   // first reveal shows the name on the card briefly
  let nameFlashTimer = null;

  // Plain-reveal flashing: 1s on, 2s off, repeating, while revealLevel === 1
  // and moreSeq is null (see inPlainReveal in render()). Not raf-driven since
  // nothing else is animating during this state — a plain timer avoids
  // spinning a frame loop for a once-every-3s toggle.
  let revealFlashOn = true;
  let revealFlashTimer = null;
  const REVEAL_FLASH_ON_MS = 1000;
  const REVEAL_FLASH_OFF_MS = 2000;

  function stopRevealFlash() {
    clearTimeout(revealFlashTimer);
    revealFlashTimer = null;
  }

  function scheduleRevealFlash() {
    stopRevealFlash();
    revealFlashOn = true;
    render();
    const step = () => {
      revealFlashOn = !revealFlashOn;
      render();
      revealFlashTimer = setTimeout(step, revealFlashOn ? REVEAL_FLASH_ON_MS : REVEAL_FLASH_OFF_MS);
    };
    revealFlashTimer = setTimeout(step, REVEAL_FLASH_ON_MS);
  }

  function moreStarFocus() {
    return moreSeq && moreSeq.phase === 'stars' ? moreSeq.stars[moreSeq.i] : null;
  }
  function moreNeighbourFocus() {
    return moreSeq && moreSeq.phase === 'neighbours' ? moreSeq.neighbours[moreSeq.i] : null;
  }
  // Whether the star currently named in the 'stars' phase has notable text —
  // this is what decides whether its 'boxes' sub-beat pauses for input
  // (see moreSeq.awaitingContinue) or times out on its own like before.
  function currentStarHasNotable() {
    if (!moreSeq || moreSeq.phase !== 'stars') return false;
    const name = moreSeq.stars[moreSeq.i];
    // A labeled star can resolve against target OR neighbors — first tried
    // for Pegasus's Eta Piscium and reverted (36.6 degrees out, never
    // actually on screen); reinstated for theta Piscium/"Pisces", which
    // sits only 15 degrees out, well inside Alpheratz/Enif's own distance,
    // so the geometry problem that sank the first attempt doesn't apply.
    const s = active && [...active.target, ...active.neighbors].find(t => t.name === name);
    return !!(s && s.notable);
  }
  // Which of the three per-star sub-beats we're in right now, given how far
  // into this star's span moreSeq.elapsed is. null outside the 'stars' phase.
  function starSubPhase() {
    if (!moreSeq || moreSeq.phase !== 'stars') return null;
    const e = moreSeq.elapsed;
    if (e < MORE_STAR_NAME_MS) return 'name';
    if (e < MORE_STAR_NAME_MS + MORE_STAR_PAUSE_MS) return 'pause';
    return 'boxes';
  }

  // Which surrounding constellations are properly on screen right now.
  const MORE_NEIGHBOUR_TARGET = 3;   // widen until this many are in frame
  function visibleNeighbours() {
    const counts = {};
    allStars.forEach(s => {
      if (!s.adjacentTo || s.mag > limitMag || !s._pos) return;
      const p = s._pos;
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return;
      counts[s.adjacentTo] = (counts[s.adjacentTo] || 0) + 1;
    });
    // Was: required EVERY drawable star of a neighbour on screen before it
    // counted at all. That's stricter than the slideshow's own neighbour
    // step (which just wants NEIGHBOUR_MIN_STARS in frame) and was the
    // actual cause of a real bug: a neighbour with most, but not literally
    // all, of its figure on screen never made this list, so it never got
    // named or lit here even though it was plainly visible as background
    // dots — e.g. Pegasus's reveal-more only ever named Cassiopeia even
    // with Perseus and Aquila both lit. Matched to the slideshow's simpler,
    // already-correct threshold instead.
    return Object.keys(counts)
      .filter(n => counts[n] >= NEIGHBOUR_MIN_STARS)
      .sort();
  }

  function setMoreFraction(f) {
    const lo = parseFloat(fovSlider.min), hi = parseFloat(fovSlider.max);
    currentFraction = Math.min(hi, Math.max(lo, f));
    fovSlider.value = currentFraction;
    updateFovReadout();
    resize();
  }

  function stopMoreSeq(completed) {
    if (moreSeq && moreSeq.raf) cancelAnimationFrame(moreSeq.raf);
    moreSeq = null;
    hideMoreBoxes();
    revealBtn.classList.remove('more-continue');
    // Lit only when the sequence ran all the way through on its own (every
    // neighbour finished displaying) — every other call site (tap-to-
    // cancel, swipe to a new card, resetBtn itself, starting a fresh
    // sequence, entering slideshow) calls this with no argument, which
    // clears it. A press of "reset card" while it's lit clears it too, same
    // as any other stopMoreSeq call — the button doesn't need special-
    // casing, pressing it is itself the acknowledgement.
    resetBtn.classList.toggle('more-done', !!completed);
  }

  function startMoreSeq() {
    stopMoreSeq();
    // If a star's info panel is open from a direct tap (flash-deck mode),
    // close it here — otherwise it sat on screen for the rest of the
    // sequence, cluttering the card while reveal-more's own boxes stepped
    // through every other star underneath it.
    closeInfo();
    tooltip.classList.remove('show');
    selectedStar = null;
    // Lift the magnitude limit to include the faintest star in the figure.
    // Below that the figure is missing stars and the stick lines run to
    // nothing, which is what made this need fixing by hand every time. Only
    // ever raised, never lowered, and deliberately not written to storage —
    // swiping away and back restores whatever the card was set to.
    const faintest = Math.max(...active.target.map(s => s.mag), lineFaintest(active));
    if (limitMag < faintest) {
      limitMag = Math.min(parseFloat(magSlider.max), Math.ceil(faintest * 10) / 10);
      magSlider.value = limitMag;
      magReadout.textContent = `limit mag ${limitMag.toFixed(1)}`;
      resize();
    }

    // See currentStarHasNotable's comment: a labeled name resolves against
    // target or neighbors.
    const stars = (active.labels || []).filter(n =>
      [...active.target, ...active.neighbors].some(s => s.name === n && s.mag <= limitMag));
    render();   // so every star has a screen position before we count
    const neighbours = visibleNeighbours();

    if (!stars.length && !neighbours.length) { render(); return; }
    moreSeq = {
      phase: 'lead',
      i: 0, elapsed: 0, stars, neighbours, last: performance.now(), raf: null,
      awaitingContinue: false
    };
    moreSeq.raf = requestAnimationFrame(moreTick);
  }

  // Resumes a 'stars' phase paused on a notable-star's boxes (see moreTick).
  // Called by the reveal-more button (while it's lit, see updateState/render)
  // and by a tap anywhere on the card — either is "I've read this, go on."
  function advanceMoreSeq() {
    if (!moreSeq || !moreSeq.awaitingContinue) return;
    moreSeq.awaitingContinue = false;
    revealBtn.classList.remove('more-continue');
    moreSeq.elapsed = 0;
    moreSeq.i++;
    if (moreSeq.i >= moreSeq.stars.length) {
      moreSeq.phase = 'lines';
      moreSeq.i = 0;
    }
    updateState();
    moreSeq.last = performance.now();
    render();
    // moreTick keeps a frame pending even while paused now (see its own
    // comment), purely to keep the flash animating — cancel it before
    // requesting the next one, or both fire and race on the same shared
    // moreSeq.last/raf state.
    if (moreSeq.raf) cancelAnimationFrame(moreSeq.raf);
    moreSeq.raf = requestAnimationFrame(moreTick);
  }

  // Tapping a star mid reveal-more pauses the sequence (its info box opens
  // as usual) instead of cancelling it; the reveal button lights up as
  // "continue". Pressing it closes the info box and picks up exactly where
  // the sequence left off. Tapping other stars while paused just shows
  // their info — it stays paused until "continue".
  function pauseMoreSeqForTap() {
    if (!moreSeq || moreSeq.userPaused) return;
    moreSeq.userPaused = true;
    if (moreSeq.raf) cancelAnimationFrame(moreSeq.raf);
    moreSeq.raf = null;
    updateState();
  }
  function resumeMoreSeq() {
    if (!moreSeq || !moreSeq.userPaused) return;
    moreSeq.userPaused = false;
    closeInfo();
    tooltip.classList.remove('show');
    selectedStar = null;
    revealBtn.classList.remove('more-continue');
    updateState();
    // Rebase the frame clock, or the first frame charges the whole paused
    // interval to the current step and skips ahead.
    moreSeq.last = performance.now();
    if (moreSeq.raf) cancelAnimationFrame(moreSeq.raf);
    moreSeq.raf = requestAnimationFrame(moreTick);
  }

  function moreTick(now) {
    if (!moreSeq) return;
    if (moreSeq.userPaused) return;
    const dt = now - moreSeq.last;
    moreSeq.elapsed += dt;
    moreSeq.last = now;
    // A labelled star with notable text pauses here indefinitely once its
    // boxes are up, rather than timing out — the reveal-more button lights
    // up (see render/'more-continue') and a tap on it, or anywhere on the
    // card, calls advanceMoreSeq() to move on. Stars with no notable text
    // (info box only) fall through to the normal timed advance below,
    // unchanged.
    //
    // "Paused" only means the star-to-star advance is frozen — elapsed
    // keeps growing and moreTick keeps rescheduling itself below, so the
    // named star's flash (which reads elapsed % cycle) keeps blinking the
    // whole time the box is up, rather than freezing on whatever phase it
    // happened to be in when the pause started. advanceMoreSeq cancels this
    // pending frame before requesting its own, so continuing never leaves
    // two moreTick loops running at once.
    if (moreSeq.phase === 'stars' && starSubPhase() === 'boxes' && currentStarHasNotable()) {
      if (!moreSeq.awaitingContinue) {
        moreSeq.awaitingContinue = true;
        revealBtn.textContent = 'continue';
        revealBtn.classList.remove('disabled');
        revealBtn.classList.add('more-continue');
      }
      render();
      moreSeq.raf = requestAnimationFrame(moreTick);
      return;
    }
    // Widening isn't a fixed beat — it pulls back at a steady rate and stops
    // the moment enough is in frame, or when the slider runs out.
    if (moreSeq.phase === 'widen') {
      const lo = parseFloat(fovSlider.min), hi = parseFloat(fovSlider.max);
      const perMs = (hi - lo) / MORE_WIDEN_MS;
      setMoreFraction(currentFraction - perMs * dt);
      render();
      const seen = visibleNeighbours();
      if ((seen.length >= MORE_NEIGHBOUR_TARGET && wideLabelsInFrame() && figureInFrame()) || currentFraction <= lo + 1e-9) {
        if (!seen.length) { stopMoreSeq(); render(); return; }
        moreSeq.neighbours = seen;
        moreSeq.phase = 'neighbours';
        moreSeq.i = 0;
        moreSeq.elapsed = 0;
      }
      moreSeq.raf = requestAnimationFrame(moreTick);
      return;
    }

    const span = moreSeq.phase === 'lead' ? MORE_LEAD_MS
               : moreSeq.phase === 'stars' ? MORE_STAR_MS
               : moreSeq.phase === 'lines' ? MORE_LINES_MS
               : MORE_NEIGHBOUR_MS;
    if (moreSeq.elapsed >= span) {
      moreSeq.elapsed = 0;
      moreSeq.i++;
      const list = moreSeq.phase === 'lead' ? [0]
                 : moreSeq.phase === 'stars' ? moreSeq.stars
                 : moreSeq.phase === 'lines' ? [0]
                 : moreSeq.phase === 'widen' ? [0]
                 : moreSeq.neighbours;
      if (moreSeq.i >= list.length) {
        if (moreSeq.phase === 'lead') {
          // A beat with the figure simply red before any naming starts —
          // landing straight on the first name felt abrupt.
          moreSeq.phase = moreSeq.stars.length ? 'stars' : 'lines';
          moreSeq.i = 0;
        } else if (moreSeq.phase === 'stars') {
          // The stick figure only appears once the naming is done — drawn
          // earlier it competes with the names and makes it harder to tie a
          // name to its dot.
          moreSeq.phase = 'lines';
          moreSeq.i = 0;
        } else if (moreSeq.phase === 'lines') {
          // Zoomed in close there may be nothing around the figure to show.
          // Rather than jumping to the widest field — which on a crowded part
          // of the sky would throw a dozen constellations up at once — pull
          // back only until a few neighbours are in frame, then stop. That
          // behaves the same however many cards the deck grows to.
          // wideLabelsInFrame: keep widening until any wide-only neighbor
          // names (Summer Triangle on Aquila/Lyra) are in frame too.
          if ((visibleNeighbours().length >= MORE_NEIGHBOUR_TARGET && wideLabelsInFrame() && figureInFrame()) ||
              currentFraction <= parseFloat(fovSlider.min) + 1e-9) {
            moreSeq.neighbours = visibleNeighbours();
            if (!moreSeq.neighbours.length) { stopMoreSeq(); render(); return; }
            moreSeq.phase = 'neighbours';
          } else {
            moreSeq.phase = 'widen';
          }
          moreSeq.i = 0;
        } else if (moreSeq.phase === 'widen') {
          moreSeq.neighbours = visibleNeighbours();
          if (!moreSeq.neighbours.length) { stopMoreSeq(); render(); return; }
          moreSeq.phase = 'neighbours';
          moreSeq.i = 0;
        } else {
          // Settle on the finished card: figure drawn, every neighbour lit.
          // completed=true lights up resetBtn — this is the one place the
          // sequence ends on its own rather than being cut short.
          stopMoreSeq(true);
          render();
          return;
        }
      }
    }
    render();
    moreSeq.raf = requestAnimationFrame(moreTick);
  }

  revealBtn.addEventListener('click', () => {
    if (slideshow) {
      slidePaused = !slidePaused;
      if (!slidePaused) {
        // Resuming clears whatever star was being examined — the info box
        // and tooltip belong to the pause, not to the playback.
        closeInfo();
        tooltip.classList.remove('show');
        selectedStar = null;
        // Frame clock kept running while paused; rebase it or the first
        // unpaused frame charges the whole paused interval to this step.
        slideLast = performance.now();
      }
      paintSlideControls();
      render();
      return;
    }
    if (moreSeq && moreSeq.userPaused) { resumeMoreSeq(); return; }
    if (moreSeq && moreSeq.awaitingContinue) { advanceMoreSeq(); return; }
    if (!active) return;
    // Pressing reveal (any press) dismisses whatever star was tapped and
    // examined manually — matches reveal-more's own cleanup on the 1→2
    // press (see startMoreSeq), now applied to the very first press too.
    closeInfo();
    tooltip.classList.remove('show');
    selectedStar = null;
    const wasLevel = revealLevel;
    revealLevel = Math.min(2, revealLevel + 1);
    named = true;
    updateState();
    if (wasLevel === 0 && revealLevel === 1) {
      nameFlash = true;
      render();
      clearTimeout(nameFlashTimer);
      nameFlashTimer = setTimeout(() => { nameFlash = false; render(); }, 1500);
      scheduleRevealFlash();
    }
    if (wasLevel === 1 && revealLevel === 2) { stopRevealFlash(); startMoreSeq(); }
  });

  resetBtn.addEventListener('click', () => {
    if (slideshow) { stopSlideshow(); return; }
    if (!active) return;
    revealLevel = 0;
    named = false;
    wideLabelsShown = false;
    selectedStar = null;
    tooltip.classList.remove('show');
    stopRevealFlash();
    stopMoreSeq();
    updateState();
    render();
  });

  // Combined gesture handling on the whole deck area: horizontal drags move
  // between cards, an upward drag from anywhere opens the card index.
  let touchStartX = null, touchStartY = null;
  deckEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  deckEl.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    // Side swipe is disabled during the slideshow — it's hands-free and
    // paced by design, so a stray horizontal drag shouldn't jump it around.
    if (!slideshow && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      if (dx < 0) goNext(); else goPrev();
    } else if (dy < -30) {
      // Swiping up during the slideshow used to just open the index overlay
      // on top of it, leaving slideshow's own raf loop running underneath —
      // it kept ticking (and cycling cards) behind the index, and pressing
      // Flash Deck from there fought with that still-live loop instead of
      // actually starting a flash-deck session. stopSlideshow() already
      // ends with openIndex(), so this is the fix, not an addition to it.
      if (slideshow) stopSlideshow(); else openIndex();
    }
    touchStartX = null; touchStartY = null;
  }, { passive: true });

  // mouse fallback for desktop preview
  let mouseStartX = null, mouseStartY = null;
  deckEl.addEventListener('mousedown', e => { mouseStartX = e.clientX; mouseStartY = e.clientY; });
  deckEl.addEventListener('mouseup', e => {
    if (mouseStartX === null) return;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    if (!slideshow && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      if (dx < 0) goNext(); else goPrev();
    } else if (dy < -30) {
      if (slideshow) stopSlideshow(); else openIndex();
    }
    mouseStartX = null; mouseStartY = null;
  });

  // tap-to-identify (only meaningful once a star card is active)
  // Distance is deliberately coarse. This is for building intuition about
  // relative distance, not for measurement, and false precision makes a
  // number harder to hold in your head. Each band's step is no coarser than
  // the band below can express, so no value rounds past one that's already
  // displayable — 160 becomes 150, never 200.
  function formatDistance(ly) {
    let step;
    if (ly < 30) step = 1;
    else if (ly < 150) step = 10;
    else if (ly < 300) step = 50;
    else step = 100;
    const rounded = Math.round(ly / step) * step;
    // The tilde marks any value shown in a coarse band, not merely one the
    // arithmetic happened to move. A distance of 1100 ly rounds to itself at
    // the nearest 100, and without this it would print bare — implying a
    // precision it doesn't have, right next to a "~1300" of exactly the same
    // reliability. Anything outside the nearest-1 band is approximate.
    const approx = step > 1 || Math.abs(rounded - ly) > 1e-9;
    return `${approx ? "~" : ""}${rounded} ly`;
  }

  // The full spectral string carries detail that means nothing until the
  // basics are second nature: the subclass digit, peculiarity suffixes, and
  // ranges where classifiers disagree. Display keeps the leading letter
  // (colour and temperature) and the first luminosity numeral (size and
  // evolutionary stage), which are the two things worth learning first.
  // "B0.5 IVpe" becomes "B IV", "A5 III-IV" becomes "A III".
  function formatType(type) {
    const m = type.match(/^([OBAFGKM])/);
    if (!m) return null;
    // Strip the class letter and subclass digits, then read the luminosity
    // numeral off the front of what's left. Matching it in place doesn't work:
    // a word boundary fails on "IIIa" and "IVpe" because a letter follows,
    // and those suffixed forms are common. Alternation order matters too, so
    // that "III-IV" yields III rather than stopping at I.
    const rest = type.replace(/^[OBAFGKM][\d.\-]*\s*/, "");
    const lum = rest.match(/^(IV|I{1,3}|V)/);
    // Keep the subclass digit on every B star, at any luminosity class —
    // the letter B alone is ambiguous about fate (the 8 solar mass
    // supernova threshold sits inside it, between B2 and B3) no matter
    // whether the star is still on the main sequence or has evolved into a
    // subgiant/giant/supergiant. Every other letter is unambiguous once you
    // know the luminosity class, so the digit is dropped there.
    const digit = (type.match(/^[OBAFGKM](\d)/) || [])[1];
    const keepDigit = m[1] === "B" && digit !== undefined;
    return m[1] + (keepDigit ? digit : "") + (lum ? " " + lum[1] : "");
  }

  // ---- Spectral class reference, for the info panel -----------------------
  // Bands, not exact figures. Ranges are easier to hold than two-decimal
  // values, and the point is to know roughly where a star sits, not to
  // reproduce a table. Temperatures in thousands of Kelvin.
  const LETTER_INFO = {
    O: { hue: "blue",         temp: "30+" },
    B: { hue: "blue-white",   temp: "10–30" },
    A: { hue: "white",        temp: "7.5–10" },
    F: { hue: "yellow-white", temp: "6–7.5" },
    G: { hue: "yellow",       temp: "5–6" },
    K: { hue: "orange",       temp: "3.5–5" },
    M: { hue: "red",          temp: "under 3.5" }
  };

  const LUM_INFO = {
    I:   "Supergiant",
    II:  "Bright giant",
    III: "Giant",
    IV:  "Subgiant",
    V:   "Main sequence"
  };

  // Mass is the line that answers "what happens to this star", so it's shown
  // for everything that has a readable luminosity numeral — not just the main
  // sequence. Whole numbers only: the point is fate and the comparison to the
  // Sun, and no fate turns on the difference between 3 and 4 solar masses.
  //
  // Which part of the type determines it depends on the star:
  //   O — the digit, at any size. O stars die young and barely cool before
  //       they go, so an O7 supergiant started near an O7 dwarf's mass.
  //   B V — the digit, and this is the one that matters: the 8 solar mass
  //       supernova threshold sits inside it, between B2 and B3.
  //   everything else — the letter and the numeral together. For cool stars
  //       the numeral does the real work, because a red giant and a red
  //       supergiant share a letter and differ tenfold in mass.
  //
  // The digit feeds the calculation throughout but is only displayed for B
  // stars (see formatType) — at any luminosity class, since B is the one
  // letter where the digit alone flips the fate (supernova vs. white
  // dwarf). Everywhere else the narrowing shows up in the number itself.
  const MASS_O = [
    { max: 4,   m: "60–90" },
    { max: 6,   m: "35–60" },
    { max: 8,   m: "25–35" },
    { max: 9.5, m: "16–25" }
  ];
  const MASS_BV = { 0: "16", 1: "13", 2: "9", 3: "7", 4: "6", 5: "5", 6: "5", 7: "4", 8: "3", 9: "3" };
  const HOT = { B: { V: null, IV: "6–15", III: "6–15", II: "15–25", I: "15–25" },
                A: { V: "2–3", IV: "2–4", III: "2–4", II: "8–20", I: "8–20" } };
  const COOL = { V: null, IV: "1–2", III: "1–3", II: "8–20", I: "8–20" };
  const COOL_V = { F: "1–2", G: "~1", K: "under 1", M: "under 1" };

  function massFor(p) {
    if (!p || !p.lum) return null;
    if (p.letter === "O") {
      const d = p.digit !== undefined ? parseFloat(p.digit) : 9;
      for (const band of MASS_O) if (d <= band.max) return band.m;
      return "16–25";
    }
    if (p.letter === "B" && p.lum === "V") {
      return p.digit !== undefined && MASS_BV[p.digit] ? MASS_BV[p.digit] : "3–16";
    }
    if (HOT[p.letter]) return HOT[p.letter][p.lum] || null;
    if (p.lum === "V") return COOL_V[p.letter] || null;
    return COOL[p.lum] || null;
  }

  // Pull the pieces out of a full spectral string: class letter, subclass
  // digit, luminosity numeral.
  function parseType(type) {
    const letter = (type.match(/^([OBAFGKM])/) || [])[1];
    if (!letter) return null;
    const digit = (type.match(/^[OBAFGKM](\d)/) || [])[1];
    const rest = type.replace(/^[OBAFGKM][\d.\-]*\s*/, "");
    const lum = (rest.match(/^(IV|I{1,3}|V)/) || [])[1];
    return { letter, digit, lum };
  }

  // Tap handling runs off pointer events rather than click. The card sits
  // inside the swipe handler with touch-action: none, and a synthesized
  // click after a touch is unreliable there — it can be swallowed outright
  // if the finger drifts even slightly. Tracking pointerdown/pointerup
  // ourselves and treating anything under DRAG_SLOP as a tap makes it fire
  // every time, and the card's border offset is removed explicitly so the
  // coordinates line up with the canvas rather than the border box.
  const DRAG_SLOP = 12;
  let tapStart = null;
  let tooltipTimer = null;
  // The star whose info panel is open, or null. Distinct from selectedStar:
  // the tooltip can be up without the panel being open.
  let infoStar = null;

  function closeInfo() {
    if (!infoStar) return;
    infoStar = null;
    infoPanel.classList.remove('show');
  }

  function openInfo(star) {
    infoStar = star;
    // Guards against a tap landing on the info panel itself (its body has no
    // stopPropagation of its own — only the close button does) being read as
    // an empty-space dismiss by handleTap() underneath, which would close
    // the panel that was just opened. Most likely when the panel ends up
    // positioned right where the next tap naturally lands. 1s per user
    // request; see the check in handleTap().
    infoOpenGuardUntil = performance.now() + 1000;
    const body = document.getElementById('infoBody');
    body.innerHTML = "";
    const add = (cls, html) => {
      const d = document.createElement('div');
      d.className = cls;
      d.innerHTML = html;
      body.appendChild(d);
      return d;
    };

    // Magnitude is deliberately left out: it's already on the box you tapped to
    // get here, and this panel is for the things that need explaining. Distance
    // sits up on the name row instead, full brightness and full size — it's
    // something to learn, not a footnote — which also keeps room free below for
    // fields added later.
    const nameRow = add('ip-name', "");
    // Both wrapped in spans so each stays whole — see the flex rule in the CSS.
    const n = document.createElement('span');
    n.textContent = star.name || "unnamed star";
    nameRow.appendChild(n);
    if (typeof star.dist === 'number') {
      const d = document.createElement('span');
      d.textContent = formatDistance(star.dist);
      nameRow.appendChild(d);
    }

    if (star.kind) add('ip-code', star.kind);
    if (star.type) {
      const p = parseType(star.type);
      const simple = formatType(star.type);
      if (simple) {
        const code = add('ip-code', simple);
        code.style.color = `rgb(${colorForBV(star.bv, 0.2)})`;
      }
      if (p) {
        // What the numeral means, plus the mass range it implies — only for
        // main-sequence stars, where the letter actually tracks mass.
        if (p.lum && LUM_INFO[p.lum]) {
          add('ip-size', `<b>${p.lum}</b>${LUM_INFO[p.lum]}`);
        }
        // What the letter means. Coloured as the star, so the letter and the
        // hue teach each other.
        const li = LETTER_INFO[p.letter];
        if (li) {
          const label = p.letter + (p.lum === "V" && p.digit !== undefined ? p.digit : "");
          // No separator between the colour and the temperature: a middle dot
          // reads as a decimal point next to values like 3.5.
          const row = add('ip-key', `<b>${label}</b>${li.hue}` +
            `<span class="ip-temp">${li.temp} K&times;10<sup>3</sup></span>`);
          row.style.color = `rgb(${colorForBV(star.bv, 0.35)})`;
        }
        // Mass gets its own line rather than hanging off the size row. What
        // sets it changes from star to star — the numeral for a cool giant,
        // the letter for an O star — so attaching it to either row would
        // assert a cause that isn't always the real one.
        //
        // Prefer the star's own looked-up mass (star.mass) when the card
        // provides one, over massFor(p)'s generic spectral-type estimate.
        // massFor() derives a mass purely from letter/digit/luminosity
        // class — a reasonable rule of thumb for an ordinary main-sequence
        // star, but it can miss badly for an evolved giant or supergiant,
        // where individual stars deviate a lot from the generic relation
        // (Orion's belt supergiants are the case that surfaced this: the
        // generic range didn't even contain the real, individually-sourced
        // figure). This was a real bug, not just missing data — star.mass
        // has existed on several cards' stars since Canis Major, but was
        // never actually read here; every card silently showed the generic
        // estimate regardless. Falls back to massFor(p) only when the star
        // has no explicit mass of its own.
        const mass = star.mass !== undefined ? star.mass : massFor(p);
        if (mass) add('ip-mass', `${mass} M☉`);
      }
    }

    // Same notable-feature text as the reveal-more boxes, shown here too so
    // a direct tap on a star (flash-deck mode, no auto-sequence involved)
    // gets the full picture in one panel rather than needing reveal-more to
    // ever have been pressed. Silently omitted for the ~55 stars with none.
    if (star.notable) {
      add('ip-notable', `<b>Notable</b>${star.notable}`);
    }

    infoPanel.classList.add('show');
    // Place it in the quadrant diagonally opposite the star, so the star
    // being explained is never underneath it.
    const pad = 10;
    const pw = infoPanel.offsetWidth, ph = infoPanel.offsetHeight;
    const left = star._pos.x > W / 2 ? pad : W - pw - pad;
    const top = star._pos.y > H / 2 ? pad : H - ph - pad;
    infoPanel.style.left = Math.max(pad, Math.min(left, W - pw - pad)) + 'px';
    infoPanel.style.top = Math.max(pad, Math.min(top, H - ph - pad)) + 'px';
    // The tooltip stays up alongside the panel, so hold off its auto-hide.
    clearTimeout(tooltipTimer);
  }

  infoClose.addEventListener('pointerup', e => {
    e.stopPropagation();
    closeInfo();
  });
  // Same reasoning as tooltip's own stopPropagation below: without this, a
  // tap anywhere on the panel's body (not just the close button) bubbles to
  // the card underneath and can be read as a tap on empty sky, dismissing
  // the panel that's currently open. The 1s guard in handleTap() (see
  // infoOpenGuardUntil) covers the moment right after opening; this covers
  // it for as long as the panel stays open.
  infoPanel.addEventListener('pointerup', e => e.stopPropagation());
  infoPanel.addEventListener('click', e => e.stopPropagation());

  // The whole info box is the tap zone for opening the panel, not just the
  // (i). Stops propagation so the tap doesn't also reach the card underneath
  // and get treated as a tap on empty sky, which would dismiss everything.
  tooltip.addEventListener('pointerup', e => {
    e.stopPropagation();
    if (!selectedStar || infoStar) return;
    if (typeof selectedStar.dist !== 'number' && !selectedStar.type) return;
    openInfo(selectedStar);
  });
  tooltip.addEventListener('click', e => e.stopPropagation());
  // Safari can treat a quick second tap on the same spot as the beginning of a
  // double-tap gesture and fire pointercancel, which would drop the tap before
  // pointerup ever arrives — and the second tap is exactly what opens the info
  // panel. So the cancel path remembers where the finger went down instead of
  // discarding it, and a plain click acts as a backstop for any tap the
  // pointer path missed. lastTapAt keeps the two from both firing for one tap.
  let lastTapAt = 0;
  let infoOpenGuardUntil = 0;
  card.addEventListener('pointerdown', e => { tapStart = { x: e.clientX, y: e.clientY }; });
  card.addEventListener('pointercancel', e => {
    if (!active || !tapStart) return;
    const start = tapStart;
    tapStart = null;
    if (Math.hypot(e.clientX - start.x, e.clientY - start.y) <= DRAG_SLOP) {
      handleTap(e.clientX, e.clientY);
    }
  });
  card.addEventListener('click', e => {
    if (!active) return;
    if (Date.now() - lastTapAt < 400) return;  // pointer path already handled it
    handleTap(e.clientX, e.clientY);
  });
  card.addEventListener('pointerup', e => {
    const start = tapStart;
    tapStart = null;
    if (!active || !start) return;
    if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > DRAG_SLOP) return;
    handleTap(e.clientX, e.clientY);
  });

  function handleTap(clientX, clientY) {
    lastTapAt = Date.now();
    // A tap anywhere on the card while paused on a notable star's boxes
    // means "continue" — same as pressing the lit-up reveal-more button.
    // Takes priority over every other tap meaning below (star ID, dismiss,
    // slideshow resume) since the sequence is already frozen waiting for
    // exactly this.
    if (moreSeq && moreSeq.awaitingContinue) { advanceMoreSeq(); return; }
    const rect = card.getBoundingClientRect();
    const bw = (rect.width - card.clientWidth) / 2;
    const x = clientX - rect.left - bw;
    const y = clientY - rect.top - bw;
    let hit = null;
    let best = 999;
    let namedHit = null;
    let namedBest = 999;
    // Nearest-qualifying-center wins: a star only competes if the tap falls
    // within its own tap radius, and among those the closest center takes
    // it. That naturally splits close pairs at their midpoint while leaving
    // each star's full radius intact on the side with no neighbor nearby —
    // no separate radius-shrinking step needed.
    //
    // Named stars are tracked separately and win outright, because an unnamed
    // background star is never what someone is reaching for. Theta-2 Tauri has
    // Theta-1 sitting a twentieth of a degree away, and at high zoom the
    // nameless one kept stealing the tap — there's nothing to show for it, so
    // the tap just appeared to do nothing.
    allStars.forEach(s => {
      if (!s._pos || s.mag > limitMag) return;
      const d = Math.hypot(s._pos.x - x, s._pos.y - y);
      if (d >= s._tapR) return;
      if (s.name) {
        if (d < namedBest) { namedBest = d; namedHit = s; }
      } else if (d < best) { best = d; hit = s; }
    });
    if (namedHit) hit = namedHit;
    if (!hit) {
      // Empty space dismisses everything — except right after openInfo(),
      // where a tap landing on the info panel's own body (rather than a
      // star) can otherwise register as this and close the panel that was
      // just opened. See infoOpenGuardUntil in openInfo().
      if (infoStar && performance.now() < infoOpenGuardUntil) return;
      // During the slideshow that same
      // gesture also resumes playback, so closing an info box and getting
      // going again is one tap rather than two.
      closeInfo();
      tooltip.classList.remove('show');
      if (selectedStar) { selectedStar = null; render(); }
      if (slideshow && slidePaused) {
        slidePaused = false;
        // The frame clock has been running while paused; without this the
        // first unpaused frame would charge the whole paused interval to
        // the current step and jump it forward.
        slideLast = performance.now();
        paintSlideControls();
      }
      return;
    }
    // A tap during the reveal sequence ends it and identifies the star
    // instead. Tapping is already how you ask what something is, so it can't
    // also mean pause — and the sequence is short enough to simply replay.
    // Used to cancel the sequence outright; now it pauses it instead (see
    // pauseMoreSeqForTap), with "continue" on the reveal button to resume.
    if (moreSeq) { pauseMoreSeqForTap(); }
    // During the slideshow, asking what a star is means you want to stop and
    // look — so identifying a star pauses playback rather than letting the
    // sequence run on underneath the info box. Resumes exactly where it left
    // off, via the play button or a tap on empty space.
    if (slideshow && !slidePaused) {
      slidePaused = true;
      paintSlideControls();
    }
    // Tapping any star while the panel is open closes it first, so a tap on a
    // different star just moves you along rather than needing two actions.
    // The panel is opened from the info box itself, not from the star — see
    // the tooltip handler below.
    closeInfo();
    selectedStar = hit;
    render();
    // Up to four rows: name and magnitude together, then distance, then
    // spectral type. Each optional row appears only if that star carries the
    // field, so a card can be filled in a few stars at a time and the ones
    // without data just show what they have. Adding another field later —
    // mass, say — is one more block of this shape.
    tooltip.innerHTML = "";
    const row = (cls) => {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      tooltip.appendChild(d);
      return d;
    };

    const head = row('tt-head');
    head.appendChild(document.createTextNode(hit.name ? hit.name : "unnamed star"));
    const magSpan = document.createElement('span');
    magSpan.className = 'mag';
    magSpan.textContent = `mag ${hit.mag.toFixed(1)}`;
    head.appendChild(magSpan);

    if (hit.adjacentTo && revealLevel >= 2) {
      row('tt-sub').textContent = hit.adjacentTo;
    }
    if (typeof hit.dist === 'number') {
      row('tt-sub').textContent = formatDistance(hit.dist);
    }
    // The (i) only appears when there's actually something behind it. A star
    // with no distance or type has nothing to explain, so offering the control
    // and then opening an empty panel is worse than not offering it: the mark
    // has to mean "there is more here".
    const hasInfo = typeof hit.dist === 'number' || !!hit.type;
    tooltip.classList.toggle('tappable', hasInfo);
    if (hasInfo) {
      const iMark = document.createElement('div');
      iMark.className = 'tt-i';
      iMark.textContent = '\u24D8';
      tooltip.appendChild(iMark);
    }

    if (hit.type) {
      const simple = formatType(hit.type);
      if (simple) {
        const t = row('tt-type');
        t.textContent = simple;
        // Coloured by the star's own spectral colour, so the letter and the
        // hue reinforce each other. Uses a fixed strong blend rather than the
        // magnitude-gated one — this is a data readout, not the sky.
        t.style.color = `rgb(${colorForBV(hit.bv, 0.2)})`;
      }
    }
    // Preferred spot is up-and-right of the star, clear of the doubled
    // orange marker. But that's a fixed direction, and near a card edge it
    // can push the box half off-screen — so measure the actual box (now
    // that its content is set) and flip to whichever side/vertical has
    // room, then hard-clamp so it can never run past the card edge.
    const EDGE_PAD = 8;
    const OFFSET = 18;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    let left = hit._pos.x + OFFSET;
    if (left + tw > W - EDGE_PAD) left = hit._pos.x - OFFSET - tw;
    left = Math.max(EDGE_PAD, Math.min(left, W - tw - EDGE_PAD));
    let top = hit._pos.y - OFFSET - th;
    if (top < EDGE_PAD) top = hit._pos.y + OFFSET;
    top = Math.max(EDGE_PAD, Math.min(top, H - th - EDGE_PAD));
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.classList.add('show');
    // Second-pass safety net: check the tooltip's actual on-screen box
    // against the card's actual on-screen box next frame, and nudge if
    // anything still overhangs. The math above should already be correct,
    // but this catches it regardless of layout timing, font metrics, or
    // anything else that could make the first pass's numbers stale.
    requestAnimationFrame(() => {
      if (!tooltip.classList.contains('show')) return;
      const cardRect = card.getBoundingClientRect();
      const tRect = tooltip.getBoundingClientRect();
      let dx = 0, dy = 0;
      if (tRect.right > cardRect.right - EDGE_PAD) dx = (cardRect.right - EDGE_PAD) - tRect.right;
      if (tRect.left + dx < cardRect.left + EDGE_PAD) dx = (cardRect.left + EDGE_PAD) - tRect.left;
      if (tRect.bottom > cardRect.bottom - EDGE_PAD) dy = (cardRect.bottom - EDGE_PAD) - tRect.bottom;
      if (tRect.top + dy < cardRect.top + EDGE_PAD) dy = (cardRect.top + EDGE_PAD) - tRect.top;
      if (dx || dy) {
        tooltip.style.left = (parseFloat(tooltip.style.left) + dx) + 'px';
        tooltip.style.top = (parseFloat(tooltip.style.top) + dy) + 'px';
      }
    });
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(() => {
      tooltip.classList.remove('show');
      selectedStar = null;
      render();
    }, 2500);
  }

  // =========================================================================
  // NEAT intro — currently plays on EVERY launch. The play-count limit is
  // kept intact but switched off behind one flag (INTRO_LIMIT_PLAYS): set it
  // back to true to restore "first three launches only". The counter keeps
  // ticking either way, so turning the limit back on picks up where it was
  // rather than starting over.
  // Full-screen overlay, own canvas, own resize handling (different element
  // to the card canvas). Driven off elapsed time each animation frame, same
  // pattern as the slideshow/reveal-more tickers, so tap-to-skip only has
  // to flip one flag rather than cancel a chain of timeouts.
  // =========================================================================
  function runIntroIfDue() {
    const INTRO_KEY = 'neatIntroPlays';
    const MAX_PLAYS = 3;
    const INTRO_LIMIT_PLAYS = false;  // ← true restores the 3-launch limit

    function introPlaysSoFar() {
      try { return parseInt(window.localStorage.getItem(INTRO_KEY) || '0', 10) || 0; }
      catch (e) { return MAX_PLAYS; } // storage unavailable: don't loop it forever
    }
    function bumpIntroPlays() {
      try { window.localStorage.setItem(INTRO_KEY, String(introPlaysSoFar() + 1)); }
      catch (e) {}
    }

    if (INTRO_LIMIT_PLAYS && introPlaysSoFar() >= MAX_PLAYS) return;
    bumpIntroPlays();

    const overlay = document.getElementById('introOverlay');
    const iCanvas = document.getElementById('introCanvas');
    const ictx = iCanvas.getContext('2d');
    overlay.classList.add('show');

    let iW = 0, iH = 0, iDpr = 1;
    function introResize() {
      iDpr = window.devicePixelRatio || 1;
      iW = window.innerWidth;
      iH = window.innerHeight;
      iCanvas.width = iW * iDpr;
      iCanvas.height = iH * iDpr;
      ictx.setTransform(iDpr, 0, 0, iDpr, 0, 0);
      letters = buildLetters();
    }

    // ---- Letter geometry: points sit at the ENDS of each stroke within a
    // letter, not at the corners of a bounding box. Point counts are fixed
    // and confirmed: N 4, E 6, A 5, T 4 = 19 total. Letters are NOT
    // connected to each other, only within themselves. ----
    let letters = [];
    function buildLetters() {
      const top = iH * 0.13, bot = iH * 0.30, mid = (top + bot) / 2;
      const margin = iW * 0.08, gap = iW * 0.045;
      const lw = (iW - margin * 2 - gap * 3) / 4;
      let x = margin;
      const next = () => { const r = x; x += lw + gap; return r; };
      const out = [];

      { // N — 4 points, 3 strokes
        const x1 = next(), x2 = x1 + lw;
        const TL = { x: x1, y: top }, BL = { x: x1, y: bot };
        const TR = { x: x2, y: top }, BR = { x: x2, y: bot };
        out.push({ pts: [TL, BL, TR, BR], lines: [[TL, BL], [TL, BR], [TR, BR]] });
      }
      { // E — 6 points, 4 strokes
        const x1 = next(), x2 = x1 + lw;
        const TL = { x: x1, y: top }, BL = { x: x1, y: bot }, TR = { x: x2, y: top };
        const ML = { x: x1, y: mid }, MR = { x: x1 + lw * 0.72, y: mid };
        const BR = { x: x2, y: bot };
        out.push({ pts: [TL, BL, TR, ML, MR, BR], lines: [[TL, BL], [TL, TR], [ML, MR], [BL, BR]] });
      }
      { // A — 5 points, 3 strokes
        const x1 = next(), x2 = x1 + lw;
        const BL = { x: x1, y: bot }, BR = { x: x2, y: bot }, TC = { x: (x1 + x2) / 2, y: top };
        const t = 0.45;
        const CL = { x: BL.x + (TC.x - BL.x) * t, y: BL.y + (TC.y - BL.y) * t };
        const CR = { x: BR.x + (TC.x - BR.x) * t, y: BR.y + (TC.y - BR.y) * t };
        out.push({ pts: [BL, BR, TC, CL, CR], lines: [[BL, TC], [TC, BR], [CL, CR]] });
      }
      { // T — 4 points, 2 strokes
        const x1 = next(), x2 = x1 + lw;
        const TL = { x: x1, y: top }, TR = { x: x2, y: top };
        const TopMid = { x: (x1 + x2) / 2, y: top }, BotMid = { x: (x1 + x2) / 2, y: bot };
        out.push({ pts: [TL, TR, TopMid, BotMid], lines: [[TL, TR], [TopMid, BotMid]] });
      }
      return out;
    }

    // ---- Star field: real catalog stars (mag + bv), positioned randomly
    // across the full screen — not tied to any real sky region. The 19 NEAT
    // points are sampled from the brighter half of the catalog so they read
    // as "slightly brighter than the rest" without being an obvious giveaway.
    const rnd = seedRandom(Date.now() % 100000);
    // Widened from a narrow bright band so the 19 letter stars come out at
    // visibly DIFFERENT sizes rather than a uniform row of big dots. Still
    // brighter on average than the surrounding field, so they're findable
    // once they redden, but the variation is the point.
    const brightPool = SKY_CATALOG.filter(s => s.mag <= 4.2 && s.mag >= 0.5);
    const dimPool = SKY_CATALOG;
    function pick(pool) { return pool[Math.floor(rnd() * pool.length)]; }

    let backgroundStars = [];
    function seedBackground() {
      backgroundStars = [];
      const count = 110;
      for (let i = 0; i < count; i++) {
        const s = pick(dimPool);
        backgroundStars.push({
          x: rnd() * iW, y: rnd() * iH,
          mag: s.mag, bv: s.bv
        });
      }
    }
    introResize();
    seedBackground();
    window.addEventListener('resize', introResize);

    // Assign each NEAT geometry point a real bright-pool star (mag/bv) once
    // letters are built.
