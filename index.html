    // the projection's own comments), so grazing the guard band is a
    // visual-comfort miss, not a correctness one.
    // Per-card override: c.maxGuardStep (0 = no guard). Only Ursa Major sets it.
    const MAX_GUARD_STEP = (c.maxGuardStep !== undefined) ? c.maxGuardStep : 15;
    fieldCenterDec = Math.max(preGuardDec - MAX_GUARD_STEP, Math.min(preGuardDec + MAX_GUARD_STEP, targetDec));
  }

  function initField(c) {
    const rnd = seedRandom(Date.now() % 100000);

    // Pick the on-screen position. Each axis gets its own slack, so a figure
    // that's wide but flat (Pegasus, Andromeda) roams freely up and down
    // even though it has little room side to side.
    //
    // Fit constraint only now: the figure is largest at max zoom, so it must
    // still sit fully on the card there. (Pole safety at the wide end is no
    // longer decided here — applyPan() clamps it dynamically regardless of
    // which panScreenY gets picked.)
    const tight = fovForFraction(c, maxFractionFor(c));
    const { hw, hh } = effHalfExtents(c);
    // Was 0.04, tested up to 0.08 while chasing a card-edge overflow that
    // turned out to mostly be Pegasus's ceiling sitting too high under
    // gnomonic (fixed by lowering that card's own maxFraction — see its
    // definition). Bumped again, 0.06->0.10, during the pole-guard rework
    // below: removing initField's old pole-guard pre-bound on panScreenY
    // gave every card (not just high-dec ones) its full intended pan range
    // for the first time — the old bound had been silently restricting
    // low-dec cards too, an accidental side effect of comparing against the
    // pre-rework MAX_FOV_H=160. That extra placement freedom pushed the
    // offscreen rate from ~1.1% to ~4.5% of loads (100-load sweep, all 11
    // cards); 0.10 brings it back to ~1.9%. Overflow magnitude unchanged
    // either way (a single star a few pixels over the edge, same failure
    // mode as before) — this is frequency, not severity. Not fully
    // eliminated; judged acceptable at this rate, same standard as before.
    const EDGE = 0.10;

    // Half-extent of the figure at max zoom, as a fraction of half the card.
    const figHalfX = screenFractionFor(hw, tight.fovW);
    const figHalfY = screenFractionFor(hh, tight.fovH);
    const slackX = Math.max(0, 1 - figHalfX - EDGE);
    const slackY = Math.max(0, 1 - figHalfY - EDGE);

    // No pole-guard pre-filtering of panScreenY here anymore: applyPan()
    // now clamps fieldCenterDec directly, after the fact, whatever pan is
    // chosen — so every screen position stays valid at every field width
    // and there's no need to narrow the random range up front. (See
    // applyPan's pole-guard comment.)
    let loY = -slackY, hiY = slackY;

    panScreenX = (rnd() * 2 - 1) * slackX;
    panScreenY = loY + rnd() * (hiY - loY);
    applyPan(c);
    // The named target/neighbour stars are drawn from their own entries, so
    // drop any all-sky catalog row that refers to the same star.
    const namedStars = [...c.target, ...c.neighbors];
    const isNamed = (s) => namedStars.some(n => {
      const dRA = ((n.ra - s.ra) % 360 + 540) % 360 - 180;
      const scaled = dRA * Math.cos(((n.dec + s.dec) / 2) * Math.PI / 180);
      return Math.hypot(scaled, n.dec - s.dec) < 0.3;
    });

    // Figure stars belonging to the other cards in the deck. They are drawn
    // like any other background star until the second reveal, at which point
    // they light up so you can see which neighbouring patterns share the field.
    const adjacentStars = [];
    CONSTELLATIONS.forEach(other => {
      if (other.id === c.id) return;
      other.target.forEach(s => {
        if (isNamed(s)) return;
        adjacentStars.push({
          name: s.name, ra: s.ra, dec: s.dec, mag: s.mag, bv: s.bv,
          target: false, adjacentTo: other.name, jitter: makeJitter(rnd)
        });
      });
    });
    const isAdjacent = (s) => adjacentStars.some(n => {
      const dRA = ((n.ra - s.ra) % 360 + 540) % 360 - 180;
      const scaled = dRA * Math.cos(((n.dec + s.dec) / 2) * Math.PI / 180);
      return Math.hypot(scaled, n.dec - s.dec) < 0.3;
    });

    const backgroundStars = SKY_CATALOG.filter(s => !isNamed(s) && !isAdjacent(s)).map(s => ({
      name: null, ra: s.ra, dec: s.dec, mag: s.mag, bv: s.bv, target: false,
      jitter: makeJitter(rnd)
    }));
    c.target.forEach(s => s.jitter = makeJitter(rnd));
    c.neighbors.forEach(s => {
      s.jitter = makeJitter(rnd);
      // A card's own neighbour list is excluded from the cross-card adjacent
      // set above, so a star listed here that also belongs to another card's
      // figure would never be flagged — Vega on the Aquila card stayed plain
      // white at the second reveal instead of lighting up as part of Lyra.
      // Look it up by name and carry over both the flag and the star data, so
      // a neighbour shows the same distance and type it does on its own card
      // without the values being written out twice.
      if (!s.adjacentTo) {
        for (const other of CONSTELLATIONS) {
          if (other.id === c.id) continue;
          const match = other.target.find(t => t.name === s.name);
          if (match) {
            s.adjacentTo = other.name;
            if (s.dist === undefined && match.dist !== undefined) s.dist = match.dist;
            if (s.type === undefined && match.type !== undefined) s.type = match.type;
            break;
          }
        }
      }
    });

    allStars = [...c.target, ...c.neighbors, ...adjacentStars, ...backgroundStars];
  }

  const D2R = Math.PI / 180;

  // Exact conversions between an angular half-width (degrees, as
  // effHalfExtents returns) and the screen fraction it occupies at a given
  // field of view, under the TRUE tangent-plane relationship (via projP),
  // not the flat linear one (fovForFraction, initField's slack,
  // minAchievableFraction and baseFovHFor all used to do `2*hw/frac` /
  // `2*hw/fov` directly — correct under the old flat projection, where
  // screen-fraction WAS linear in angle, but not anymore). The gap between
  // the two grows with field width:
  // negligible for a narrow card, measurably wrong for a wide one — which
  // is exactly backwards from what you'd want, since the wide-field, high
  // declination cards are the ones this conversion was for. Symptom before
  // this was fixed: a star landing a few pixels past the card edge, only at
  // a card's own tightest zoom combined with a large rotation.
  function screenFractionFor(hwDeg, fovDeg) {
    return projP(hwDeg * D2R) / projP((fovDeg / 2) * D2R);
  }
  function fovForHalfWidth(hwDeg, frac) {
    return 2 * projPinv(projP(hwDeg * D2R) / frac) / D2R;
  }
  // A theory was tried here — deriving FOV_W from FOV_H via
  // 2*atan(aspect*tan(fovH/2)) instead of the simple FOV_H*aspect, reasoning
  // that the projection's nonlinearity should make pixel scale anisotropic
  // at wide fields and that fixing it would close the residual edge-overflow
  // cases. Measured result: WORSE (20/1650 loads vs 12/1320 before), and it
  // spread the problem to cards that had been clean. Reverted. Recorded so
  // it isn't tried again on the same reasoning — the reasoning was
  // plausible but the empirical result contradicts it, and empirical wins.
  // If revisited, treat it as a hypothesis to re-test carefully, not a
  // known-good fix. (This was measured under gnomonic; stereographic
  // derives FOV_W from FOV_H unconditionally now — see fovWFromH above —
  // so the theory doesn't apply the same way there regardless.)

  // =========================================================================
  // SKY-TO-PIXEL PROJECTION — replaces the old flat RA/Dec approximation.
  //
  // The old project() treated a degree of RA and a degree of Dec as flat,
  // perpendicular axes (after one cos(dec) correction for RA). That's the
  // first-order approximation of the true geometry and is fine near the
  // equator over a narrow field, but it doesn't straighten great circles —
  // which is exactly what breaks down near the pole. Real RA meridians
  // converge to a point at dec=90; the flat approximation instead keeps them
  // parallel forever, stretching and skewing any figure far from dec 0. This
  // was the reason Cassiopeia couldn't fully show Perseus even at its widest,
  // why the pole guard exists at all, and part of why the user's own
  // rotation report (Cygnus ~180 degrees off) was compounded by a projection
  // that couldn't represent the sky faithfully to begin with.
  //
  // A tangent-plane projection maps the sky onto a plane touching the
  // celestial sphere at one point — the current field centre — such that
  // every great circle through that point becomes a straight line. This
  // family is exact, not another approximation with a different failure
  // mode; it originally shipped as gnomonic (the same projection real
  // telescope images use) and was later switched to stereographic (see the
  // SKY PROJECTION notes above planeXY/projP), which keeps that exactness
  // while growing far more slowly off-axis. Everything below is written
  // against planeXY/projP/projPinv rather than any one formula, so it
  // doesn't need to change again if the projection ever does.
  //
  // SCOPE OF THE CHANGE, deliberately kept small: only the STAR-TO-PIXEL
  // formula changes. Where the telescope points (fieldCenterRA/Dec, chosen in
  // applyPan) still uses the old linear approximation to pick a pointing —
  // that choice only has to be close, since pan amounts are always within the
  // visible field, and the small-angle equivalence between the two formulas
  // keeps the error second-order. Nothing about applyPan(), the pole guard,
  // effHalfExtents(), or any of the fovForFraction/maxFovHFor/baseFovHFor
  // fitting math changes — they all operate on FIELD OF VIEW IN DEGREES,
  // which is a legitimate angular-size concept independent of which
  // projection renders it. Confirmed by inspection: visibleNeighbours() and
  // every hit-test read screen pixels via star._pos, which is projection's
  // OUTPUT — they needed no changes either, despite an earlier note in this
  // file's own handoff speculating they might.
  // =========================================================================
  // Pure sky-to-pixel formula, no rotation applied. Pulled out of project()
  // so applyPan() can reuse the EXACT same math to correct its pointing
  // choice (see below), rather than a second hand-derived approximation of
  // it that could quietly drift out of sync if project() ever changes.
  // Projection-agnostic via planeXY/projP — swapping the projection means
  // editing those, never this.
  function skyToPixel(raDeg, decDeg, ra0Deg, dec0Deg, fovWDeg, fovHDeg) {
    const { X, Y } = planeXY(raDeg, decDeg, ra0Deg, dec0Deg);
    const pHalfW = projP((fovWDeg / 2) * D2R);
    const pHalfH = projP((fovHDeg / 2) * D2R);
    return {
      x: W / 2 - (X / pHalfW) * (W / 2),
      y: H / 2 - (Y / pHalfH) * (H / 2)
    };
  }

  function project(star) {
    let { x, y } = skyToPixel(star.ra, star.dec, fieldCenterRA, fieldCenterDec, FOV_W, FOV_H);

    if (fieldRotation) {
      // Rotate about the figure's own anchor point, not the centre of the
      // card. Spinning about the card centre would swing an off-centre
      // constellation around in an arc — position and tilt have to stay
      // independent of each other, and it also keeps the fit calculation
      // (which uses the rotated bounding box about the centroid) honest.
      // Unchanged by the projection swap: this operates on screen pixels,
      // after the sky-to-plane math above is already done.
      const a = fieldRotation * Math.PI / 180;
      const cos = Math.cos(a), sin = Math.sin(a);
      const ox = x - anchorX, oy = y - anchorY;
      x = anchorX + ox * cos - oy * sin;
      y = anchorY + ox * sin + oy * cos;
    }
    return { x, y };
  }

  const colorAnchors = [
    // The cool end is deliberately exaggerated. Blue is genuinely close to
    // imperceptible to the naked eye — the eye's response falls off badly at
    // short wavelengths, so a hot star reads as white with a hint at most.
    // Rendered honestly it disappears, so these three anchors are pushed well
    // past the true values to make spectral class visible at a glance. The
    // warm anchors below are much closer to real.
    { bv: -0.3, r: 78, g: 132, b: 255 },
    { bv:  0.0, r: 128, g: 172, b: 255 },
    { bv:  0.3, r: 234, g: 241, b: 255 },
    { bv:  0.6, r: 255, g: 233, b: 202 },
    // Green is what reads as the yellow in an orange, so the warm anchors sit
    // a little lower in green than a strict colour-temperature conversion
    // would give, while blue is left alone. That swings the hue a few degrees
    // toward red without the saturation jump that dropping blue as well would
    // cause — the aim is a darker, redder orange, not a fire-engine red.
    { bv:  1.0, r: 255, g: 186, b: 140 },
    { bv:  1.3, r: 255, g: 155, b: 116 },
    // Steepened from here — K and M were landing too close in hue (Aldebaran,
    // K5, and Betelgeuse, M1-2, rendered as barely-distinguishable shades of
    // orange). G and B now drop faster past the K/M boundary (~bv 1.4) so
    // true red giants/supergiants pull visibly redder rather than just a
    // darker orange.
    { bv:  1.6, r: 250, g: 108, b:  78 },
    { bv:  1.9, r: 235, g:  72, b:  56 },
    { bv:  2.2, r: 214, g:  48, b:  40 }
  ];

  // A paler, warm-white-biased version of a star's colour, for the centre of
  // the pale-core glow (see WARM_CORE_BV_MIN below). Channels lighten at
  // different rates rather than a uniform mix toward white — green rises
  // slower than red and blue do. A uniform white-mix keeps green sitting
  // above blue as it pales (the same ratio the saturated colour started
  // with), and that G-above-B relationship is what reads as peach/orange
  // at low saturation regardless of the underlying hue — letting blue catch
  // up to (or past) green is what keeps a pale red reading as pink/red
  // rather than apricot. Tuned by eye against real star colours, not
  // derived from a formula, so re-tune by comparison if it's revisited.
  function paleCoreFor(rgbStr) {
    const [r, g, b] = rgbStr.split(',').map(Number);
    const pr = r + (255 - r) * 0.82;
    const pg = g + (255 - g) * 0.62;
    const pb = b + (255 - b) * 0.68;
    return `${Math.round(pr)},${Math.round(pg)},${Math.round(pb)}`;
  }
  function mixRGB(aStr, bStr, t) {
    const a = aStr.split(',').map(Number), b = bStr.split(',').map(Number);
    return `${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)}`;
  }
  // Orange/red stars only (K and M types) — where the anchors' warm range
  // starts. Blue/white stars were reported as already fine and are left on
  // the plain flat-colour glow (see the branch in the main render loop).
  const WARM_CORE_BV_MIN = 1.0;

  // ---- Warm-star look (K/M, bv >= WARM_CORE_BV_MIN), stage 18 ------------
  // Values chosen by eye in the standalone "Warm star tuner" page, which
  // reproduces this renderer. Model: the star's true-radius disk is WHITE
  // with the spectral colour laid over it (0 = pure white, 1 = full colour),
  // plus a separately controlled halo outside the disk.
  //
  // PREVIOUS (stage 17) look, kept intact behind USE_OLD_WARM_STYLE so it can
  // be switched back with one edit:
  //   wash    floor MIN_BLEND 0.30 (shared with blue/white stars), and the
  //           wash rose as the sky-limit slider dropped
  //   disk    paleCoreFor(rgb) centre -> mid (55% toward rgb) at 0.55r ->
  //           full rgb at the edge (tuner equivalent: centre ~0.30, edge 1.00)
  //   halo    glowR = r * 3.2 * 2/3 (~2.13r); pale/mid stops at coreA 0.55,
  //           outer stop 0.45 * haloA 0.1 (tuner equivalent: near ~0.24,
  //           outer ~0.04, reach 2.13, whiteness 0)
  //
  // Stage 18 values (first tuner pass), superseded by stage 19 below:
  //   WARM_MIN_BLEND 0.41, DISK_TINT_CENTRE 0.49, DISK_TINT_EDGE 0.92,
  //   no DISK_TINT_CURVE (straight line), HALO_NEAR_ALPHA 0.67,
  //   HALO_OUTER_ALPHA 0.40, HALO_REACH 2.50, HALO_WHITENESS 0.00
  const USE_OLD_WARM_STYLE = false;
  const WARM_MIN_BLEND     = 0.32;  // minimum white wash, warm stars only
  const WASH_FOLLOWS_LIMIT = false; // false: warm colour doesn't whiten as the sky limit drops
  const DISK_TINT_CENTRE   = 0.49;  // colour over the white disk at the exact centre
  const DISK_TINT_CURVE    = 0.30;  // ramp shape centre->rim: 1 straight, <1 colours up sooner, >1 stays whiter longer
  const DISK_TINT_EDGE     = 0.95;  // colour over the white disk at the exact rim
  const HALO_NEAR_ALPHA    = 0.47;  // halo opacity from centre out to the disk edge
  const HALO_OUTER_ALPHA   = 0.26;  // halo opacity partway out
  const HALO_REACH         = 2.35;  // halo radius as a multiple of the star radius
  const HALO_WHITENESS     = 0.09;  // halo colour mixed toward white

  // How much a star's colour washes toward white. Colour vision is cone-driven
  // and cones barely fire at low light, so a faint star genuinely looks
  // colourless to the naked eye — you only read Betelgeuse as orange because
  // it's bright. The old code applied a flat 0.6 wash to every star, which
  // modelled that effect for the faint ones and wrongly bleached the bright
  // ones along with them.
  //
  // Now it keys off the same measure as the brightness fade: distance above
  // the current magnitude limit. Well clear of the threshold, a star shows
  // close to its true colour; near the threshold it goes white. That gives a
  // colour cutoff without a hard edge, and it re-grades with the slider, so a
  // bright-sky setting leaves only a few standouts showing any colour.
  //
  // MIN_BLEND never reaches zero: real star colour is subtle, and fully raw
  // values look like a cartoon planetarium rather than a sky.
  const MIN_BLEND = 0.30;  // wash at full brightness — colour at its strongest
  const MAX_BLEND = 0.85;  // wash at the visibility threshold — effectively white
  const COLOR_SPAN = 3.0;  // magnitudes above the limit to reach full colour
  // A second, absolute gate on top of the relative one. Colour needs the
  // cones firing, and a magnitude 4 star doesn't manage that under any sky —
  // so faint stars should read white however dark the night is. Without this
  // the deepened anchors give every little background dot a distinct hue,
  // which looks artificial and teaches nothing: the colour of a star is only
  // a useful cue on the ones bright enough to actually show it.
  //
  // Ramped over a magnitude rather than switched at a threshold, so there's
  // no seam between a 2.9 and a 3.1 sitting side by side.
  // Colour needs the cones firing, and a magnitude 3 star doesn't manage that
  // under any sky — so faint stars read white however dark the night is.
  // Without this the deepened anchors give every little background dot a
  // distinct hue, which looks artificial and, worse, gives the puzzle away:
  // blatant colour marks out the bright stars before you've found the figure,
  // which is the opposite of what the deck is for. Ramped over a magnitude
  // rather than switched at a threshold, so there's no seam between a 2.4 and
  // a 2.6 sitting side by side.
  const COLOR_MAG_FULL = 1.5;  // brighter than this: colour unrestricted
  const COLOR_MAG_NONE = 2.5;  // fainter than this: white regardless
  function blendForMag(mag) {
    const above = (limitMag - mag) + VISIBILITY_BONUS;
    const t = Math.min(1, Math.max(0, above / COLOR_SPAN));
    const relative = MAX_BLEND - (MAX_BLEND - MIN_BLEND) * t;
    const a = Math.min(1, Math.max(0,
      (mag - COLOR_MAG_FULL) / (COLOR_MAG_NONE - COLOR_MAG_FULL)));
    const absolute = MIN_BLEND + (1 - MIN_BLEND) * a;
    // Whichever washes it out more wins.
    return Math.max(relative, absolute);
  }

  // Warm-star wash (stage 18): same two gates as blendForMag, except the
  // relative gate can be pinned to a dark sky (WASH_FOLLOWS_LIMIT false) so
  // the colour/white balance stays put as the slider moves, and a separate
  // floor applies to warm stars only, leaving blue/white stars unaffected.
  function warmBlendForMag(mag) {
    const lim = WASH_FOLLOWS_LIMIT ? limitMag : 5.0;
    const above = (lim - mag) + VISIBILITY_BONUS;
    const t = Math.min(1, Math.max(0, above / COLOR_SPAN));
    const relative = MAX_BLEND - (MAX_BLEND - MIN_BLEND) * t;
    const a = Math.min(1, Math.max(0,
      (mag - COLOR_MAG_FULL) / (COLOR_MAG_NONE - COLOR_MAG_FULL)));
    const absolute = MIN_BLEND + (1 - MIN_BLEND) * a;
    return Math.max(relative, absolute, WARM_MIN_BLEND);
  }

  function colorForBV(bv, blendOverride) {
    const clamped = Math.max(colorAnchors[0].bv, Math.min(colorAnchors[colorAnchors.length - 1].bv, bv));
    let lo = colorAnchors[0], hi = colorAnchors[colorAnchors.length - 1];
    for (let i = 0; i < colorAnchors.length - 1; i++) {
      if (clamped >= colorAnchors[i].bv && clamped <= colorAnchors[i + 1].bv) {
        lo = colorAnchors[i]; hi = colorAnchors[i + 1]; break;
      }
    }
    const span = hi.bv - lo.bv || 1;
    const t = (clamped - lo.bv) / span;
    let r = lo.r + (hi.r - lo.r) * t;
    let g = lo.g + (hi.g - lo.g) * t;
    let b = lo.b + (hi.b - lo.b) * t;
    const blend = blendOverride === undefined ? 0.6 : blendOverride;
    r = r * (1 - blend) + 255 * blend;
    g = g * (1 - blend) + 255 * blend;
    b = b * (1 - blend) + 255 * blend;

    // Perceived brightness is carried almost entirely by green (72%) and
    // barely at all by blue (7%), so a saturated blue is genuinely dimmer
    // than a white of the same magnitude — two stars that should look equally
    // bright don't. Full equalisation is impossible: forcing blue up to
    // white's luminance just turns it white again, since saturation and
    // luminance trade directly against each other.
    //
    // So recover part of the deficit. Gain the channels up toward the
    // luminance a neutral star would have; whatever clips at 255 desaturates
    // slightly, which is the cost of the correction. LUMA_COMP is the dial:
    // 0 leaves it alone, 1 chases full equality and washes the colour out.
    // Only cool stars get this. A warm star's red channel is already at 255,
    // so gaining it up just pushes green higher and bleaches the red away —
    // which is the opposite of what's wanted, and warm stars never had the
    // dimness problem in the first place. The correction fades out across the
    // white middle of the ramp so there's no visible seam.
    const LUMA_COMP = 0.55;
    const coolness = Math.min(1, Math.max(0, (0.35 - clamped) / 0.5));
    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const neutral = 255;
    if (coolness > 0 && luma > 0) {
      const gain = 1 + LUMA_COMP * coolness * (neutral / luma - 1);
      r = Math.min(255, r * gain);
      g = Math.min(255, g * gain);
      b = Math.min(255, b * gain);
    }
    return `${Math.round(r)},${Math.round(g)},${Math.round(b)}`;
  }

  const BRIGHT_MAG_THRESHOLD = 1.7;
  const BASE_AT_THRESHOLD = 2.6 - BRIGHT_MAG_THRESHOLD * 0.42;
  const COMPRESSION = 0.13;
  const FLOOR = 0.4;
  const SCALE_ABOVE_FLOOR = 0.7;

  // Under a poor sky you don't simply lose the faint stars — the ones that
  // survive also look smaller and less brilliant. So the whole size curve is
  // scaled down as the limiting magnitude drops, instead of only removing
  // stars from the field. At the best setting (mag 5.0) nothing shrinks.
  const SEEING_REF_MAG = 4.5;   // magnitude at which stars render full size
  const SEEING_MIN_SCALE = 0.58; // size multiplier at the worst setting

  function seeingScale() {
    const lo = parseFloat(magSlider.min);
    const span = SEEING_REF_MAG - lo;
    if (!(span > 0)) return 1;
    const t = Math.min(1, Math.max(0, (limitMag - lo) / span));
    return SEEING_MIN_SCALE + (1 - SEEING_MIN_SCALE) * t;
  }

  function radiusForMag(mag) {
    let r;
    if (mag >= BRIGHT_MAG_THRESHOLD) {
      r = Math.max(FLOOR, 2.6 - mag * 0.42);
    } else {
      const extra = (BRIGHT_MAG_THRESHOLD - mag) * 0.42;
      r = BASE_AT_THRESHOLD + Math.sqrt(extra) * COMPRESSION;
    }
    r = FLOOR + (r - FLOOR) * SCALE_ABOVE_FLOOR;
    return Math.max(0.35, r * seeingScale());
  }

  // Size alone can't carry the magnitude range at the faint end. The radius
  // curve has to bottom out near a pixel or dim stars vanish, which squeezes
  // everything from about mag 3 down into a narrow band — a 2.2 and a 3.6
  // end up 1.29px and 0.88px, barely telling apart, when the eye sees a
  // roughly fourfold brightness difference.
  //
  // So brightness gets its own channel. Bright stars stay fully opaque and
  // carry their range through size, glow and spikes; below FADE_FROM the
  // core fades toward FAINT_ALPHA, which is where the extra contrast is
  // needed and where a sub-pixel dot can still show it. Dimming the big
  // stars would just make them look grey, so the curve deliberately does
  // nothing up there.
  // What matters is how far a star sits ABOVE the current limit, not its
  // absolute magnitude. The faintest star you can see is always the one at
  // the threshold of perception, whatever the conditions — on a hazy night a
  // magnitude 2 star is the barely-there dot that a magnitude 4 star would be
  // under a dark sky. Keying the fade to absolute magnitude got this exactly
  // backwards: at an urban limit of 2.2 the faintest visible star rendered
  // fully opaque.
  //
  // So the curve runs on (limitMag - mag). Zero means right at the threshold
  // and barely visible; FULL_BRIGHT_SPAN magnitudes clear of it means as
  // bright as the display goes. Move the limit and every star re-grades
  // itself, which is what the eye actually does.
  // The whole scale sat about half a magnitude too dark: the 1.5 setting
  // looked like 1.0 and the 5.0 setting like 4.5. VISIBILITY_BONUS shifts the
  // grading by that half magnitude, so a star right at the limit still reads
  // as present rather than as almost nothing, and everything above it moves
  // up with it.
  const FULL_BRIGHT_SPAN = 3.0;
  const FAINT_ALPHA = 0.3;
  const VISIBILITY_BONUS = 0.5;
  function alphaForMag(mag) {
    const above = (limitMag - mag) + VISIBILITY_BONUS;
    const t = Math.min(1, Math.max(0, above / FULL_BRIGHT_SPAN));
    return FAINT_ALPHA + (1 - FAINT_ALPHA) * t;
  }

  const SPIKE_THRESHOLD = 1.8;

  // ---- Star size vs field of view (stage 23) ------------------------------
  // Stars are drawn at a fixed pixel size at every zoom, so zooming out
  // shrinks the gaps between stars but not the stars — past medium zoom the
  // field went dense and blobby. Tuned by eye in the wide-field tuner
  // against the real Scorpius/Sagittarius field: full size up to 66 deg,
  // then a late, steep drop (curve 3.6) to 0.60x at 98 deg. Applies to every
  // star in the main sky: background, figure stars at any reveal stage
  // (red), neighbour-lit stars (magenta) and the selection. Beyond 98 deg
  // (cards without a per-card cap) the multiplier holds at 0.60. Glow is
  // derived from r, so it shrinks with the star; the tuner's separate glow
  // controls made no visible difference and were left at 1.
  const STAR_SHRINK_START_FOV = 66;
  const STAR_SIZE_AT_MAX_FOV  = 0.60;
  const STAR_SHRINK_CURVE     = 3.6;
  const STAR_SHRINK_END_FOV   = 98;
  const STAR_MIN_RADIUS_PX    = 0.35;
  function fovSizeMult() {
    if (FOV_H <= STAR_SHRINK_START_FOV) return 1;
    const t = Math.min(1, (FOV_H - STAR_SHRINK_START_FOV) / (STAR_SHRINK_END_FOV - STAR_SHRINK_START_FOV));
    return 1 - (1 - STAR_SIZE_AT_MAX_FOV) * Math.pow(t, STAR_SHRINK_CURVE);
  }
  const EDGE_THRESHOLD = 0.85;

  function starScreenPositions() {
    return allStars
      .filter(s => s.mag <= limitMag)
      .map(s => ({ star: s, pos: project(s) }));
  }

  // Labels drawn only during the slideshow: star names at the 'starnames'
  // step, surrounding constellation names once the view has pulled back. The
  // ordinary card never labels anything — the whole point there is that
  // nothing is named until you ask for it.
  function slideLabelBox(text, x, y, size) {
    ctx.font = `${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    return { w: ctx.measureText(text).width, h: size * 1.2, x, y };
  }
  function slideLabelsOverlap(a, b) {
    return Math.abs(a.x - b.x) * 2 < (a.w + b.w) + 10 &&
           Math.abs(a.y - b.y) * 2 < (a.h + b.h) + 8;
  }

  // The constellation name, set inside the card rather than in the strip
  // above it. Watching the slideshow your eye is down among the stars and the
  // strip goes unread. Placed in the quadrant diagonally opposite the figure's
  // centre — the same trick the info panel uses — so it stays off the stars
  // without needing real collision work. It clears before the view pulls back,
  // or it would sit on top of the neighbours it's making room for.
  function drawSlideTitle(drawn) {
    const step = slideStepId();
    if (step !== 'name' && step !== 'lines' && step !== 'starnames') return;
    drawCardTitle(drawn);
  }

  // The constellation name set against the figure itself. The strip above the
  // card carries it too, but with your eyes down among the stars that goes
  // unread — so on the first reveal it also flashes here, where you're
  // already looking.
  function drawCardTitle(drawn) {
    const size = Math.max(19, Math.min(30, W * 0.075));
    const pad = 14;
    // The Chinese name hangs below the English one, so any bottom placement
    // has to leave room for it or the second line falls off the card.
    const second = active.chineseName ? size * 0.78 : 0;

    // Sit against the figure, not against the card edge. Parked in a corner
    // the name reads as page furniture and the eye — busy among the stars —
    // never travels to it. Tucked just above the figure it's part of what
    // you're already looking at. Below instead when there's no room above.
    const pts = drawn.filter(d => d.star.target && d.pos).map(d => d.pos);
    let x = W / 2, y = size + pad;
    if (pts.length) {
      const minX = Math.min(...pts.map(p => p.x)), maxX = Math.max(...pts.map(p => p.x));
      const minY = Math.min(...pts.map(p => p.y)), maxY = Math.max(...pts.map(p => p.y));
      x = (minX + maxX) / 2;
      // The English baseline has to clear the figure by the height of the
      // Chinese line hanging under it, or the second line lands on the stars.
      const above = minY - 16 - second;
      const below = maxY + 30 + size;
      y = (above - size >= pad) ? above : below;
      y = Math.max(size + pad, Math.min(y, H - pad - second));
      const halfW = 72;
      x = Math.max(halfW, Math.min(x, W - halfW));
    }
    ctx.save();
    ctx.font = `500 ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(${revealColor},0.95)`;
    ctx.fillText(active.name, x, y);
    if (active.chineseName) {
      ctx.font = `${size * 0.55}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.fillStyle = `rgba(${revealColor},0.75)`;
      ctx.fillText(active.chineseName, x, y + size * 0.78);
    }
    ctx.restore();
  }

  // The same two kinds of label as the slideshow, but driven by the reveal
  // sequence: exactly one star name at a time, replaced rather than added to,
  // then one constellation name at a time.
  function drawMoreLabels(drawn, seedPlaced) {
    const starName = moreStarFocus();
    const nb = moreNeighbourFocus();
    if (starName) {
      const e = drawn.find(d => d.star.name === starName);
      if (!e) return;
      const p = e.pos;
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return;
      // displayName lets a labeled star flash under a different name than
      // its own catalog entry — theta Piscium anchors this as "Pisces"
      // rather than naming itself, since the point is the Circlet as a
      // whole, not that one star specifically.
      drawOneLabel(e.star.displayName || starName, p.x, p.y, 13, colorForBV(e.star.bv, 0.25));
      return;
    }
    if (nb) {
      const pts = [];
      drawn.forEach(({ star, pos }) => {
        if (star.adjacentTo !== nb) return;
        if (pos.x < 0 || pos.x > W || pos.y < 0 || pos.y > H) return;
        pts.push(pos);
      });
      if (!pts.length) return;
      placeLabel(nb, clusterCandidates(pts, 14), 14, adjacentColor, seedPlaced ? seedPlaced.slice() : []);
    }
  }

  function hideMoreBoxes() {
    moreInfoBox.classList.remove('show');
  }

  // The "reveal more" popup box for the star currently being named: its
  // info (distance/type/mass, same fields as the tap-to-open panel) and,
  // when it has one, its notable-feature blurb — one combined box rather
  // than two side by side (they were always shown together anyway, so
  // splitting them added a seam with nothing on the other side of it).
  // Only shown during the 'boxes' sub-beat of the 'stars' phase — see
  // starSubPhase(). Positioned with plain CSS top/bottom rather than
  // measured offsets: whichever half (top vs bottom) the star ISN'T in
  // gets the box, so it never sits on top of the star it's about. Spans
  // most of the card's width now that it isn't sharing the row with a
  // second box — a full-sentence notable blurb reads better at this width
  // than squeezed into the old 44%.
  function updateMoreBoxes(drawn) {
    // Two independent sources can put a star "on" for the box: reveal-more's
    // own moreSeq (flash-deck mode), or the slideshow's starnames step
    // (slideStarBoxFocus) — same box, same styling, either way.
    let starName = null;
    if (slideshow) {
      const s = slideStarBoxFocus();
      if (s) starName = s.name;
    } else {
      // Hidden while reveal-more is tap-paused, so it doesn't stack with the
      // tapped star's own info; comes back on "continue" (next render).
      if (starSubPhase() === 'boxes' && !(moreSeq && moreSeq.userPaused)) starName = moreStarFocus();
    }
    if (!starName) { hideMoreBoxes(); return; }
    const entry = drawn.find(d => d.star.name === starName);
    if (!entry) { hideMoreBoxes(); return; }
    const star = entry.star, pos = entry.pos;

    const massVal = star.mass !== undefined ? star.mass
                  : (star.type ? massFor(parseType(star.type)) : null);
    let html = `<div class="mb-name">${star.displayName || star.name}</div>`;
    if (typeof star.dist === 'number') html += `<div class="mb-line">${formatDistance(star.dist)}</div>`;
    if (star.kind) html += `<div class="mb-line">${star.kind}</div>`;
    if (star.type) {
      const simple = formatType(star.type);
      // Coloured by spectral class, same treatment as the tap-to-open
      // panel's .ip-code — was plain dim text here, which read as a
      // different, lesser box even though it's the same data.
      if (simple) html += `<div class="mb-line" style="color: rgb(${colorForBV(star.bv, 0.2)})">${simple}</div>`;
    }
    if (massVal) html += `<div class="mb-mass">${massVal} M\u2609</div>`;
    if (star.notable) {
      html += `<div class="mb-notable-name">Notable</div><div class="mb-notable-text">${star.notable}</div>`;
    }
    moreInfoBox.innerHTML = html;

    const pad = 10;
    const topRow = pos.y > H / 2;   // star's in the bottom half -> box goes up top
    moreInfoBox.style.left = pad + 'px';
    moreInfoBox.style.right = pad + 'px';
    moreInfoBox.style.top = topRow ? pad + 'px' : '';
    moreInfoBox.style.bottom = topRow ? '' : pad + 'px';
    moreInfoBox.classList.add('show');
  }

  // Single label, kept on the card — above the point, flipped below when
  // that would run off the top.
  function drawOneLabel(text, x, y, size, rgb) {
    const edge = 6;
    ctx.save();
    ctx.font = `${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    const w = ctx.measureText(text).width;
    let ty = y - 16;
    if (ty - size < edge) ty = y + 22 + size;
    ty = Math.max(size + edge, Math.min(ty, H - edge));
    const tx = Math.max(w / 2 + edge, Math.min(x, W - w / 2 - edge));
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(${rgb},0.95)`;
    ctx.fillText(text, tx, ty);
    ctx.restore();
  }

  // =========================================================================
  // WIDE-FIELD "ASTERISM" FRAMING — wideCenter / wideLabels / tilt check
  //
  // Why this exists: some of the best-known sights in the sky aren't one
  // constellation but a shape made of the brightest stars of SEVERAL — the
  // Summer Triangle (Vega in Lyra, Deneb in Cygnus, Altair in Aquila) is the
  // first one built. The normal engine can't show those: every card zooms
  // in and out around its OWN figure, at a random tilt and a random
  // off-centre placement, so at the widest step one or two corners of the
  // cross-constellation shape routinely fell off the narrow edge of a
  // portrait phone. Two per-card fields fix that, both opt-in (a card
  // without them behaves exactly as before):
  //
  //   wideCenter    {ra, dec} of the asterism's centroid. As the field widens
  //                 the view pans toward it (applyPan/wideBlend): the point
  //                 held on screen slides from the figure's centroid to
  //                 wideCenter, and the random placement fades to dead
  //                 centre, so the whole asterism ends up framed together.
  //   wideLabels    star names shown only once the field has gone wide
  //                 (slideshow 'neighbours' step / reveal-more 'neighbours'
  //                 phase) — never in the close-up star-name pass — and
  //                 then KEPT UP until the card is left or reset
  //                 (wideLabelsShown). Include the card's own corner star
  //                 too, so all corners read together.
  //
  // Tilt: these cards keep the deck's full normal tilt range. Instead of
  // narrowing it (the first attempt, rotationScale 0.15 — worked, but
  // killed nearly all rotation), loadCard now test-renders the widest,
  // Triangle-centred frame for the tilt it just picked (wideCornersFit)
  // and redraws the tilt if any corner lands within the edge margin — up
  // to WIDE_FIT_TRIES times, then falls back to the culmination angle. The
  // check runs on the real screen size, so a wider screen allows more tilt.
  //
  // Slider floor: asterism cards skip the usual 0.15 minimum fraction
  // (sliderFloorFor) so a tiny figure can still widen to maxFovH.
  //
  // Built: Summer Triangle (Aquila, Lyra, Cygnus) and Winter Triangle
  // (Canis Major, Canis Minor — Orion deliberately left without it).
  //
  // To add another (Great Square, etc.): put the same wideCenter and
  // wideLabels on each participating card and raise maxFovH until every
  // corner clears the edge at a reasonable share of tilts (if nearly every
  // tilt gets rejected, the field is too narrow — the fallback culmination
  // tilt will show up almost every time). No engine changes needed. Constellation-name labels placed after
  // these avoid them (see placeLabel), so a neighbour's name can't land on
  // top of a corner star's name.
  // =========================================================================
  let wideLabelsShown = false;

  // Draws text at the first candidate position (x = centre, y = baseline)
  // that fits on the card and doesn't overlap anything already in `placed`;
  // falls back to the first candidate clamped on-card if none fit. Returns
  // the box it used, already pushed onto `placed`.
  function placeLabel(text, candidates, size, rgb, placed) {
    const edge = 6;
    const fit = b => {
      b.y = Math.max(size + edge, Math.min(b.y, H - edge));
      b.x = Math.max(b.w / 2 + edge, Math.min(b.x, W - b.w / 2 - edge));
      return b;
    };
    let chosen = null;
    for (const [x, y] of candidates) {
      const raw = slideLabelBox(text, x, y, size);
      const inside = (raw.y - size) >= edge && raw.y <= H - edge;
      const b = fit(raw);
      if (inside && !placed.some(p => slideLabelsOverlap(b, p))) { chosen = b; break; }
    }
    if (!chosen) chosen = fit(slideLabelBox(text, candidates[0][0], candidates[0][1], size));
    placed.push(chosen);
    ctx.save();
    ctx.font = `${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = `rgba(${rgb},0.95)`;
    ctx.fillText(text, chosen.x, chosen.y);
    ctx.restore();
    return chosen;
  }

  // Candidate spots for a constellation name over a cluster of its on-screen
  // stars: above the top one, below the bottom one, then further above, then
  // to either side — so it can step around a corner star's name.
  function clusterCandidates(pts, size) {
    const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const top = Math.min(...pts.map(p => p.y));
    const bot = Math.max(...pts.map(p => p.y));
    return [
      [cx, top - 15], [cx, bot + 20 + size], [cx, top - 15 - size * 2],
      [cx - 90, top - 15], [cx + 90, top - 15], [cx, bot + 20 + size * 3]
    ];
  }

  // Draws the wideLabels names (plus a small keep-out box on each corner
  // star's dot) and returns those boxes, so later labels steer clear.
  function drawWideLabels(drawn) {
    const placed = [];
    const pts = wideLabelPoints(drawn);
    pts.forEach(({ pos }) => placed.push({ x: pos.x, y: pos.y, w: 18, h: 18 }));
    pts.forEach(({ star, pos }) => {
      placeLabel(star.displayName || star.name,
        [[pos.x, pos.y - 15], [pos.x, pos.y + 20 + 12.5], [pos.x - 50, pos.y - 15], [pos.x + 50, pos.y - 15]],
        12.5, colorForBV(star.bv, 0.25), placed);
    });
    return placed;
  }

  // Screen positions of the active card's wideLabels stars. Off-screen
  // ones are dropped.
  function wideLabelPoints(drawn) {
    const names = active.wideLabels || [];
    const out = [];
    names.forEach(n => {
      const e = drawn.find(d => d.star.name === n);
      if (!e) return;
      const p = e.pos;
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return;
      out.push({ star: e.star, pos: p });
    });
    return out;
  }
  // True once every wideLabels star is in frame (or the card has none) —
  // used to keep reveal-more's widen phase pulling back until they are.
  // For wideCenter cards this now always answers false until the slider
  // hits its wide end, so reveal-more's widen runs all the way out: stopping
  // the moment the last corner crept on screen left it sitting right on the
  // edge (Altair on Cygnus, Deneb on Aquila) with slider room unused. The
  // widest frame is the one the load-time tilt check (wideCornersFit)
  // verified, so going all the way there is the framing that's known good.
  // True once every target star of the figure is on screen (stage 27).
  // Normally always true — the framing keeps the whole figure in view — but
  // a card with fitStars (Draco) lets part of the figure run off the edge
  // at narrow zoom, and reveal-more's widen used to stop as soon as enough
  // neighbours were in frame, leaving Draco's tail off screen with slider
  // room unused. Reveal-more now keeps pulling back until the whole figure
  // is in, or the slider runs out. Only cards with fitStars are checked.
  function figureInFrame() {
    if (!active.fitStars) return true;
    // Fresh projection, not s._pos: render() skips off-screen stars before
    // setting _pos, so a star's _pos can be stale from an earlier frame.
    return active.target.every(s => {
      if (s.mag > limitMag) return true;
      const p = project(s);
      return p && p.x >= 0 && p.x <= W && p.y >= 0 && p.y <= H;
    });
  }

  function wideLabelsInFrame() {
    const names = active.wideLabels || [];
    if (!names.length) return true;
    if (active.wideCenter) return currentFraction <= parseFloat(fovSlider.min) + 1e-9;
    return wideLabelPoints(starScreenPositions()).length === names.length;
  }

  function drawSlideLabels(drawn, seedPlaced) {
    const step = slideStepId();
    if (step !== 'starnames' && step !== 'neighbours') return;
    const placed = seedPlaced ? seedPlaced.slice() : [];

    const put = (text, x, y, size, rgb) => {
      // Above by default, flipped below when something's already sitting
      // there — or when above would put it off the top of the card, which is
      // what was silently dropping the names of constellations sitting high
      // in the frame. Keep it inside horizontally too.
      const edge = 6;
      let box = slideLabelBox(text, x, y - 15, size);
      const tooHigh = (box.y - size) < edge;
      if (tooHigh || placed.some(p => slideLabelsOverlap(box, p))) {
        box = slideLabelBox(text, x, y + 20 + size, size);
      }
      box.y = Math.max(size + edge, Math.min(box.y, H - edge));
      box.x = Math.max(box.w / 2 + edge, Math.min(box.x, W - box.w / 2 - edge));
      placed.push(box);
      ctx.save();
      ctx.font = `${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = `rgba(${rgb},0.95)`;
      ctx.fillText(text, box.x, box.y);
      ctx.restore();
    };

    if (step === 'starnames' && active.labels) {
      const at = {};
      drawn.forEach(({ star, pos }) => { if (star.name) at[star.name] = pos; });
      // Brightest first, one at a time — only the star whose turn it
      // currently is gets its name shown, same as reveal-more's replace-
      // rather-than-accumulate behaviour (previously every earlier name
      // stayed up as the next arrived, which crowded the card once several
      // were on screen at once). Timing comes from slideStarSchedule, so a
      // notable star's longer slot (for its boxes, see updateMoreBoxes)
      // holds its name up for just as long as its boxes are up, no longer.
      const schedule = slideStarSchedule(active);
      const entry = schedule.find(e => slideElapsed >= e.start && slideElapsed < e.end);
      if (entry) {
        const pos = at[entry.name];
        if (pos && pos.x >= 0 && pos.x <= W && pos.y >= 0 && pos.y <= H) {
          // Coloured by spectral class, same as the type line in the info
          // panel, so the name and the star's colour reinforce each other.
          put(entry.star.displayName || entry.name, pos.x, pos.y, 12.5, colorForBV(entry.star.bv, 0.25));
        }
      }
    }

    if (step === 'neighbours') {
      // One label per surrounding constellation, centred over whichever of its
      // stars are actually on screen and sitting above the highest of them.
      const focus = slideNeighbourFocus();
      if (!focus) return;
      const pts = [];
      drawn.forEach(({ star, pos }) => {
        if (star.adjacentTo !== focus) return;
        if (pos.x < 0 || pos.x > W || pos.y < 0 || pos.y > H) return;
        pts.push(pos);
      });
      if (!pts.length) return;
      // placeLabel rather than put: steps around wide-label corner names
      // (seeded into `placed`) instead of landing on top of them.
      placeLabel(focus, clusterCandidates(pts, 13.5), 13.5, adjacentColor, placed);
    }
  }

  // Nebula glow (9-25 ver3, Orion Nebula). Sized in sky degrees so it keeps
  // its apparent size as you zoom, with pixel floors so it never shrinks to
  // nothing at the wide end. A bright compact core fading out through a wide
  // faint halo; grey-green, the colour the eye actually sees (photographs'
  // red is invisible to night vision). Brightness follows alphaForMag like
  // a star of the same magnitude, softened because the light is spread out.
  const NEBULA_RGB = '205,228,212';
  // 9-25 ver4: diameter cut 25% (user: "supposed to be hard to see").
  // Was core 0.12 / halo 0.5 deg, floors 2.2 / 7 px.
  // 9-25 ver5: a further 20% smaller (was 0.09 / 0.375, floors 1.65 / 5.25).
  const NEBULA_CORE_DEG = 0.072;
  const NEBULA_HALO_DEG = 0.3;
  function drawNebula(star, pos, selected) {
    const ppd = H / FOV_H;
    const core = Math.max(1.32, NEBULA_CORE_DEG * ppd);
    const halo = Math.max(4.2, NEBULA_HALO_DEG * ppd, core * 2.5);
    const rgb = selected ? selectedColor : NEBULA_RGB;
    const a = Math.min(1, alphaForMag(star.mag) * 0.75);
    const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, halo);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(core / halo, `rgba(${rgb},${a * 0.55})`);
    g.addColorStop(Math.min(0.95, (core / halo) * 2.2), `rgba(${rgb},${a * 0.18})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, halo, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    if (!active) return;
    ctx.clearRect(0, 0, W, H);
    const drawn = starScreenPositions();

    // Figure lines come in with the second reveal, drawn before the stars so
    // the dots sit on top of them. This is what actually separates the figure
    // from its neighbours — a drawn shape reads instantly in a way a colour
    // or size difference never quite managed in a crowded field.
    //
    // Slideshow: was slideStepId()==='lines' only — lines appeared a full
    // step AFTER the name (per SLIDE_STEPS: find→name→lines→starnames), and
    // then vanished again the instant starnames began ("lines out" per that
    // step's own old comment). Now lines come up together with the name and
    // stay up through the rest of the card's sequence — the SLIDE_STEPS
    // list/timing itself is unchanged, only when lines are allowed to show
    // shifted earlier and stopped turning off. Slideshow only; unchanged.
    //
    // Reveal-more (moreSeq): used to hide lines through 'lead' and 'stars'
    // too, so they only appeared once every star had already been named —
    // backwards from the point of a diagram. Now lines are up from the
    // moment reveal-more is pressed (moreSeq starts at 'lead'), same as
    // every later phase.
    const showLines = slideshow ? (slideStepId() !== 'find')
                  : (revealLevel >= 2);
    if (showLines && active.lines) {
      const at = {};
      drawn.forEach(({ star, pos }) => { if (star.name) at[star.name] = pos; });
      ctx.save();
      ctx.strokeStyle = `rgba(${revealColor},0.55)`;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      active.lines.forEach(([a, b]) => {
        const pa = at[a], pb = at[b];
        // Skip an edge unless both ends are present: a star can be panned out
        // of frame or cut off by the magnitude limit.
        if (!pa || !pb) return;
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
      });
      ctx.stroke();
      ctx.restore();
    }

    // Plain first-press "reveal" (not yet "reveal more") flashes the figure
    // stars instead of lighting them solid: 1s on, 2s off, reverting to the
    // star's true colour/size while off so the eye can compare the
    // highlighted view against how the star actually looks.
    const inPlainReveal = revealLevel === 1 && !moreSeq;
    // Reveal-more's 'lead' and 'stars' phases: no more solid-red, doubled-
    // size figure. The lines (shown from the start now, see showLines
    // above) do the job of separating the figure from the field, so every
    // star — including the rest of the figure's own target stars — just
    // shows its own true size and colour here. The ONE exception is
    // whichever star's name is currently on screen: see flashTarget below.
    const moreEarly = moreSeq && (moreSeq.phase === 'lead' || moreSeq.phase === 'stars');

    drawn.forEach(({ star, pos }) => {
      if (pos.x < -10 || pos.x > W + 10 || pos.y < -10 || pos.y > H + 10) return;
      // The star currently being named: blink between fully invisible and
      // its own natural colour (MORE_STAR_FLASH_ON_MS/OFF_MS), rather than
      // any reveal colour. moreSeq.elapsed is time-since-this-star-became-
      // current (reset at the start of each star's span — see moreTick),
      // so the cycle restarts clean for every star and simply freezes in
      // place if the sequence pauses on a notable star's box, same as
      // everything else on screen does during that pause.
      const flashTarget = moreEarly && moreSeq.phase === 'stars' && star.name === moreStarFocus();
      if (flashTarget) {
        const cyclePos = moreSeq.elapsed % (MORE_STAR_FLASH_ON_MS + MORE_STAR_FLASH_OFF_MS);
        if (cyclePos >= MORE_STAR_FLASH_ON_MS) return; // off beat: fully hidden
      }
      if (star.nebula) {
        // Needs _pos/_tapR like any named star, or taps fall through to the
        // nearest bright star instead (Hatysa, 0.5 deg away).
        star._pos = pos;
        star._tapR = 24;
        drawNebula(star, pos, star === selectedStar);
        return;
      }
      const useReveal = !moreEarly && star.target && revealLevel >= 1 && (!inPlainReveal || revealFlashOn);
      // During the slideshow only the constellation taking its turn lights up.
      const nFocus = slideshow ? slideNeighbourFocus() : moreNeighbourFocus();
      const gated = slideshow || !!moreSeq;
      const useAdjacent = star.adjacentTo && revealLevel >= 2 &&
                          (!gated || (nFocus && star.adjacentTo === nFocus));
      const isSelected = star === selectedStar;
      const lit = useReveal || useAdjacent || isSelected;
      // Lit stars are drawn at double size, except during the plain-reveal
      // flash, where 2x read as blobby against the smaller natural stars
      // around it once you're comparing lit-vs-unlit — 1.5x keeps it
      // unambiguous without dominating the field. The point of the reveal is
      // to show the shape, and matching the true size makes the pattern hard
      // to pick out of the field it is embedded in. The figure used to step
      // up again on the second reveal to separate it from the neighbours,
      // but the figure lines do that job properly now, and the extra size
      // only made the bright stars blobby.
      // inPlainReveal (first press, flashing) stays at 1.5 — reported as the
      // right size. The solid reveal-more state (widen/neighbours, once
      // naming is done) was 2, reported too big; cut by 1/3 to 4/3.
      const litMult = inPlainReveal ? 1.5 : 4 / 3;
      const r = Math.max(STAR_MIN_RADIUS_PX, radiusForMag(star.mag) * (lit ? litMult : 1) * fovSizeMult());
      // Selection always wins — green overrides red/magenta so the tapped
      // star is unambiguous even mid-reveal.
      const rgb = isSelected ? selectedColor
                : useReveal ? revealColor
                : useAdjacent ? adjacentColor
                : (!USE_OLD_WARM_STYLE && star.bv >= WARM_CORE_BV_MIN)
                  ? colorForBV(star.bv, warmBlendForMag(star.mag))
                  : colorForBV(star.bv, blendForMag(star.mag));
      // Orange/red natural stars get a paler core fading through their real
      // colour rather than a flat saturated dot — see paleCoreFor above.
      // Scoped to unlit, non-adjacent, non-selected stars showing their own
      // spectral colour: the reveal highlight, neighbour-lit colour, and
      // selection green are fixed UI colours, not a star's own, and blue/
      // white stars are untouched per "blues are fine".
      const warmCore = !lit && !isSelected && star.bv >= WARM_CORE_BV_MIN;
      // The pale-core gradient stays visibly coloured further out than the
      // old flat one did (that's what lets the fade read as gradual rather
      // than abrupt), which made these stars' halos look a full size class
      // bigger than a same-magnitude white star sitting next to them — not
      // dimmer, just visually wider. Reported as ~1/3 too big; scaled down
      // to match.
      const glowR = r * (warmCore ? (USE_OLD_WARM_STYLE ? 3.2 * 2 / 3 : HALO_REACH) : 3.2);
      const spiky = !lit && r >= SPIKE_THRESHOLD;
      const irregular = !lit && r >= EDGE_THRESHOLD;

      const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, glowR);
      const glowA = lit ? 1 : alphaForMag(star.mag);
      if (warmCore && !USE_OLD_WARM_STYLE) {
        // Halo held at HALO_NEAR_ALPHA out to the disk edge (the disk covers
        // the inner part), easing to HALO_OUTER_ALPHA a little under half
        // way to glowR, then to zero.
        const haloRgb = mixRGB(rgb, '255,255,255', HALO_WHITENESS);
        const edge = Math.min(0.95, r / glowR);
        const mid = edge + (1 - edge) * 0.45;
        grad.addColorStop(0,    `rgba(${haloRgb},${HALO_NEAR_ALPHA * glowA})`);
        grad.addColorStop(edge, `rgba(${haloRgb},${HALO_NEAR_ALPHA * glowA})`);
        grad.addColorStop(mid,  `rgba(${haloRgb},${HALO_OUTER_ALPHA * glowA})`);
        grad.addColorStop(1,    `rgba(${haloRgb},0)`);
      } else if (warmCore) {
        const pale = paleCoreFor(rgb);
        const mid = mixRGB(pale, rgb, 0.55);
        // Split into two knobs instead of one uniform cut: a single warmA
        // applied to every stop was fading the CENTRE by the same amount
        // as the outer glow, which shrank the star's apparent size (the
        // point where it fades below visibility moved inward) rather than
        // just softening the halo — reported as reading smaller than
        // Bellatrix despite being brighter. coreA keeps the visible disk
        // close to its original strength/size; haloA is the heavy cut,
        // applied only to the outer glow stop, which is what "too obvious"
        // was actually about.
        const coreA = 0.55;
        const haloA = 0.1;
        grad.addColorStop(0,    `rgba(${pale},${0.92 * glowA * coreA})`);
        grad.addColorStop(0.3,  `rgba(${mid},${0.75 * glowA * coreA})`);
        grad.addColorStop(0.65, `rgba(${rgb},${0.45 * glowA * haloA})`);
        grad.addColorStop(1,    `rgba(${rgb},0)`);
      } else {
        grad.addColorStop(0, `rgba(${rgb},${0.9 * glowA})`);
        grad.addColorStop(0.4, `rgba(${rgb},${0.25 * glowA})`);
        grad.addColorStop(1, `rgba(${rgb},0)`);
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      if (spiky) {
        const spikeLen = r * 5.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const spikeGrad = ctx.createLinearGradient(pos.x - spikeLen, pos.y, pos.x + spikeLen, pos.y);
        [0, 0.42, 0.5, 0.58, 1].forEach((stop, i) => {
          const a = [0, 0.22, 0.4, 0.22, 0][i];
          spikeGrad.addColorStop(stop, `rgba(${rgb},${a})`);
        });
        ctx.strokeStyle = spikeGrad;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(pos.x - spikeLen, pos.y);
        ctx.lineTo(pos.x + spikeLen, pos.y);
        ctx.stroke();

        const spikeGradV = ctx.createLinearGradient(pos.x, pos.y - spikeLen, pos.x, pos.y + spikeLen);
        [0, 0.42, 0.5, 0.58, 1].forEach((stop, i) => {
          const a = [0, 0.22, 0.4, 0.22, 0][i];
          spikeGradV.addColorStop(stop, `rgba(${rgb},${a})`);
        });
        ctx.strokeStyle = spikeGradV;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y - spikeLen);
        ctx.lineTo(pos.x, pos.y + spikeLen);
        ctx.stroke();
        ctx.restore();
      }

      // Lit stars ignore the fade — a revealed figure star should read as
      // marked, not as faint.
      const coreAlpha = lit ? 1 : alphaForMag(star.mag);
      // Warm stars: the disk itself carries the pale centre. Before this,
      // the pale-core glow above sat entirely inside radius r (its pale and
      // mid stops end at ~0.64r), and this solid disk — drawn last in the
      // full saturated colour — covered it completely, so orange/red stars
      // showed as a saturated dot with a faint rim. Same pale -> mid -> full
      // progression as the glow, now across the disk, so the colour reads
      // as a tint at the edge rather than a flat fill.
      if (warmCore && !USE_OLD_WARM_STYLE) {
        // White disk with the colour laid over it: a continuous ramp from
        // DISK_TINT_CENTRE at the exact centre to DISK_TINT_EDGE at the exact
        // rim, bent by DISK_TINT_CURVE. Eleven stops so the curve reads as
        // smooth; at curve 1 it's a straight line.
        const cg = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, r);
        for (let i = 0; i <= 10; i++) {
          const f = i / 10;
          const tint = DISK_TINT_CENTRE + (DISK_TINT_EDGE - DISK_TINT_CENTRE) * Math.pow(f, DISK_TINT_CURVE);
          cg.addColorStop(f, `rgba(${mixRGB('255,255,255', rgb, tint)},${coreAlpha})`);
        }
        ctx.fillStyle = cg;
      } else if (warmCore) {
        const pale = paleCoreFor(rgb);
        const mid = mixRGB(pale, rgb, 0.55);
        const cg = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, r);
        cg.addColorStop(0,   `rgba(${pale},${coreAlpha})`);
        cg.addColorStop(0.55, `rgba(${mid},${coreAlpha})`);
        cg.addColorStop(1,   `rgba(${rgb},${coreAlpha})`);
        ctx.fillStyle = cg;
      } else {
        ctx.fillStyle = `rgba(${rgb},${coreAlpha})`;
      }
      ctx.beginPath();
      if (irregular && star.jitter) {
        const pts = star.jitter.length;
        for (let i = 0; i <= pts; i++) {
          const angle = (i / pts) * Math.PI * 2;
          const rr = r * star.jitter[i % pts];
          const px = pos.x + Math.cos(angle) * rr;
          const py = pos.y + Math.sin(angle) * rr;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else {
        ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
      }
      ctx.fill();

      star._pos = pos;
      star._r = Math.max(r, 6);
      // Tap target radius is separate from the visual dot radius. Named
      // stars (targets + neighbors) get a much larger floor since they're
      // what people actually try to tap — unnamed background stars keep the
      // small flat floor. The hit test below picks whichever qualifying
      // star's center is nearest the tap, so two named stars sitting close
      // together each still get their full radius on the side facing away
      // from the other; only the shared side yields, right at the midpoint.
      // Named stars get a generous target: 15px suited a mouse but was
      // smaller than a fingertip, so taps that looked dead centre could miss.
      // Scaling off the drawn radius too keeps a big glowing star tappable
      // right across the blob rather than only at its core.
      star._tapR = star.name ? Math.max(r * 2.2, 24) : Math.max(r, 6);
    });

    // Wide-only corner names (see the WIDE-FIELD ASTERISM block): switched
    // on the first time the field reaches its wide beat, then left on until
    // the card is left (loadCard) or reset (resetBtn). Drawn before the
    // constellation names so those can steer around them.
    if (active.wideLabels &&
        ((slideshow && slideStepId() === 'neighbours') ||
         (moreSeq && moreSeq.phase === 'neighbours'))) wideLabelsShown = true;
    const wideBoxes = (wideLabelsShown && active.wideLabels) ? drawWideLabels(drawn) : [];
    if (slideshow) { drawSlideTitle(drawn); drawSlideLabels(drawn, wideBoxes); }
    else {
      if (nameFlash) drawCardTitle(drawn);
      if (moreSeq) drawMoreLabels(drawn, wideBoxes);
    }
    // Always called, regardless of mode — it hides itself when not
    // applicable (starSubPhase() returns null outside 'stars'/'boxes'), so
    // switching to the slideshow or resetting mid-sequence can't leave a
    // stale box stuck on screen.
    updateMoreBoxes(drawn);
  }

  // =========================================================================
  // Field-of-view fitting: the target figure occupies `currentFraction` of
  // the card's width, regardless of aspect ratio, so different constellations
  // can be tuned to sit at whatever size makes them a genuine "find it"
  // exercise rather than either dominating the card or vanishing into it.
  // =========================================================================
  const BASE_FOV_H = 45;
  // Global default ceiling on vertical field of view — deliberately left
  // wide (matches the pre-rework value). A wide field still stretches the
  // sky at the card edges (originally measured under gnomonic, where scale
  // grows as 1/cos(theta) off the tangent point — at 160, half-angle 80,
  // the edge sits ~80 degrees off-axis, stretch >4x; under the current
  // stereographic projection the same edge grows as 1/cos²(theta/2),
  // roughly 1.5x at 70 degrees off-axis — see the SKY PROJECTION notes
  // above planeXY/projP) — visibly "unnatural" on some low/mid-dec cards
  // at the old rate, much less so now. Rather than lower this globally and
  // trade away slider travel on every wide constellation (Aquarius in
  // particular can't unfreeze its slider below roughly 120-140, being
  // angularly large to begin with — see the handoff/conversation this was
  // worked out in), each card can set its own lower ceiling via `maxFovH`
  // in its definition, the same pattern as `maxFraction`. Tune per-card as
  // the equator distortion is actually
  // judged, card by card, rather than globally.
  const MAX_FOV_H = 160;

  // How large the figure gets at the narrowest (most zoomed-in) end of the
  // slider, as a fraction of card width. Cards can override with their own
  // maxFraction when 0.65 still leaves them looking small.
  const DEFAULT_MAX_FRACTION = 0.65;

  // The widest vertical field this constellation can use: the card's own
  // `maxFovH` override if it has one, else the global MAX_FOV_H default.
  // Pole-guarding is NOT done here (and never shrinks this ceiling) — it's
  // handled separately, in applyPan, by letting the window's centre slide
  // away from the pole as it widens rather than by refusing to widen at
  // all. See applyPan's pole-guard comment; it only engages once a card's
  // near-pole edge would actually cross POLE_GUARD, so it's dormant for any
  // card that never gets that wide.
  function maxFovHFor(c) {
    return c.maxFovH || MAX_FOV_H;
  }

  // The narrow-field floor, but never above this card's own ceiling.
  function baseFovHFor(c) {
    // Half the ceiling, not the ceiling itself: clamping the floor to exactly
    // maxFovH leaves the two bounds equal, which pins the field to one value
    // just as surely as the original conflict did.
    //
    // Also never wider than the field the tightest zoom actually asks for. A
    // small constellation like Lyra needs only about 15 degrees to fill the
    // card, so a flat 45-degree minimum held it at arm's length and the top
    // half of its slider did nothing at all — the figure couldn't grow past
    // what 45 degrees allows however far you pushed it.
    const aspect = (W && H) ? W / H : 0.55;
    const ext = effHalfExtents(c);
    // Same width-only gap as fovForFraction/minAchievableFraction (see their
    // comments) — check height too, or this floor can end up below what the
    // figure's true height needs, letting the tightest zoom crop it.
    const neededFromWidth = fovHFromW(fovForHalfWidth(ext.hw, maxFractionFor(c)), aspect);
    const neededFromHeight = fovForHalfWidth(ext.hh, maxFractionFor(c));
    const needed = Math.max(neededFromWidth, neededFromHeight);
    return Math.min(BASE_FOV_H, maxFovHFor(c) * 0.5, needed);
  }

  // The widest field we allow sets a floor on how small a given figure can be
  // made. A broad constellation like Aquarius simply cannot be shrunk to a
  // quarter of a narrow card, so each card gets its own achievable slider
  // range rather than a range that silently does nothing over most of its
  // travel.
  // Slider floor (widest setting). Normally never below 0.15 — the figure
  // stays at least 15% of card width at any zoom. Asterism cards
  // (wideCenter) drop that clamp and go straight to the fraction at which
  // the field reaches maxFovH: at the wide end they're framing the
  // asterism, not their own figure, and a tiny figure (Canis Minor, ~1.5
  // degrees across) could otherwise never widen past ~20 degrees, far too
  // narrow to hold the Winter Triangle. Those cards also get a finer slider
  // step (see loadCard), since their floor can sit at a few hundredths.
  function sliderFloorFor(c) {
    const f = minAchievableFraction(c);
    return c.wideCenter ? f : Math.max(0.15, f);
  }

  function minAchievableFraction(c) {
    // Fall back to reading the element directly: on the very first card load
    // resize() hasn't run yet, so the cached W/H are still zero. Returning
    // the raw slider minimum there handed back a floor far below what this
    // card can actually achieve.
    const w = W || card.clientWidth;
    const h = H || card.clientHeight;
    if (!w || !h) return parseFloat(fovSlider.min);
    const ext = effHalfExtents(c);
    const wideFovH = maxFovHFor(c);
    const wideFovW = fovWFromH(wideFovH, w / h);
    // Same width-only blind spot as fovForFraction had (see its comment) —
    // check both axes at the wide end and take whichever makes the figure
    // more visually prominent, rather than assuming width is always the
    // binding one.
    return Math.max(
      screenFractionFor(ext.hw, wideFovW),
      screenFractionFor(ext.hh, wideFovH)
    );
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = card.clientWidth;
    H = card.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!active) return;
    const aspect = W / H;
    // A tilted figure is wider on screen than its own half-width, so when
    // rotation is on we fit against the worst-case rotated extent. Otherwise
    // a wide constellation like Aquarius would overflow the card once turned.
    // (effHalfExtents also applies the cos(dec) RA correction.)
    //
    // Was width-only (fovH derived purely from minFovW/aspect, hh never
    // checked) — the same gap fixed in fovForFraction, duplicated here
    // instead of calling it, which meant fixing that function alone didn't
    // fix the actual live render. This is the real one: FOV_H set here is
    // what render() and every star position on screen actually uses. See
    // fovForFraction's comment for the full story (Draco's footprint is
    // nearly square unrotated against a portrait card, so certain rotations
    // genuinely need more height than width alone ever implied — this is
    // what was cropping most of the figure, not a tuning-number problem).
    const ext = effHalfExtents(active);
    const fovHFromWidth = fovHFromW(fovForHalfWidth(ext.hw, currentFraction), aspect);
    const fovHFromHeight = fovForHalfWidth(ext.hh, currentFraction);
    FOV_H = Math.min(maxFovHFor(active), Math.max(baseFovHFor(active), fovHFromWidth, fovHFromHeight));
    FOV_W = fovWFromH(FOV_H, aspect);
    if (!fieldReady) { initField(active); fieldReady = true; }
    else { applyPan(active); }   // width slider moved: re-fit the existing pan
    render();
  }
  window.addEventListener('resize', resize);
  // The window resize event doesn't fire when the card itself changes size
  // from layout settling — fonts loading, the address bar collapsing, the
  // first paint landing. Until it settles, W and H are stale, so star
  // positions are computed against the wrong height and taps land displaced
  // (the symptom was the first card opened after a cold start needing to be
  // tapped slightly below the star). Watching the element directly catches
  // every one of those.
  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (active) resize(); }).observe(card);
  }

  // =========================================================================
  // Card lifecycle
  // =========================================================================
  function updateState() {
    if (slideshow) {
      paintSlideControls();
      // The name is drawn inside the card during playback, so the strip above
      // stays blank rather than showing it twice.
      nameReveal.classList.remove('show');
      render();
      return;
    }
    // Reveal-more waiting on the user — either paused on a notable star's
    // boxes (awaitingContinue) or paused because a star was tapped for its
    // info box (userPaused) — shows a lit "continue" instead of the inert
    // "revealed", so there's always a visible way to carry on.
    if (moreSeq && (moreSeq.awaitingContinue || moreSeq.userPaused)) {
      revealBtn.textContent = 'continue';
      revealBtn.classList.remove('disabled');
      revealBtn.classList.add('more-continue');
      nameReveal.classList.toggle('show', named);
      render();
      return;
    }
    revealBtn.textContent = revealLevel === 0 ? "reveal"
                          : revealLevel === 1 ? "reveal more"
                          : "revealed";
    revealBtn.classList.toggle('disabled', revealLevel >= 2);
    nameReveal.classList.toggle('show', named);
    render();
  }

  // The faintest magnitude a card's own lines actually need to stay
  // unbroken. Lines used to only ever connect target stars, which were
  // always curated well under the default limit — this only matters now
  // that a card's lines can connect neighbor stars too (Pegasus's Circlet
  // ring), so a neighbor line has the same "don't silently break" guarantee
  // a figure line always had. Returns -Infinity for a card with no lines,
  // so callers combining this with a target-only max are unaffected.
  function lineFaintest(c) {
    if (!c.lines || !c.lines.length) return -Infinity;
    const byName = {};
    [...c.target, ...c.neighbors].forEach(s => { if (s.name) byName[s.name] = s; });
    let max = -Infinity;
    c.lines.forEach(([a, b]) => {
      const sa = byName[a], sb = byName[b];
      if (sa) max = Math.max(max, sa.mag);
      if (sb) max = Math.max(max, sb.mag);
    });
    return max;
  }

  // Wide-end tilt check for asterism cards (see the WIDE-FIELD ASTERISM
  // block): with the view zoomed all the way out and panned onto
  // wideCenter, are all the wideLabels corner stars inside the card, clear
  // of the edge by a margin? Jumps to the widest fraction, runs the real
  // resize()/applyPan() path (pole guard included, so what passes here is
  // what the zoom-out will actually render), reads the positions, then
  // restores the fraction. All synchronous inside one task, so the
  // temporary wide frame is never painted.
  const WIDE_FIT_MARGIN_X = 0.08, WIDE_FIT_MARGIN_Y = 0.06;
  function wideCornersFit(c) {
    const keep = currentFraction;
    currentFraction = parseFloat(fovSlider.min);
    resize();
    const pts = starScreenPositions();
    const mx = W * WIDE_FIT_MARGIN_X, my = H * WIDE_FIT_MARGIN_Y;
    const ok = c.wideLabels.every(n => {
      const e = pts.find(d => d.star.name === n);
      return e && e.pos.x >= mx && e.pos.x <= W - mx && e.pos.y >= my && e.pos.y <= H - my;
    });
    currentFraction = keep;
    resize();
    return ok;
  }
  const WIDE_FIT_TRIES = 20;

  // ---- Narrow-end guard (stage 24) -----------------------------------------
  // The narrowest slider setting is "figure fills maxFraction of the card",
  // and the field that needs depends on the random tilt. For a big figure
  // (Ursa Major, Draco) a tilt that lays its long axis across the card's
  // short side needs a huge field to fit — the "narrow" end opened at ~114
  // deg on a 132/136-deg card, leaving almost no zoom range. Reported
  // intermittent because the tilt is random per open. Fix: re-pick tilts
  // that push the narrow end past NARROW_FOV_LIMIT; after NARROW_FIT_TRIES
  // misses, keep the best (narrowest) one seen. Asterism (wideCenter)
  // cards keep their own wideCornersFit retry and skip this.
  const NARROW_FOV_LIMIT = 90;
  const NARROW_FIT_TRIES = 16;
  function narrowFovAt(c) {
    const w = W || card.clientWidth, h = H || card.clientHeight;
    const aspect = (w && h) ? w / h : 0.55;
    const ext = effHalfExtents(c);
    const frac = maxFractionFor(c);
    const fromW = fovHFromW(fovForHalfWidth(ext.hw, frac), aspect);
    const fromH = fovForHalfWidth(ext.hh, frac);
    return Math.min(maxFovHFor(c), Math.max(baseFovHFor(c), fromW, fromH));
  }
  function pickNarrowSafeRotation(c) {
    const limit = c.narrowFovMax ?? NARROW_FOV_LIMIT;
    if (c.wideCenter) return pickRotation(c, viewingLat);
    let best = null, bestFov = Infinity;
    for (let i = 0; i < NARROW_FIT_TRIES; i++) {
      fieldRotation = pickRotation(c, viewingLat);
      const f = narrowFovAt(c);
      if (f <= limit) return fieldRotation;
      if (f < bestFov) { bestFov = f; best = fieldRotation; }
    }
    return best;
  }

  function loadCard(c, wideTry = 0) {
    // Defensive: an empty deck (every card switched off) has no id at the
    // current position, so byId() returns undefined. Reading centroidDec off
    // that threw on startup and took the whole app down — the symptom was a
    // blank card and "Uncaught Error: Script error." after using "all: off".
    if (!c) return;
    active = c;
    fieldReady = false;
    revealLevel = 0;
    wideLabelsShown = false;
    named = false;
    selectedStar = null;
    stopMoreSeq();
    nameFlash = false;
    clearTimeout(nameFlashTimer);
    stopRevealFlash();
    // The info panel belongs to a star on the card being left behind, so it
    // has to go with it. Swiping on with it still open left one card's star
    // data hanging over the next card's sky.
    closeInfo();
    fieldCosDec = Math.cos(c.centroidDec * Math.PI / 180);
    // Constellations really do present at different angles through the night
    // and across seasons, so the tilt makes recognition less dependent on one
    // memorised orientation. Chosen here, before the fit and placement maths
    // run, since both depend on it.
    // Asterism cards keep the deck's normal tilt range; a tilt that would
    // push a corner star off screen at the wide end is rejected at the
    // bottom of this function and redrawn (see wideCornersFit). After
    // WIDE_FIT_TRIES misses, fall back to the culmination angle, where the
    // asterism's north-south long axis runs along the tall side.
    fieldRotation = wideTry >= WIDE_FIT_TRIES ? culminationAngle(c, viewingLat)
                                             : pickNarrowSafeRotation(c);
    limitMag = globalMagOn ? globalMagValue : loadMag(c.id, 5.0);
    // Same reasoning as startMoreSeq's lift below, applied at load time and
    // widened to cover neighbor-connecting lines too (see lineFaintest) —
    // only ever raised, never lowered, so a global mag override or a
    // stored per-card value the person set themselves both still win.
    if (!globalMagOn) {
      const neededMag = lineFaintest(c);
      if (limitMag < neededMag) {
        limitMag = Math.min(parseFloat(magSlider.max), Math.ceil(neededMag * 10) / 10);
      }
    }
    magSlider.value = limitMag;
    magReadout.textContent = `limit mag ${limitMag.toFixed(1)}`;
    // Per-card narrow end, then the floor, then whichever fraction applies:
    // the one kept from earlier in this deck, or the narrowest if the card
    // hasn't been touched since the deck started.
    const ceil = maxFractionFor(c);
    fovSlider.max = ceil.toFixed(2);
    const floor = Math.min(ceil, sliderFloorFor(c));
    // Round the floor UP to the slider's step. toFixed() rounds to
    // nearest, which for a floor like 0.4647 yields 0.46 — below the true
    // minimum, so the slider's own widest setting sat just outside what the
    // card can actually render and quietly tripped the pole guard.
