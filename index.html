    function neatStars() {
      const stars = [];
      letters.forEach(L => L.pts.forEach(p => {
        if (!p.star) p.star = pick(brightPool);
        stars.push(p);
      }));
      return stars;
    }

    // ---- Timeline (seconds) — every phase doubled from the first pass,
    // which read as too fast. ----
    const T_FADE = 5.0;                 // background + hidden NEAT points fade in
    const T_RED_START = T_FADE;         // 5.0
    const T_RED_DUR = 5.0;              // NEAT points ease to reveal-red, holds
    const T_LINES_START = T_RED_START + T_RED_DUR; // 10.0
    const T_LINES_DUR = 4.0;            // lines fade in together, then stay up
    const T_WORDS_START = T_LINES_START + T_LINES_DUR; // 14.0
    const T_WORDS_FADE = 0.8;
    const T_ADVANCE = T_WORDS_START + 5.0; // was 10s after words appear, cut 50% per user

    const WORDS = ['Naked', 'Eye', 'Astronomy', 'Training'];  // 9-25 ver5: was 'Trainer'

    let skipped = false;
    let startTime = null;
    let rafId = null;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function finish() {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', introResize);
      overlay.removeEventListener('pointerdown', onTap);
      overlay.classList.remove('show');
      // The finger that dismissed the intro is still on its way down, and
      // without this it lands on the index underneath and opens whichever
      // constellation happened to be beneath it. Swallow taps on the index
      // for a moment afterwards. Applies however the intro was dismissed —
      // the skip button, a tap anywhere on the overlay, or the auto-advance.
      guardIndexTaps(1000);
    }

    function onTap() {
      if (skipped) return;
      skipped = true;
      finish();
    }
    overlay.addEventListener('pointerdown', onTap);

    function draw(elapsed) {
      ictx.clearRect(0, 0, iW, iH);
      ictx.fillStyle = '#000';
      ictx.fillRect(0, 0, iW, iH);

      const fadeT = Math.min(1, elapsed / T_FADE);
      const bgAlpha = easeOutCubic(fadeT);

      const redT = Math.min(1, Math.max(0, (elapsed - T_RED_START) / T_RED_DUR));
      const redEase = easeOutCubic(redT);

      const lineT = Math.min(1, Math.max(0, (elapsed - T_LINES_START) / T_LINES_DUR));
      const lineEase = easeOutCubic(lineT);

      const wordsT = Math.min(1, Math.max(0, (elapsed - T_WORDS_START) / T_WORDS_FADE));

      // Ordinary background stars — real catalog colour/size, plain fade in.
      backgroundStars.forEach(s => {
        const r = radiusForMag(s.mag) * 0.85;
        const rgb = colorForBV(s.bv, 0.6);
        ictx.beginPath();
        ictx.fillStyle = `rgba(${rgb},${bgAlpha})`;
        ictx.arc(s.x, s.y, r, 0, Math.PI * 2);
        ictx.fill();
      });

      // NEAT points: catalog colour while dim, crossfading to reveal-red as
      // redT advances. Sizes deliberately VARY star to star — they inherit
      // whatever magnitude their catalog star has, so the word reads like a
      // real patch of sky rather than a row of identical dots. The lines are
      // what reveal the word; the stars only have to be findable.
      const stars = neatStars();
      stars.forEach(p => {
        const r = radiusForMag(p.star.mag) * (0.95 + 1.65 * redEase);
        const catalogRgb = colorForBV(p.star.bv, 0.55);
        const rgb = redT <= 0 ? catalogRgb : lerpRgb(catalogRgb, revealColor, redEase);
        ictx.beginPath();
        ictx.fillStyle = `rgba(${rgb},${bgAlpha})`;
        ictx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ictx.fill();
      });

      // Connecting lines — all strokes fade in together as one wash, not
      // drawn on one at a time, then held.
      if (lineT > 0) {
        ictx.strokeStyle = `rgba(${revealColor},${0.9 * lineEase})`;
        // Matches the stick-figure line width used on the flashcards, so the
        // intro speaks the same visual language as the deck itself.
        ictx.lineWidth = 1.6;
        ictx.lineCap = 'round';
        letters.forEach(L => {
          L.lines.forEach(([a, b]) => {
            ictx.beginPath();
            ictx.moveTo(a.x, a.y);
            ictx.lineTo(b.x, b.y);
            ictx.stroke();
          });
        });
      }

      // Words — stacked vertically, neighbour-magenta, below the letters.
      // Left-justified so the first letters stack directly on top of each
      // other, rather than each word centring independently. The block as
      // a whole (measured by its widest word) is still centred on screen.
      if (wordsT > 0) {
        const size = Math.max(20, Math.min(34, iW * 0.075));
        const lineHeight = size * 1.5;
        const blockTop = iH * 0.44;
        ictx.save();
        ictx.font = `500 ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ictx.textAlign = 'left';
        const widest = Math.max(...WORDS.map(w => ictx.measureText(w).width));
        const leftX = (iW - widest) / 2;
        ictx.fillStyle = `rgba(${adjacentColor},${wordsT * 0.95})`;
        WORDS.forEach((w, i) => {
          ictx.fillText(w, leftX, blockTop + i * lineHeight);
        });
        ictx.restore();
      }
    }

    function lerpRgb(fromRgb, toRgbStr, t) {
      const from = fromRgb.split(',').map(Number);
      const to = toRgbStr.split(',').map(Number);
      const r = Math.round(from[0] + (to[0] - from[0]) * t);
      const g = Math.round(from[1] + (to[1] - from[1]) * t);
      const b = Math.round(from[2] + (to[2] - from[2]) * t);
      return `${r},${g},${b}`;
    }

    function tick(now) {
      if (skipped) return;
      if (startTime === null) startTime = now;
      const elapsed = (now - startTime) / 1000;
      draw(elapsed);
      if (elapsed >= T_ADVANCE) { finish(); return; }
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);

    // Test hook — jump straight to a given elapsed time instead of waiting
    // through the real ~12s runtime, and inspect letter geometry without
    // reimplementing it externally. Temporary, for Playwright use only.
    window.__neatIntro = {
      letterPointCounts: () => letters.map(L => L.pts.length),
      forceElapsed: (seconds) => { startTime = performance.now() - seconds * 1000; },
      skip: () => onTap(),
      isShowing: () => overlay.classList.contains('show'),
      timeline: { T_FADE, T_RED_START, T_RED_DUR, T_LINES_START, T_LINES_DUR, T_WORDS_START, T_ADVANCE }
    };
  }

  // Test hook for the play-count gate itself, independent of any one run.
  window.__neatIntroPlays = {
    get: () => { try { return parseInt(window.localStorage.getItem('neatIntroPlays') || '0', 10) || 0; } catch (e) { return 0; } },
    reset: () => { try { window.localStorage.removeItem('neatIntroPlays'); } catch (e) {} },
    setTo: (n) => { try { window.localStorage.setItem('neatIntroPlays', String(n)); } catch (e) {} }
  };

  // Briefly swallow taps on the index. Used after the NEAT intro is
  // dismissed, where the same finger press would otherwise carry through to
  // whatever is underneath. Capture phase so it runs before any row, button
  // or overlay handler gets a look in.
  let indexTapGuardUntil = 0;
  function guardIndexTaps(ms) {
    indexTapGuardUntil = performance.now() + ms;
  }
  ['pointerdown', 'click', 'touchstart'].forEach(evt => {
    indexOverlay.addEventListener(evt, e => {
      if (performance.now() < indexTapGuardUntil) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
  });

  // Native input[type=range] on iOS Safari only starts a drag if the touch
  // lands ON the thumb — tapping the track does nothing at all. With a 15px
  // thumb on a 250px track that's most of the width dead, which is why the
  // first touch "didn't take" perhaps half the time while the drag itself
  // felt fine once engaged. Desktop Chrome jumps the thumb to the tap
  // instead, so this never reproduced in the test harness.
  //
  // This drives the same <input> from pointer events: press anywhere on the
  // track to jump there and begin dragging immediately. The element keeps its
  // value/min/max/step, so every existing listener and readout still works.
  function makePointerSlider(el) {
    // Detect a horizontal CSS mirror (scaleX(-1), as used on .slider-row.fov
    // to put narrow-left/wide-right) via the actual computed transform
    // matrix rather than hardcoding which element it is — robust to the
    // class changing later. matrix.a is the x-scale component; negative
    // means horizontally flipped. Read once per element: the mirror is a
    // static style choice, not something that changes during a drag.
    //
    // BUG this fixes: native <input type=range> mirrors its hit-testing
    // along with its rendering when CSS-transformed, so a mirrored slider
    // still "follows the finger" under normal browser dragging (see the
    // scaleX(-1) comment in the CSS). setFromX below bypasses native
    // hit-testing entirely — it computes the value straight from physical
    // clientX — so for a mirrored element it was silently backwards: the
    // finger moving left dragged the thumb (and the value) right. Flipping
    // f here restores "finger position == visual thumb position" for a
    // mirrored slider, matching what native dragging already did.
    const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
    const mirrored = m.a < 0;
    const setFromX = (clientX) => {
      const r = el.getBoundingClientRect();
      const min = parseFloat(el.min), max = parseFloat(el.max);
      const step = parseFloat(el.step) || 1;
      // The thumb's centre can't reach the very edges of the track, so inset
      // by half a thumb at each end or the value never quite hits min/max.
      const thumb = 15, usable = Math.max(1, r.width - thumb);
      let f = (clientX - r.left - thumb / 2) / usable;
      if (mirrored) f = 1 - f;
      f = Math.max(0, Math.min(1, f));
      let v = min + f * (max - min);
      v = Math.round(v / step) * step;
      v = Math.max(min, Math.min(max, v));
      // Float steps (0.01, 0.1) accumulate binary noise; trim to the step's
      // own precision so readouts don't show 0.30000000000000004.
      const dp = (String(step).split('.')[1] || '').length;
      v = parseFloat(v.toFixed(dp));
      if (parseFloat(el.value) === v) return;
      el.value = v;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    };
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId);
      setFromX(e.clientX);
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (el.hasPointerCapture(e.pointerId)) setFromX(e.clientX);
    });
    const release = e => {
      if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  }
  [globalMagSlider, latSlider, fovSlider, magSlider].forEach(makePointerSlider);

  // Temporary test hook — exposes REAL internal state (not a reimplementation)
  // so Playwright can drive and inspect the slideshow without recomputing any
  // of the logic it's meant to be checking.
  window.__fovProbe = {
    narrowAt: (id, rot) => { const c = byId(id); const keep = fieldRotation;
      fieldRotation = rot; const f = narrowFovAt(c); fieldRotation = keep; return f; },
    culm: (id) => culminationAngle(byId(id), viewingLat),
    pickTest: (id) => { const c = byId(id); const keep = fieldRotation; const r = pickNarrowSafeRotation(c);
      fieldRotation = r; const f = narrowFovAt(c); fieldRotation = keep; return f; },
    range: (id) => { const c = byId(id); return rotationRangeFor(c, viewingLat) * (c.rotationScale ?? ROTATION_RANGE_SCALE); }
  };
  window.__slideProbe = { debugColor: (bv, blend) => colorForBV(bv, blend),
    moreNeighbourList: () => moreSeq ? moreSeq.neighbours : null,
    slideSchedule: (id) => {
      const c = byId(id);
      if (!c) return null;
      return slideStarSchedule(c).map(e => ({ name: e.name, start: e.start, end: e.end, hasNotable: !!e.star.notable }));
    },
    state: () => ({
      slideshow, slidePaused, slideStep, slideElapsed: Math.round(slideElapsed),
      stepId: slideStepId(), card: active ? active.name : null
    }),
    firstNamedStarScreenPos: () => {
      for (const s of allStars) {
        if (s._pos && s.mag <= limitMag && s.name) {
          const r = card.getBoundingClientRect();
          return { x: r.left + s._pos.x, y: r.top + s._pos.y, name: s.name };
        }
      }
      return null;
    },
    cardCorner: () => {
      const r = card.getBoundingClientRect();
      return { x: r.left + 10, y: r.top + 10 };
    },
    // Card-level checks: load a card and report the real slider bounds and
    // real projected star positions, rather than recomputing either outside.
    // Rotation model: expose the REAL functions so tests exercise the code
    // that ships, not a reimplementation of the same formulas.
    rotation: {
      setLat: (v) => { viewingLat = v; },
      getLat: () => viewingLat,
      culmination: (id) => culminationAngle(byId(id), viewingLat),
      range: (id) => rotationRangeFor(byId(id), viewingLat),
      sample: (id, n) => {
        const c = byId(id), out = [];
        for (let i = 0; i < n; i++) out.push(pickRotation(c, viewingLat));
        return out;
      },
      current: () => fieldRotation,
      setRangeScale: (s) => { ROTATION_RANGE_SCALE = s; },
      getRangeScale: () => ROTATION_RANGE_SCALE
    },
    // Stage 4 visual-pass helper: the real reveal-more sequence times lines
    // in only after a 'lead' pause and a full per-star cycle (slow, and
    // scales with target count — Draco has 14). This fast-forwards moreSeq
    // straight to the 'lines' phase and re-renders, using the SAME phase
    // value render()'s own showLines check reads, so the screenshot is the
    // real drawLines-branch output, not a re-implementation of it.
    forceLinesPhase: () => {
      if (moreSeq) { moreSeq.phase = 'lines'; moreSeq.elapsed = 0; }
      render();
      return moreSeq ? moreSeq.phase : null;
    },
    ids: () => CONSTELLATIONS.map(c => c.id),
    closeIndex: () => closeIndex(),
    openInfoFor: (name) => {
      const s = [...active.target, ...active.neighbors].find(x => x.name === name);
      if (!s) return null;
      openInfo(s);
      return document.getElementById('infoBody').innerText;
    },
    revealState: () => {
      // One combined box now (see updateMoreBoxes) — these fields stay for
      // backward compatibility with earlier test scripts, redefined to read
      // from the single box: notableBoxShowing/HTML pull just the notable
      // sub-section out of it, rather than a second box's own state.
      const notableEl = moreInfoBox.querySelector('.mb-notable-text');
      return {
        level: revealLevel, flashOn: revealFlashOn, hasFlashTimer: !!revealFlashTimer,
        moreSeqPhase: moreSeq ? moreSeq.phase : null,
        moreSeqElapsed: moreSeq ? moreSeq.elapsed : null,
        subPhase: starSubPhase(),
        starFocus: moreStarFocus(),
        infoBoxShowing: moreInfoBox.classList.contains('show'),
        notableBoxShowing: moreInfoBox.classList.contains('show') && !!notableEl,
        infoBoxHTML: moreInfoBox.innerHTML,
        notableBoxHTML: notableEl ? notableEl.outerHTML : '',
        infoBoxRect: { top: moreInfoBox.style.top, bottom: moreInfoBox.style.bottom, left: moreInfoBox.style.left },
        notableBoxRect: { top: moreInfoBox.style.top, bottom: moreInfoBox.style.bottom, right: moreInfoBox.style.right },
      };
    },
    // Tuning helpers for maxFovH/maxFraction: read a card's current override
    // values, and patch them live in this running page (no file edit/reload
    // needed) so a target FOV can be found by iterating quickly, then copied
    // back into the card's real definition once confirmed.
    cardOverrides: (id) => {
      const c = byId(id);
      return {
        maxFraction: c.maxFraction ?? null, maxFovH: c.maxFovH ?? null,
        maxGuardStep: c.maxGuardStep ?? null, rotationScale: c.rotationScale ?? null
      };
    },
    patchCard: (id, patch) => { Object.assign(byId(id), patch); },
    // Reads the wide (slider min) and narrow (slider max) FOV in degrees for
    // a card, exactly as the on-card readout would show them, without
    // needing a full loadAndInspect + UI event round-trip.
    fovRange: (id, forceRotation) => {
      goToId(id);
      if (forceRotation !== undefined && forceRotation !== null) fieldRotation = forceRotation;
      // Recomputed directly from the underlying functions, at whatever
      // rotation is now active, rather than read off fovSlider.min/max —
      // those were set during goToId() using rotation as it stood THEN,
      // which is now stale if forceRotation just changed it.
      const ceil = maxFractionFor(active);
      const floor = sliderFloorFor(active);
      const wide = fovForFraction(active, floor);
      const narrow = fovForFraction(active, ceil);
      return {
        wideFov: Math.round(wide.fovH * 10) / 10,
        narrowFov: Math.round(narrow.fovH * 10) / 10,
        floor: Math.round(floor * 1000) / 1000, ceil,
        rotation: Math.round(fieldRotation * 10) / 10,
        frozen: Math.abs(floor - ceil) < 1e-6 || wide.fovH - narrow.fovH < 0.5
      };
    },
    // How far the figure centroid's TRUE projected position sits from the
    // screen anchor applyPan() intended. Zero under the old linear formula
    // by construction; the move to a true tangent-plane projection makes
    // applyPan's pointing choice an approximation again (see applyPan's own
    // Newton-correction comment), so this should be small but is no longer
    // exactly zero. Used to decide whether that drift needs correcting.
    anchorDrift: () => {
      const p = project({ ra: active.centroidRA, dec: active.centroidDec });
      return {
        dxPx: p.x - anchorX, dyPx: p.y - anchorY,
        dxPct: 100 * (p.x - anchorX) / W, dyPct: 100 * (p.y - anchorY) / H,
        rotation: fieldRotation, fovW: FOV_W, fovH: FOV_H,
        fieldCenterDec, fieldCenterRA, centroidDec: active.centroidDec
      };
    },
    offscreenDetail: () => {
      const off = [];
      allStars.forEach(s => {
        if (!s.target || !s._pos) return;
        if (s._pos.x < 0 || s._pos.x > W || s._pos.y > H || s._pos.y < 0) {
          off.push({ name: s.name, x: Math.round(s._pos.x), y: Math.round(s._pos.y) });
        }
      });
      const { hw, hh } = effHalfExtents(active);
      return {
        off, W, H, fovW: FOV_W, fovH: FOV_H, rotation: fieldRotation,
        currentFraction, effHw: hw, effHh: hh,
        anchorX, anchorY
      };
    },
    // Debug-only: every target star's real projected screen position, for
    // building numbered-dot reference diagrams against the actual
    // rendering rather than a separately-derived plot. Same pattern as
    // offscreenDetail above, just unfiltered.
    allTargetPositions: () => {
      const out = [];
      allStars.forEach(s => {
        if (!s.target || !s._pos) return;
        out.push({ name: s.name, mag: s.mag, x: s._pos.x, y: s._pos.y });
      });
      return { stars: out, W, H, fovW: FOV_W, fovH: FOV_H, rotation: fieldRotation };
    },
    loadAndInspect: (id) => {
      goToId(id);
      const mn = parseFloat(fovSlider.min), mx = parseFloat(fovSlider.max);
      let offscreen = 0, drawnTargets = 0;
      allStars.forEach(s => {
        if (!s.target || !s._pos) return;
        drawnTargets++;
        if (s._pos.x < 0 || s._pos.x > W || s._pos.y < 0 || s._pos.y > H) offscreen++;
      });
      return {
        name: active.name, targets: active.target.length,
        lines: active.lines.length, labels: active.labels || [],
        min: mn, max: mx, frozen: Math.abs(mx - mn) < 1e-9,
        drawnTargets, offscreen, faintest: Math.max(...active.target.map(s => s.mag))
      };
    },
    // Stage 2 sweep helper: force the slider fraction to an exact value
    // (0..1, same units as fovSlider) and re-run resize(), then report
    // exactly what loadAndInspect reports — but at that specific fraction,
    // not whatever sessionFraction happened to restore. forceRotation lets
    // the sweep also pin rotation (e.g. the range extremes) instead of
    // whatever pickRotation chose at goToId-time.
    setFractionAndInspect: (id, fraction, forceRotation) => {
      goToId(id);
      if (forceRotation !== undefined && forceRotation !== null) fieldRotation = forceRotation;
      currentFraction = fraction;
      fovSlider.value = fraction;
      resize();
      let offscreen = 0, drawnTargets = 0, offNames = [];
      allStars.forEach(s => {
        if (!s.target || !s._pos) return;
        drawnTargets++;
        if (s._pos.x < 0 || s._pos.x > W || s._pos.y < 0 || s._pos.y > H) {
          offscreen++; offNames.push(s.name);
        }
      });
      return {
        name: active.name, fraction, rotation: Math.round(fieldRotation * 10) / 10,
        fovW: Math.round(FOV_W * 10) / 10, fovH: Math.round(FOV_H * 10) / 10,
        drawnTargets, offscreen, offNames
      };
    }
  };

  // Open on the index rather than a card: it's the deck's front door now
  // that the start card is gone. A card is still loaded underneath so the
  // canvas is sized and ready the moment start is pressed. The NEAT intro,
  // when it plays, is a fully opaque overlay on top of this — the app
  // underneath is ready and waiting the instant it lifts, no dependency
  // between the two.
  showDeckPosition();
  openIndex();
  runIntroIfDue();
  window.addEventListener('load', () => { if (active) resize(); });
  setTimeout(() => { if (active) resize(); }, 50);
})();
</script>

<script>
  // Offline support: the service worker caches the app so it opens without
  // a connection after the first visit. Only over https (GitHub Pages).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
